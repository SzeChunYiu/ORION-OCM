name: GMI Planning-Stopping v1

on:
  push:
    paths:
      - 'research/gmi-planning-stopping-v1/**'
  pull_request:
    paths:
      - 'research/gmi-planning-stopping-v1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          python3 -I -B research/gmi-planning-stopping-v1/test_planning_stopping_v1.py -v
