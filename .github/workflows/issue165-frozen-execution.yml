name: Issue 165 frozen execution and evidence
on:
  push:
    branches: [research/issue165-execution-20260909]
    paths: ['.github/workflows/issue165-frozen-execution.yml']
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  frozen-203:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE: ${{ runner.temp }}/issue165-frozen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29c0ec40bb377152e24b5e9cd5ad133daae6fa36
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Retain exact source and live issue snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/snapshots"
          test "$(git rev-parse HEAD)" = 29c0ec40bb377152e24b5e9cd5ad133daae6fa36
          git rev-parse HEAD > "$EVIDENCE/EXECUTED_COMMIT.txt"
          git ls-tree -r HEAD > "$EVIDENCE/GIT-TREE.txt"
          git archive --format=tar.gz HEAD research/goal-only-lifecycle-v1 .github/workflows/goal-only-lifecycle.yml > "$EVIDENCE/PR203_SOURCE.tar.gz"
          python - <<'PY'
          import hashlib, json, os, platform, sys, urllib.request
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          root = 'https://api.github.com/repos/SzeChunYiu/ORION-OCM'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'ORION-OCM-issue165-readonly'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          numbers = [165,192,193,187,203,204,152,71,70,115,196,151,149,73,38,144,49,143,50,52,43,44,45,46,47,48]
          for number in numbers:
              issue = get('/issues/' + str(number))
              comments = []
              for page in range(1,100):
                  rows = get('/issues/' + str(number) + '/comments?per_page=100&page=' + str(page))
                  comments.extend(rows)
                  if len(rows) < 100:
                      break
              else:
                  raise RuntimeError('Comment pagination incomplete')
              record = {'issue': issue, 'comments': comments}
              if 'pull_request' in issue:
                  record['pull'] = get('/pulls/' + str(number))
              (out/'snapshots'/('issue-' + str(number) + '.json')).write_text(json.dumps(record, indent=2) + '\n')
          (out/'snapshots'/'main.json').write_text(json.dumps(get('/commits/main'), indent=2) + '\n')
          (out/'ENVIRONMENT.json').write_text(json.dumps({'python':sys.version, 'executable':sys.executable, 'platform':platform.platform(), 'run_id':os.environ['GITHUB_RUN_ID'], 'workflow_commit':os.environ['GITHUB_SHA'], 'scope':'Author-executed repeat of an exposed frozen development allocation; not independent replication.'}, indent=2) + '\n')
          PY
      - name: Recover exactly the registered library inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])/'bundle'
          out.mkdir()
          with zipfile.ZipFile('research/ordinary-goal-cohort-result-v1/RAW.zip') as z:
              base = z.read('base/PREFIX.mm')
              suffix = z.read('caller/qualification-01/TRANSPORTED-SUFFIX.mm')
              (out/'base.mm').write_bytes(base)
              (out/'joined.mm').write_bytes(base + b'\n' + suffix)
              (out/'manifest.json').write_bytes(z.read('caller/qualification-01/LIBRARY-MANIFEST.json'))
              (out/'receipt.json').write_bytes(z.read('caller/qualification-01/native-01/result.json'))
          PY
      - name: Authored controls under normal and optimized Python
        shell: bash
        run: |
          set -euo pipefail
          python research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "$EVIDENCE/normal.log"
          python -O research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "$EVIDENCE/optimized.log"
      - name: Reproduce the frozen allocation without changing any limit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$EVIDENCE/allocation-time.txt" python research/goal-only-lifecycle-v1/allocation.py --manifest "$EVIDENCE/bundle/manifest.json" --prefix "$EVIDENCE/bundle/joined.mm" --repo "$GITHUB_WORKSPACE" --out "$EVIDENCE/allocation" 2>&1 | tee "$EVIDENCE/allocation.log"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          task = Path(os.environ['EVIDENCE'])/'allocation/TASKS.json'
          digest = hashlib.sha256(task.read_bytes()).hexdigest()
          if digest != '11aa5ae4f887dda9606b4f2def3aa3432811977027fd4a52bc709e7ed8d5a92d':
              raise RuntimeError('Frozen task identity mismatch: ' + digest)
          print('EXACT_FROZEN_TASK_IDENTITY', digest)
          PY
      - name: Execute unchanged three-arm study
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$EVIDENCE/execution-time.txt" python research/goal-only-lifecycle-v1/lifecycle.py --repo "$GITHUB_WORKSPACE" --bundle "$EVIDENCE/bundle" --tasks "$EVIDENCE/allocation/TASKS.json" --output "$EVIDENCE/run" --hard-wall 150 2>&1 | tee "$EVIDENCE/execution.log"
      - name: Retain all outcomes and verify source custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain > "$EVIDENCE/WORKTREE_STATUS.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE'])
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name != 'FILES.json':
                  data = p.read_bytes()
                  rows.append({'path':str(p.relative_to(root)), 'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()})
          (root/'FILES.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue165-frozen203-${{ github.run_id }}
          path: ${{ runner.temp }}/issue165-frozen/
          retention-days: 30
          if-no-files-found: error
