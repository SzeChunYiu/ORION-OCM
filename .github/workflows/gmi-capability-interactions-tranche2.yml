name: GMI capability interactions (F3 tranche 2)

on:
  pull_request:
    paths:
      - 'research/gmi-capability-interactions-v2/**'
      - '.github/workflows/gmi-capability-interactions-tranche2.yml'
  push:
    paths:
      - 'research/gmi-capability-interactions-v2/**'
      - '.github/workflows/gmi-capability-interactions-tranche2.yml'
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact controls
        shell: bash
        run: |
          if [ "${{ matrix.optimized }}" = "true" ]; then
            python3 -I -O -B research/gmi-capability-interactions-v2/test_capability_interactions_v2.py -v
          else
            python3 -I -B research/gmi-capability-interactions-v2/test_capability_interactions_v2.py -v
          fi
