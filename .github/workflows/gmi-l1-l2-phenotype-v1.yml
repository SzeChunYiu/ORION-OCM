name: gmi-l1-l2-phenotype-v1
on:
  push:
    paths: ["research/gmi-l1-l2-phenotype-v1/**", ".github/workflows/gmi-l1-l2-phenotype-v1.yml"]
  pull_request:
    paths: ["research/gmi-l1-l2-phenotype-v1/**", ".github/workflows/gmi-l1-l2-phenotype-v1.yml"]
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix: { mode: [normal, optimized] }
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: research/gmi-l1-l2-phenotype-v1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tests
        run: |
          if [[ "${{ matrix.mode }}" == "optimized" ]]; then PY="python -O"; else PY="python"; fi
          $PY test_l1_l2_phenotype_v1.py -v
