name: G3 representation improvement

on:
  pull_request:
    paths:
      - 'research/g3-representation-v1/**'
      - '.github/workflows/g3-representation.yml'
      - 'research/g2-cognitive-objects-v1/schemas/representation_change_v1.json'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/kso/**'
      - 'src/ocm/store/**'
  push:
    branches: [main]
    paths:
      - 'research/g3-representation-v1/**'
      - '.github/workflows/g3-representation.yml'

permissions:
  contents: read

jobs:
  prospective-representation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g3-representation-v1:${{ github.workspace }}/research/g2-cognitive-objects-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Freeze controls
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g3-repr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/g3-representation-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/g3-representation-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Prospective representation study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g3-repr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/time -v python -B research/g3-representation-v1/experiment.py --out "$out/result.json" \
            2> >(tee "$out/time-and-stderr.txt" >&2) \
            | tee "$out/console.txt"
      - name: Source custody
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-representation
          path: '${{ runner.temp }}/g3-repr-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
