name: GMI capability ceilings (F2 all eleven)

on:
  pull_request:
    paths:
      - "research/gmi-capability-ceilings-v1/**"
      - ".github/workflows/gmi-capability-ceilings.yml"
  push:
    branches: [main]
    paths:
      - "research/gmi-capability-ceilings-v1/**"
      - ".github/workflows/gmi-capability-ceilings.yml"
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact and hostile controls
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "optimized" ]; then
            python3 -I -O -B research/gmi-capability-ceilings-v1/test_capability_ceilings_v1.py -v
          else
            python3 -I -B research/gmi-capability-ceilings-v1/test_capability_ceilings_v1.py -v
          fi
