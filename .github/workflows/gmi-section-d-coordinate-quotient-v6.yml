name: GMI Section D coordinate quotient v6

on:
  pull_request:
    paths:
      - 'research/gmi-section-d-coordinate-quotient-v6/**'
      - '.github/workflows/gmi-section-d-coordinate-quotient-v6.yml'
  workflow_dispatch:

jobs:
  exact-coordinate-quotient:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact receipt
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-d-coordinate-quotient-v6
          OUT="${RUNNER_TEMP}/RESULT_V6.${{ matrix.mode }}.json"
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O section_d_coordinate_quotient_witness.py --output "$OUT"
          else
            python section_d_coordinate_quotient_witness.py --output "$OUT"
          fi
          python - "$OUT" <<'PY'
          import json, pathlib, sys
          committed=json.loads(pathlib.Path('RESULT_V6.json').read_text())
          reproduced=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if committed != reproduced:
              raise SystemExit('V6 receipt semantic mismatch')
          PY
      - name: Run hostile and theorem checks
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-d-coordinate-quotient-v6
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O -m unittest -v test_section_d_coordinate_quotient.py
          else
            python -m unittest -v test_section_d_coordinate_quotient.py
          fi
      - name: Source custody
        run: git diff --exit-code
