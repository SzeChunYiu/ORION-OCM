name: GMI development amortization (H)

on:
  pull_request:
    paths:
      - 'research/gmi-development-amortization-v1/**'
      - '.github/workflows/gmi-development-amortization-v1.yml'
  push:
    paths:
      - 'research/gmi-development-amortization-v1/**'
      - '.github/workflows/gmi-development-amortization-v1.yml'
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact controls (normal)
        run: python -I -B research/gmi-development-amortization-v1/test_development_amortization_v1.py -v
      - name: Run exact controls (optimized)
        run: python -I -O -B research/gmi-development-amortization-v1/test_development_amortization_v1.py -v
