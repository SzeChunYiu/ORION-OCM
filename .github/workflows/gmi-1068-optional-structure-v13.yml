name: gmi-1068-optional-structure-v13
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-optional-structure-v13.yml'
jobs:
  optional-structure-and-original-atoms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=3b12c35bdb55cf27b2650c5ebcf3a61782e40d6e
          P=research/gmi-1068-optional-structure-v13
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V13.md"
          if /usr/bin/git cat-file -e "$F:$P/optional_v13.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V13.md"
          V=research/gmi-1068-recursive-audit-v12/SCOPE_SNAPSHOT_V12.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v12.json
          cmp /tmp/gmi-v12.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v13/SCOPE_SNAPSHOT_V13.json --predecessor "$V" --output /tmp/gmi-v13-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          P=research/gmi-1068-optional-structure-v13
          python3 -I -B "$P/check_optional_v13.py" > /tmp/optional-v13.json
          python3 -I -O -B "$P/check_optional_v13.py" > /tmp/optional-v13-opt.json
          cmp /tmp/optional-v13.json /tmp/optional-v13-opt.json
      - name: All-round successor integrity
        run: |
          P=research/gmi-1068-recursive-audit-v13
          python3 -I -B "$P/check_snapshot_v13.py"
          python3 -I -O -B "$P/check_snapshot_v13.py"
          python3 -I -B "$P/test_snapshot_v13.py"
          python3 -I -O -B "$P/test_snapshot_v13.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V13.json" --baseline /tmp/gmi-v13-ci-base.json --changed-files /tmp/gmi-changed.txt
