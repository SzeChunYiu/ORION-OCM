name: GMI 833 AE morphology sweep v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-morphology-sweep-v1/**'
      - '.github/workflows/gmi-833-ae-morphology-sweep-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-morphology-sweep-v1/**'
      - '.github/workflows/gmi-833-ae-morphology-sweep-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=a9b5de6154fb4758523133b6e07255adc4dababc
          pkg=research/gmi-833-ae-morphology-sweep-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/morphology_sweep_v1.py" \
            "$pkg/independent_sweep_oracle_v1.py" \
            "$pkg/test_morphology_sweep_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/SWEEP_THEOREMS_V1.md" \
            "$pkg/PARENT_OWNERSHIP_V1.md" \
            "$pkg/CORE.md" \
            "$pkg/ISSUE_833_RECONCILIATION_AE_MORPHOLOGY_SWEEP_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            actual="$(git rev-parse "HEAD:$1")"
            test "$actual" = "$2"
          }
          verify_parent research/gmi-833-morphology-selection-schema-v1/RESULT_V1.json 2adeddd201705e1583c2f4a858f679a3883a8227
          verify_parent research/gmi-833-morphology-selection-v1/RESULT_V1.json 6511cba495ea33ea5c9f1adaa75bedf81baddc9b
          verify_parent research/gmi-833-global-vs-reachable-morphology-v1/RESULT_V1.json 37a0dda56649c02de1dd733b20a1266d481a3d30
          verify_parent research/gmi-833-finite-candidate-space-v1/RESULT_V1.json 4086d6bea440d626e48d92eb35d39267a010589e
          verify_parent research/gmi-833-finite-morphology-metrics-v1/RESULT_V1.json b5bafc0ac9460de87723a27fe1a307ae7d06751b
          verify_parent research/gmi-833-ae-ae10-usable-information-v1/RESULT_V1.json 69aafebec4016f539c46b1f71546f740a8018421
          verify_parent research/gmi-833-ae-ae1-structure-separation-v1/RESULT_V1.json ceb77f5beac99b5427d1350915b19df546495fb8
      - name: Exact sweep tests, two routes, hostiles and nulls
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-morphology-sweep-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_morphology_sweep_v1.py" -v
            python -I -O -B "$pkg/morphology_sweep_v1.py" > /tmp/sweep.json
          else
            python -I -B "$pkg/test_morphology_sweep_v1.py" -v
            python -I -B "$pkg/morphology_sweep_v1.py" > /tmp/sweep.json
          fi
          cmp /tmp/sweep.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-morphology-sweep-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE_MORPHOLOGY_SELECTION_PREDICTOR_COMPARISON_'
                      'AT_REGISTERED_FINITE_SCOPE')
          assert m['claim_ceiling'] == r['claim_ceiling'] == expected
          assert m['source_main'] == r['source_main'] == (
              '349c2e62c4ae01f52cf66f61e4dacdbdfcf10071')
          assert m['freeze_commit'] == r['freeze_commit'] == (
              'a9b5de6154fb4758523133b6e07255adc4dababc')
          assert r['verdict'] == 'GREEN' and all(r['checks'].values())
          assert r['rows_closed'] == m['rows_closed'] == 4
          res = r['results']
          s1 = res['SWEEP_1_raw_information']['census']
          assert s1['worlds_used'] == 256
          assert s1['conflicting_pairs'] == 4348
          assert s1['equal_value_pairs'] == 10292
          assert s1['functionally_determines_selection'] is False
          s2 = res['SWEEP_2_usable_information_scalar']['census']
          assert s2['conflicting_pairs'] == 9576
          assert s2['equal_value_pairs'] == 17744
          s3 = res['SWEEP_3_resource_conditioned_vector']
          assert s3['census']['conflicting_pairs'] == 0
          assert s3['census']['distinct_values'] == 11
          assert s3['non_vacuity']['distinct_worlds'] == 256
          assert s3['non_vacuity']['strictly_finer_than_raw_information'] is True
          assert s3['non_vacuity']['strictly_finer_than_usable_scalar'] is True
          assert s3['minimal_sufficient_subvectors'] == [[
              'm0_constant', 'm1_arity1_junta', 'm2_arity2_junta']]
          assert len(s3['subvector_census']) == 31
          pb = s3['price_B_reproduction']
          assert pb['raw_information_conflicting_pairs'] == 3568
          assert pb['usable_r0_conflicting_pairs'] == 9576
          assert pb['profile_conflicting_pairs'] == 0
          s4 = res['SWEEP_4_locality_phase_boundary']
          assert s4['locality_exploitable_order_parity'] == 3
          assert s4['locality_exploitable_order_and'] == 2
          assert s4['profile_parity']['m2_arity2_junta'] == '1/2'
          assert s4['profile_parity']['m4_gf2_affine'] == '1'
          assert s4['profile_and']['m2_arity2_junta'] == '1'
          assert s4['selection_parity_at_tau_star'] == ['m4_gf2_affine']
          assert s4['selection_and_at_tau_star'] == ['m2_arity2_junta']
          assert s4['displacement_boundary_tau'] == '1/2'
          s5 = res['SWEEP_5_causal_intervention']
          assert s5['observational_joints_identical'] is True
          assert s5['interventional_joints_identical'] is False
          assert s5['observational_selection_L'] == s5['observational_selection_R']
          assert s5['interventional_selection_L'] == [
              'SELECTED', ['m1_arity1_junta']]
          assert s5['interventional_selection_R'] == [
              'NO_VIABLE_MORPHOLOGY', []]
          s6 = res['SWEEP_6_ae5_scalar_family']['scalars']
          assert s6['predictive_state_cardinality']['conflicting_pairs'] == 8712
          assert s6['linear_predictive_rank']['conflicting_pairs'] == 10172
          assert s6['registered_description_length']['conflicting_pairs'] == 12818
          assert s6[
              'causal_state_entropy_certified_lower_bound'
          ]['conflicting_pairs'] == 2968
          assert len(r['hostiles']) == 5
          for h in r['hostiles']:
              assert h['perturbation_moved_its_quantity'], h['id']
              assert h['detected'], h['id']
          n = r['null']
          assert n['shuffle_trials'] == 200
          assert n['shuffle_trials_with_zero_conflicts'] == 0
          assert n['shuffle_min_conflicts'] > 0
          assert n['true_profile_conflicts'] == 0
          assert n['sel1_pareto_violations'] == 0
          assert n['random_prices_where_raw_information_still_fails'] == 200
          assert r['checks']['kolmogorov_complexity_not_computed'] is True
          assert len(m['parent_pins']) == 7
          print('AE morphology sweep manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-morphology-sweep-v1')
          spec = json.loads((
              root / 'ISSUE_833_RECONCILIATION_AE_MORPHOLOGY_SWEEP_V1.json'
          ).read_text())
          assert spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2'
          assert spec['issue'] == 833
          assert spec['issue_comment_id'] == 5692689542
          assert len(spec['replacements']) == 4
          assert len(spec['not_closed']) == 1
          seen = set()
          anchors = set()
          for rep in spec['replacements']:
              assert rep['old'].startswith('- [ ] ')
              assert rep['new'].startswith('- [x] ')
              assert rep['new'][6:].startswith(rep['old'][6:])
              assert rep['old'] not in seen
              seen.add(rep['old'])
              assert rep['anchor'].startswith('### AE')
              anchors.add(rep['anchor'])
          assert len(anchors) == 4
          assert spec['not_closed'][0]['old'] not in seen
          print('AE morphology sweep reconciliation spec OK')
          PY
