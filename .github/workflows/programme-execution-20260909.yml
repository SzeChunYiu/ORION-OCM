name: Programme evidence sync and unchanged PR203 repeat
# Controller correction: preserve the master issue's pre-existing closed state.
# The failed pre-write attempt and frozen experiment source remain unchanged.
on:
  push:
    branches: [research/programme-execution-20260909]
    paths: ['.github/workflows/programme-execution-20260909.yml']
permissions:
  contents: read
concurrency:
  group: programme-evidence-sync-20260909
  cancel-in-progress: false
jobs:
  sync-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Reconcile scoped evidence, preserve unrelated roadmap and issue state
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIR: ${{ runner.temp }}/roadmap-evidence
        run: python research/programme-execution-20260909/sync_165.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/roadmap-evidence/
          retention-days: 30
          if-no-files-found: error
  unchanged-pr203:
    needs: sync-roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 29c0ec40bb377152e24b5e9cd5ad133daae6fa36
          path: frozen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Archive the exact unchanged experiment source
        working-directory: frozen
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 29c0ec40bb377152e24b5e9cd5ad133daae6fa36
          mkdir -p "${RUNNER_TEMP}/frozen-source"
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/frozen-source/checkout.tar.gz"
          git ls-tree -r HEAD > "${RUNNER_TEMP}/frozen-source/GIT-TREE.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/frozen-source/COMMIT.txt"
          git rev-parse HEAD^{tree} > "${RUNNER_TEMP}/frozen-source/TREE.txt"
          sha256sum "${RUNNER_TEMP}/frozen-source/checkout.tar.gz" > "${RUNNER_TEMP}/frozen-source/ARCHIVE-SHA256.txt"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: unchanged-pr203-source-29c0ec4
          path: ${{ runner.temp }}/frozen-source/
          retention-days: 7
          if-no-files-found: error
      - name: Unchanged authored controls, normal and optimized
        working-directory: frozen
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pr203-controls"
          python research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "${RUNNER_TEMP}/pr203-controls/normal.log"
          python -O research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "${RUNNER_TEMP}/pr203-controls/optimized.log"
          git diff --exit-code HEAD
      - name: Repeat the unchanged allocation and three-arm execution
        run: |
          python controller/research/programme-execution-20260909/execute_203.py \
            --repo frozen --out "${RUNNER_TEMP}/pr203-repeat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-pr203-repeat-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr203-controls/
            ${{ runner.temp }}/pr203-repeat/
          retention-days: 30
          if-no-files-found: error
