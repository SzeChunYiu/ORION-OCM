name: GMI 833 blind recovery v2

on:
  pull_request:
    paths:
      - 'research/gmi-833-blind-recovery-v2-v1/**'
      - 'research/gmi-833-aj9a-known-family-benchmark-v1/KNOWN_FAMILY_BENCHMARK_V1.json'
      - 'research/gmi-833-no-smuggling-audit-v1/audit_core_v1.py'
      - '.github/workflows/gmi-833-blind-recovery-v2-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-blind-recovery-v2-v1/**'
      - 'research/gmi-833-aj9a-known-family-benchmark-v1/KNOWN_FAMILY_BENCHMARK_V1.json'
      - 'research/gmi-833-no-smuggling-audit-v1/audit_core_v1.py'
      - '.github/workflows/gmi-833-blind-recovery-v2-v1.yml'

permissions:
  contents: read

jobs:
  custody-screen-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Freeze custody, screen, adjudication, recomputation bindings
        run: |
          set -euo pipefail
          cd research/gmi-833-blind-recovery-v2-v1
          python3 -B v1_counterfactual_or_task.py > /tmp/receipt.json
          python3 -B screen_v2.py
          python3 -B check_v2.py
          python3 -B posthoc_adjudicate_v2.py
          python3 - <<'EOF'
          import json
          from pathlib import Path
          here = Path(".")
          screen = json.loads((here/"SCREEN_RESULT_V1.json").read_text())
          check = json.loads((here/"RESULT_V2.json").read_text())
          post = json.loads((here/"POSTHOC_RESULT_V2.json").read_text())
          receipt = json.loads((here/"MOTIVATION_RECEIPT_V1.json").read_text())
          assert screen["screen_verdict"] == "CLEAN"
          assert check["battery_blob_ok"], "battery blob drift"
          assert check["battery_regeneration_deterministic"], "nondeterministic battery"
          fc = check["freeze_custody"]
          if fc.get("status") == "FREEZE_COMMIT_UNREACHABLE":
              # Commit-order custody cannot be re-derived once the freeze
              # commit is unreachable from any ref. Do not assert what was
              # not checked; require the freeze files to be present and say
              # plainly that the ordering rests on the audit done at merge.
              assert fc["freeze_files_present_at_head"] == fc["freeze_files_expected"], fc
              assert fc["ancestry_verified"] is False
              print("freeze custody: UNREACHABLE COMMIT, files present, ordering not re-derived")
          else:
              assert fc["implementation_absent_at_freeze"], fc
          assert check["search_side_no_benchmark_reference"]
          assert check["screen"]["clean"]
          assert all(check["recomputation_bindings"].values()), check["recomputation_bindings"]
          assert check["posthoc"]["selftest_pass"]
          assert check["motivation_receipt"]["or_counterfactual_terminal"] == "NOT_RECOVERED_AT_SCOPE"
          assert receipt["rows"]["OR_COUNTERFACTUAL"]["v1_terminal_would_be"] == "NOT_RECOVERED_AT_SCOPE"
          assert receipt["rows"]["XOR_V1_ACTUAL"]["v1_terminal_would_be"] == "RECOVERED"
          print("V2_ALL_GREEN", json.dumps({"terminals": check["posthoc"]["terminals"]}))
          EOF

      - name: aj9a benchmark checker runs and matches its committed receipt
        run: |
          set -eu
          P=research/gmi-833-aj9a-known-family-benchmark-v1
          # This checker asserts it rejects all 11 hostile configs, but nothing
          # executed it: the workflow watched its JSON but never ran it. Its
          # walk() surfaced only dict-held strings, so list-held operator names
          # -- exactly how generic_ops is supplied -- escaped the macro denylist
          # and four hostiles went undetected while the receipt still read GREEN.
          python3 -I -B "$P/check_aj9a.py" > /tmp/aj9a_now.json
          python3 - <<'PY'
          import json, pathlib
          new = json.loads(pathlib.Path("/tmp/aj9a_now.json").read_text().strip().splitlines()[-1])
          old = json.loads(pathlib.Path("research/gmi-833-aj9a-known-family-benchmark-v1/RESULT_V1.json").read_text())
          assert new["hostile_configs_checked"] == 11, new["hostile_configs_checked"]
          assert new["hostile_configs_rejected"] == 11, new["hostile_configs_rejected"]
          diff = {k for k in set(new) | set(old) if new.get(k) != old.get(k)}
          assert not diff, sorted(diff)
          print("aj9a: 11/11 hostiles rejected, receipt reproduces exactly")
          PY
