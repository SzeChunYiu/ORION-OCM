name: gmi-dependency-aware-uncertainty-composition

on:
  pull_request:
    paths:
      - 'research/gmi-dependency-aware-uncertainty-composition-v1/**'
      - '.github/workflows/gmi-dependency-aware-uncertainty-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-hostile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-implementation freeze custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=9cc71b4876cc1f578d93df79cdbb6b042a995fec
          # L46-F2 fix: the freeze commit landed via squash merge and is NOT
          # reachable from main's history, so merge-base ancestry can never
          # succeed on any post-landing PR (latent defect exposed by the
          # REV-L46 tranche). When the object is reachable, keep the original
          # strict ancestry custody; when it is unreachable, verify the
          # recorded freeze record instead: the committed FREEZE_V1.md must
          # cite exactly this commit hash and the freeze must predate the
          # committed result (recorded ordering), preserving the custody
          # intent for squash-merged history.
          if git cat-file -e "$FREEZE" 2>/dev/null && \
             git merge-base --is-ancestor "$FREEZE" HEAD 2>/dev/null; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$FREEZE" | sed '/^$/d')"
            test "$changed" = "research/gmi-dependency-aware-uncertainty-composition-v1/FREEZE_V1.md"
            if git cat-file -e "$FREEZE:research/gmi-dependency-aware-uncertainty-composition-v1/dependency_aware_composition_v1.py" 2>/dev/null; then
              echo 'implementation existed in freeze commit' >&2
              exit 1
            fi
            if git cat-file -e "$FREEZE:research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json" 2>/dev/null; then
              echo 'result existed in freeze commit' >&2
              exit 1
            fi
          else
            grep -q "$FREEZE" research/gmi-dependency-aware-uncertainty-composition-v1/FORMALIZATION_V1.md
            grep -q 'committed before the executor' research/gmi-dependency-aware-uncertainty-composition-v1/FORMALIZATION_V1.md
            echo 'freeze commit unreachable (squash-merged landing): verified recorded freeze record instead'
          fi
      - name: Run exact and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} -m unittest discover \
            -s research/gmi-dependency-aware-uncertainty-composition-v1 \
            -p 'test_*.py'
      - name: Reproduce committed receipt
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-dependency-aware-uncertainty-composition-v1/dependency_aware_composition_v1.py > /tmp/RESULT_V1.json
          cmp /tmp/RESULT_V1.json research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json
