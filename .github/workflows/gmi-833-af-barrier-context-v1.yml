name: gmi-833-af-barrier-context-v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-af-barrier-context-v1/**'
      - '.github/workflows/gmi-833-af-barrier-context-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-af-barrier-context-v1/**'
      - '.github/workflows/gmi-833-af-barrier-context-v1.yml'

concurrency:
  group: gmi-833-af-barrier-context-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=b5a96cfb07f99f7493e5946dff42929eee653503
          git cat-file -e "$FREEZE^{commit}"
          git merge-base --is-ancestor "$FREEZE" HEAD
          test "$(git show --pretty='' --name-only "$FREEZE" | sed '/^$/d')" = "research/gmi-833-af-barrier-context-v1/FREEZE_V1.md"
      - name: Parent Git-blob pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/heritable-search-transformation-v1/HST_THEOREM_REGISTRY_V1.json)" = "5b94d66a8d8d2196a518fd7ac8d1da83663e42a4"
          test "$(git rev-parse HEAD:research/heritable-search-transformation-v1/FREEZE_HST_V1.json)" = "8723baf57ac16878edb4dfff45bd7decfa15b6be"
          test "$(git rev-parse HEAD:research/heritable-search-geometry-v1/HSG_FREEZE_V1.json)" = "0116c6bc81f49db982abdc9446c0c6519133ced6"
          test "$(git rev-parse HEAD:research/heritable-search-geometry-v1/HSG_ATOM_TABLE_V1.json)" = "b102b6fa3dad12e8c5ea7205b76a8340a69e751f"
          test "$(git rev-parse HEAD:research/gmi-833-aj6-aj8-development-value-intelligence-v1/THEORY.md)" = "2396ddcd5eb8d1b47968c9c0a291fceacb45ba8b"
          test "$(git rev-parse HEAD:research/gmi-833-aj6-aj8-development-value-intelligence-v1/check_aj6_aj8.py)" = "3b550a8dd5c60013bc9603d93e2e4f764ac1e964"
      - name: HSG-T51 issue-comment authority pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: research/gmi-833-af-barrier-context-v1
        run: python3 -I -B verify_hsg_parent_authority_v1.py
      - name: Static reconciliation registry
        working-directory: research/gmi-833-af-barrier-context-v1
        run: python3 -I -B reconcile_issue_833_af_v1.py --mode static-check
      - name: Remote reconciliation authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: research/gmi-833-af-barrier-context-v1
        run: python3 -I -B reconcile_issue_833_af_v1.py --mode remote-check
      - name: Reproduce main receipt
        working-directory: research/gmi-833-af-barrier-context-v1
        run: |
          python3 -I -B af_barrier_context_v1.py --output /tmp/result.normal.json
          cmp RESULT_V1.json /tmp/result.normal.json
          python3 -I -O -B af_barrier_context_v1.py --output /tmp/result.opt.json
          cmp RESULT_V1.json /tmp/result.opt.json
          cmp /tmp/result.normal.json /tmp/result.opt.json
      - name: Reproduce independent oracle
        working-directory: research/gmi-833-af-barrier-context-v1
        run: |
          python3 -I -B independent_oracle_v1.py --output /tmp/oracle.normal.json
          cmp ORACLE_RESULT_V1.json /tmp/oracle.normal.json
          python3 -I -O -B independent_oracle_v1.py --output /tmp/oracle.opt.json
          cmp ORACLE_RESULT_V1.json /tmp/oracle.opt.json
          cmp /tmp/oracle.normal.json /tmp/oracle.opt.json
      - name: Hostile tests normal and optimized
        working-directory: research/gmi-833-af-barrier-context-v1
        run: |
          python3 -I -B test_af_barrier_context_v1.py
          python3 -I -O -B test_af_barrier_context_v1.py
      - name: No optimized-assert proof dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*assert[[:space:]]' research/gmi-833-af-barrier-context-v1/af_core_v1.py
          ! grep -nE '^[[:space:]]*assert[[:space:]]' research/gmi-833-af-barrier-context-v1/af_barrier_context_v1.py
          ! grep -nE '^[[:space:]]*assert[[:space:]]' research/gmi-833-af-barrier-context-v1/independent_oracle_v1.py

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile AF0-AF3 checkboxes only after GREEN main verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: research/gmi-833-af-barrier-context-v1
        run: python3 -I -B reconcile_issue_833_af_v1.py --mode apply
