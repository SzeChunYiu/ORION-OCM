name: G1 controller-growth and remaining subtraction

on:
  pull_request:
    paths:
      - 'research/g1-controller-growth-v1/**'
      - '.github/workflows/g1-controller-growth.yml'
      - 'research/g2-macro-operator-v1/experiment.py'
      - 'research/g5-physical-denominator-v1/SUMMARY.json'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/kso/**'
      - 'src/ocm/store/**'
      - 'src/ocm/work/**'
      - 'src/ocm/operators/**'
  push:
    branches: [main]
    paths:
      - 'research/g1-controller-growth-v1/**'
      - '.github/workflows/g1-controller-growth.yml'

permissions:
  contents: read

jobs:
  g1-controller-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g1-controller-growth-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Freeze controls
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-growth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/g1-controller-growth-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/g1-controller-growth-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Controller-growth and subtraction study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-growth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/g1-controller-growth-v1/study.py \
            2>&1 | tee "$out/console.txt"
          cp research/g1-controller-growth-v1/RESULT.json "$out/RESULT.json"
          cp research/g1-controller-growth-v1/COUNTS.json "$out/COUNTS.json"
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-controller-growth
          path: '${{ runner.temp }}/g1-growth-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
