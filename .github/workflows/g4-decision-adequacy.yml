name: G4 decision adequacy (non-ML)

on:
  pull_request:
    paths:
      - 'research/g4-decision-adequacy-v1/**'
      - 'research/g4-horizon-exact-v1/**'
      - '.github/workflows/g4-decision-adequacy.yml'
  push:
    branches: [main]
    paths:
      - 'research/g4-decision-adequacy-v1/**'
      - '.github/workflows/g4-decision-adequacy.yml'

permissions:
  contents: read

jobs:
  g4-decision-adequacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/research/g4-decision-adequacy-v1:${{ github.workspace }}/research/g4-horizon-exact-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Snapshot frozen RESULT hashes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g4-adequacy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g4-adequacy-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          required = ["research/g4-decision-adequacy-v1/RESULT.json"]
          donor = [
              "research/g4-horizon-exact-v1/RESULT.md",
              "research/g4-horizon-exact-v1/SUMMARY.json",
              "research/g4-horizon-exact-v1/horizon_exact.py",
          ]
          frozen = {}
          for rel in required + donor:
              p = root / rel
              if not p.is_file():
                  raise SystemExit("frozen snapshot missing %s" % rel)
              frozen[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          (out / "frozen-sha256.json").write_text(json.dumps(frozen, indent=2) + "\n")
          PY
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g4-adequacy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -m unittest discover -s research/g4-decision-adequacy-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/g4-decision-adequacy-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Decision-adequacy study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g4-adequacy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/g4-decision-adequacy-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g4-adequacy-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          frozen = json.loads((root / "research/g4-decision-adequacy-v1/RESULT.json").read_text())
          allowed = {
              "G4_NON_ML_ADEQUACY_SUPPORTED_AT_TOY_SCOPE",
              "G4_NON_ML_ADEQUACY_INCOMPLETE",
          }
          if result["terminal"] not in allowed:
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result.get("g4_4_unlocked"):
              sys.exit("G4.4 must stay locked")
          if result.get("g4_4_unlock_score") != "0/9":
              sys.exit("G4.4 unlock score must be 0/9")
          if result.get("g4_4_4th") != "REFUTED":
              sys.exit("G4.4.4 must remain REFUTED")
          if result.get("ml_trained") or result.get("neural_router"):
              sys.exit("ML/neural router is not licensed")
          if result["terminal"] == "SMALL_LEARNED_ROUTER_VALUE_SUPPORTED":
              sys.exit("learned-router terminal is not licensed")
          if "G4.4" not in result.get("not_issued", []):
              sys.exit("capsule must list G4.4 as not issued")
          if result["terminal"] != frozen["terminal"]:
              sys.exit("live terminal %s != frozen %s" % (result["terminal"], frozen["terminal"]))
          PY
          cp research/g4-decision-adequacy-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Restore frozen RESULT after runs
        if: always()
        run: |
          set -euo pipefail
          git checkout -- research/g4-decision-adequacy-v1/RESULT.json
          git diff --exit-code -- research/g4-decision-adequacy-v1/RESULT.json
          git diff --exit-code -- research/g4-horizon-exact-v1
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g4-adequacy-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          frozen = json.loads((out / "frozen-sha256.json").read_text())
          for rel, digest in frozen.items():
              got = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              if got != digest:
                  sys.exit("frozen RESULT drifted: %s" % rel)
          PY
      - name: Horizon donor not overwritten
        run: git diff --exit-code -- research/g4-horizon-exact-v1
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-decision-adequacy
          path: '${{ runner.temp }}/g4-adequacy-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
