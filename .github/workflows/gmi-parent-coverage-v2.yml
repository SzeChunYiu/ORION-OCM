name: GMI parent coverage V2

on:
  pull_request:
    paths:
      - 'research/parent-absorption-v1/GMI_602_PARENT_EXTENSION_V1.json'
      - 'research/machine-intelligence-morphogenesis-v1/GMI_PARENT_COVERAGE_V2.md'
      - 'research/machine-intelligence-morphogenesis-v1/gmi_microscope/parent_coverage_audit_v2.py'
      - 'research/machine-intelligence-morphogenesis-v1/microscopes/results/STAGE_PARENT_COVERAGE_V1.json'
      - 'research/machine-intelligence-morphogenesis-v1/microscopes/results/STAGE_PARENT_COVERAGE_V2.json'
      - 'research/machine-intelligence-morphogenesis-v1/test_gmi_parent_coverage_v2.py'
      - '.github/workflows/gmi-parent-coverage-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-coverage-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reproduce parent coverage V2
        run: python research/machine-intelligence-morphogenesis-v1/gmi_microscope/parent_coverage_audit_v2.py
      - name: Run V2 regression tests
        run: python -m pytest -q research/machine-intelligence-morphogenesis-v1/test_gmi_parent_coverage_v2.py
      - name: Reproduce under optimized Python
        run: python -O research/machine-intelligence-morphogenesis-v1/gmi_microscope/parent_coverage_audit_v2.py
      - name: Verify committed receipt and source custody
        run: |
          git diff --exit-code -- \
            research/parent-absorption-v1/GMI_602_PARENT_EXTENSION_V1.json \
            research/machine-intelligence-morphogenesis-v1/GMI_PARENT_COVERAGE_V2.md \
            research/machine-intelligence-morphogenesis-v1/gmi_microscope/parent_coverage_audit_v2.py \
            research/machine-intelligence-morphogenesis-v1/microscopes/results/STAGE_PARENT_COVERAGE_V1.json \
            research/machine-intelligence-morphogenesis-v1/microscopes/results/STAGE_PARENT_COVERAGE_V2.json \
            research/machine-intelligence-morphogenesis-v1/test_gmi_parent_coverage_v2.py
