name: GMI completeness attack v1

on:
  pull_request:
    paths:
      - 'research/gmi-completeness-attack-v1/**'
      - '.github/workflows/gmi-completeness-attack.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-completeness-attack-v1/**'
      - '.github/workflows/gmi-completeness-attack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completeness-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Run completeness attack report
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          args=(-I -B)
          if [ "$MODE" = optimized ]; then args+=(-O); fi
          python "${args[@]}" research/gmi-completeness-attack-v1/completeness_attack_v1.py
      - name: Run completeness attack tests
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          args=(-I -B)
          if [ "$MODE" = optimized ]; then args+=(-O); fi
          python "${args[@]}" research/gmi-completeness-attack-v1/test_completeness_attack_v1.py -v
