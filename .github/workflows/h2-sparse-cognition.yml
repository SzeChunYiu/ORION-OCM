name: H2 sparse relevant cognition

on:
  pull_request:
    paths:
      - 'research/h2-sparse-cognition-v1/**'
      - 'research/g5-packed-field-v1/**'
      - '.github/workflows/h2-sparse-cognition.yml'
      - 'src/ocm/kso/space.py'
      - 'src/ocm/kso/warrant.py'
      - 'src/ocm/kso/types.py'
  push:
    branches: [main]
    paths:
      - 'research/h2-sparse-cognition-v1/**'
      - '.github/workflows/h2-sparse-cognition.yml'

permissions:
  contents: read

jobs:
  h2-sparse-cognition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/h2-sparse-cognition-v1:${{ github.workspace }}/research/g5-packed-field-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/h2-sparse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/h2-sparse-cognition-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/h2-sparse-cognition-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Planted H2 sparse-cognition study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/h2-sparse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/h2-sparse-cognition-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          cp research/h2-sparse-cognition-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Production src unchanged
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-sparse-cognition
          path: '${{ runner.temp }}/h2-sparse-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
