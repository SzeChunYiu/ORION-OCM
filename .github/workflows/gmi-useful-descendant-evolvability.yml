name: gmi-useful-descendant-evolvability

on:
  pull_request:
    paths:
      - 'research/gmi-useful-descendant-evolvability-v1/**'
      - '.github/workflows/gmi-useful-descendant-evolvability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-hostile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-implementation freeze custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=a050f592b3a2b9eb20b12bdfc7670d42bb22ae39
          ROOT=research/gmi-useful-descendant-evolvability-v1
          git merge-base --is-ancestor "$FREEZE" HEAD
          changed="$(git diff-tree --no-commit-id --name-only -r "$FREEZE" | sed '/^$/d')"
          test "$changed" = "$ROOT/FREEZE_V1.md"
          for path in \
            "$ROOT/useful_descendant_v1.py" \
            "$ROOT/FORMALIZATION_V1.md" \
            "$ROOT/test_useful_descendant_v1.py" \
            "$ROOT/RESULT_V1.json" \
            ".github/workflows/gmi-useful-descendant-evolvability.yml"; do
            if git cat-file -e "$FREEZE:$path" 2>/dev/null; then
              echo "implementation/proof/result existed at freeze: $path" >&2
              exit 1
            fi
          done
      - name: Run exact and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} -m unittest discover \
            -s research/gmi-useful-descendant-evolvability-v1 \
            -p 'test_*.py'
      - name: Reproduce committed receipt
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-useful-descendant-evolvability-v1/useful_descendant_v1.py > /tmp/RESULT_V1.json
          cmp /tmp/RESULT_V1.json research/gmi-useful-descendant-evolvability-v1/RESULT_V1.json
