name: Grand GMI finite theorem capsule replay

on:
  pull_request:
    paths:
      - 'research/gmi-grand-unification-v1/**'
      - 'research/gmi-structural-threshold-repair-v1/**'
      - 'research/gmi-finite-quantum-cover-v1/**'
      - 'research/gmi-joint-relational-composition-v1/**'
      - 'research/gmi-terminal-cost-reconstruction-v1/**'
      - 'research/gmi-b6-consumer-census-v1/**'
      - 'research/gmi-adaptive-row-confidence-v1/**'
      - 'research/machine-intelligence-morphogenesis-v1/GMI_OPERATIONAL_COMPLETENESS_THEOREM_V1.md'
      - '.github/workflows/grand-gmi-theorem-capsule.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v2.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v3.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v4.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-grand-unification-v1/**'
      - 'research/gmi-structural-threshold-repair-v1/**'
      - 'research/gmi-finite-quantum-cover-v1/**'
      - 'research/gmi-joint-relational-composition-v1/**'
      - 'research/gmi-terminal-cost-reconstruction-v1/**'
      - 'research/gmi-b6-consumer-census-v1/**'
      - 'research/gmi-adaptive-row-confidence-v1/**'
      - 'research/machine-intelligence-morphogenesis-v1/GMI_OPERATIONAL_COMPLETENESS_THEOREM_V1.md'
      - '.github/workflows/grand-gmi-theorem-capsule.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v2.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v3.yml'
      - '.github/workflows/grand-gmi-nn-nonnn-point-parity3-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Research regressions including hostile receipt checks
        run: |
          python -B -m unittest discover -s research/gmi-grand-unification-v1 -p 'test_*.py' -v
          python -B -O -m unittest discover -s research/gmi-grand-unification-v1 -p 'test_*.py' -v
      - name: Structural threshold repair scientific and custody controls
        run: |
          python -I -B -m unittest discover -s research/gmi-structural-threshold-repair-v1 -p 'test_structural_threshold*_v1.py' -v
          python -I -O -B -m unittest discover -s research/gmi-structural-threshold-repair-v1 -p 'test_structural_threshold*_v1.py' -v
      - name: Frozen finite quantum unit regressions
        run: |
          python -I -B research/gmi-finite-quantum-cover-v1/test_finite_quantum_v1.py
          python -I -O -B research/gmi-finite-quantum-cover-v1/test_finite_quantum_v1.py
      - name: Frozen joint relational unit regressions
        run: |
          python -I -B -c 'import runpy, sys; from pathlib import Path; p=Path("research/gmi-joint-relational-composition-v1/test_joint_relation_v1.py").resolve(); sys.path.insert(0,str(p.parent)); sys.argv=[str(p)]; runpy.run_path(str(p),run_name="__main__")'
          python -I -O -B -c 'import runpy, sys; from pathlib import Path; p=Path("research/gmi-joint-relational-composition-v1/test_joint_relation_v1.py").resolve(); sys.path.insert(0,str(p.parent)); sys.argv=[str(p)]; runpy.run_path(str(p),run_name="__main__")'
      - name: Frozen terminal-cost unit regressions
        run: |
          python -I -B research/gmi-terminal-cost-reconstruction-v1/test_terminal_cost_v1.py
          python -I -O -B research/gmi-terminal-cost-reconstruction-v1/test_terminal_cost_v1.py
      - name: Frozen B6 consumer census scientific and custody controls
        run: |
          python -I -B -m unittest discover -s research/gmi-b6-consumer-census-v1 -p 'test_*_v1.py' -v
          python -I -O -B -m unittest discover -s research/gmi-b6-consumer-census-v1 -p 'test_*_v1.py' -v
      - name: Frozen adaptive-row confidence unit regressions
        run: |
          python -I -B research/gmi-adaptive-row-confidence-v1/test_adaptive_rows_v1.py -v
          python -I -O -B research/gmi-adaptive-row-confidence-v1/test_adaptive_rows_v1.py -v
      - name: Replay every registered finite checker against complete frozen output
        run: >-
          python -I -B research/gmi-grand-unification-v1/replay_theorem_capsule_v1.py
          > "$RUNNER_TEMP/grand-gmi-finite-capsule-replay.json"
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-gmi-finite-capsule-replay
          path: ${{ runner.temp }}/grand-gmi-finite-capsule-replay.json
          if-no-files-found: error
      - name: Verify replay did not mutate tracked evidence
        run: git diff --exit-code
