name: GMI Section E searcher comparison v2

on:
  pull_request:
    paths:
      - 'research/gmi-section-e-searcher-comparison-v2/**'
      - '.github/workflows/gmi-section-e-searcher-comparison-v2.yml'
  workflow_dispatch:

jobs:
  exact-parent-searcher-comparison:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact receipt
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-e-searcher-comparison-v2
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O section_e_searcher_comparison_witness.py --output /tmp/RESULT_E2.json
          else
            python section_e_searcher_comparison_witness.py --output /tmp/RESULT_E2.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('RESULT_E2.json').read_text()) != json.loads(Path('/tmp/RESULT_E2.json').read_text()):
              raise SystemExit('semantic receipt mismatch')
          PY
      - name: Run hostile and accounting checks
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-e-searcher-comparison-v2
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O -m unittest -v test_section_e_searcher_comparison.py
          else
            python -m unittest -v test_section_e_searcher_comparison.py
          fi
      - name: Source custody
        run: git diff --exit-code
