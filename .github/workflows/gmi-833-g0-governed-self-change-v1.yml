name: GMI 833 G0 governed self change v1
on:
  pull_request:
    paths:
      - 'research/gmi-833-g0-governed-self-change-v1/**'
      - '.github/workflows/gmi-833-g0-governed-self-change-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-g0-governed-self-change-v1/**'
      - '.github/workflows/gmi-833-g0-governed-self-change-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=b3afee5e0c8e70812653cf92ef9fd703d77b9d18
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-g0-governed-self-change-v1/FREEZE_V1.md"
          for p in research/gmi-833-g0-governed-self-change-v1/governed_self_change_v1.py research/gmi-833-g0-governed-self-change-v1/independent_oracle_v1.py research/gmi-833-g0-governed-self-change-v1/test_governed_self_change_v1.py research/gmi-833-g0-governed-self-change-v1/RESULT_V1.json research/gmi-833-g0-governed-self-change-v1/ORACLE_RESULT_V1.json research/gmi-833-g0-governed-self-change-v1/CORE.md research/gmi-833-g0-governed-self-change-v1/GOVERNED_SELF_CHANGE_THEOREMS_V1.md research/gmi-833-g0-governed-self-change-v1/PARENT_LITERATURE_V1.md research/gmi-833-g0-governed-self-change-v1/MANIFEST_V1.json research/gmi-833-g0-governed-self-change-v1/ISSUE_833_RECONCILIATION_GOVERNED_SELF_CHANGE_V1.json .github/workflows/gmi-833-g0-governed-self-change-v1.yml; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then echo "post-freeze artifact existed: $p" >&2; exit 1; fi
          done
      - name: Exact and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then O=-O; else O=; fi
          python -I $O -B research/gmi-833-g0-governed-self-change-v1/test_governed_self_change_v1.py -v
          python -I $O -B research/gmi-833-g0-governed-self-change-v1/governed_self_change_v1.py > /tmp/result.json
          python -I $O -B research/gmi-833-g0-governed-self-change-v1/independent_oracle_v1.py > /tmp/oracle.json
          cmp /tmp/result.json research/gmi-833-g0-governed-self-change-v1/RESULT_V1.json
          cmp /tmp/oracle.json research/gmi-833-g0-governed-self-change-v1/ORACLE_RESULT_V1.json
          echo 'ba6e14c7ace995cd90f5b8d39879a5d5164102f2b6c543ef577ec757fd340b18  research/gmi-833-g0-governed-self-change-v1/RESULT_V1.json' | sha256sum -c -
          echo '29dd7d98afafe9190eeae305199671e1053865470172ced59f14e37937d8ddca  research/gmi-833-g0-governed-self-change-v1/ORACLE_RESULT_V1.json' | sha256sum -c -
      - name: Validate exact governance census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('research/gmi-833-g0-governed-self-change-v1')
          m=json.loads((r/'MANIFEST_V1.json').read_text()); x=json.loads((r/'RESULT_V1.json').read_text()); o=json.loads((r/'ORACLE_RESULT_V1.json').read_text())
          if x['terminal']!='GMI_833_GOVERNED_SELF_CHANGE_V1_ALL_GREEN' or o['terminal']!='GREEN': raise SystemExit('RED')
          c=x['census']; expected={'candidate_count':27,'accepted':9,'rejected':18,'proposal_inert_failures':0,'accepted_adoption_failures':0,'rejected_mutation_failures':0,'replay_failures':0,'stale_receipt_control':True,'two_generation_control':True}
          if c!=expected: raise SystemExit('census mismatch')
          for k,v in expected.items():
              if o[k]!=v: raise SystemExit(f'oracle mismatch {k}')
          h=x['hostiles']
          if h['authority']!='AUTHORITY_MISMATCH' or h['signature']!='SIGNATURE_INVALID' or h['decision']!='RECEIPT_DECISION_INVALID' or h['candidate_swap']!='PROPOSAL_STATE_MISMATCH' or h['forged_accept']!='RECEIPT_DECISION_INVALID': raise SystemExit('hostile mismatch')
          if h['proposal_has_signature_field']!='False' or h['verifier_secret_on_proposal']!='False': raise SystemExit('authority leaked')
          if m['claim_ceiling']!=x['claim_ceiling'] or set(m['forbidden_promotions'])!=set(x['forbidden_promotions']): raise SystemExit('authority mismatch')
          PY
      - name: Check exact #833 reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py --mode check --repository "$GITHUB_REPOSITORY" --spec research/gmi-833-g0-governed-self-change-v1/ISSUE_833_RECONCILIATION_GOVERNED_SELF_CHANGE_V1.json
  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply only earned E6 rows
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py --mode apply --repository "$GITHUB_REPOSITORY" --spec research/gmi-833-g0-governed-self-change-v1/ISSUE_833_RECONCILIATION_GOVERNED_SELF_CHANGE_V1.json
