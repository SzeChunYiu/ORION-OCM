name: GMI 833 AE2 predictive boundary v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-ae2-predictive-boundary-v1/**'
      - '.github/workflows/gmi-833-ae-ae2-predictive-boundary-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-ae2-predictive-boundary-v1/**'
      - '.github/workflows/gmi-833-ae-ae2-predictive-boundary-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=3901753eaa746cbe6ac3e18cd80034e728c1aead
          pkg=research/gmi-833-ae-ae2-predictive-boundary-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/ae2_predictive_boundary_v1.py" \
            "$pkg/independent_boundary_oracle_v1.py" \
            "$pkg/test_ae2_predictive_boundary_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/AE2_THEOREMS_V1.md" \
            "$pkg/ISSUE_833_RECONCILIATION_AE2_PREDICTIVE_BOUNDARY_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            actual="$(git rev-parse "HEAD:$1")"
            test "$actual" = "$2"
          }
          verify_parent research/gmi-833-theory-baseline-v1/BASELINE_V1.md 201ee8e8b290f5bfa3e283e6f8be2429ce8eeb78
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
          verify_parent research/gmi-833-ae-ae1-structure-separation-v1/RESULT_V1.json ceb77f5beac99b5427d1350915b19df546495fb8
      - name: Exact boundary tests and hostiles
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-ae2-predictive-boundary-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_ae2_predictive_boundary_v1.py" -v
            python -I -O -B "$pkg/ae2_predictive_boundary_v1.py" > /tmp/ae2.json
          else
            python -I -B "$pkg/test_ae2_predictive_boundary_v1.py" -v
            python -I -B "$pkg/ae2_predictive_boundary_v1.py" > /tmp/ae2.json
          fi
          cmp /tmp/ae2.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae2-predictive-boundary-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE2_PREDICTIVE_INFORMATION_LEARNABILITY_BOUNDARY_'
                      'PROVED_AND_EXACTLY_WITNESSED_AT_REGISTERED_FINITE_SCOPE')
          assert m['claim_ceiling'] == r['claim_ceiling'] == expected
          assert m['source_main'] == r['source_main'] == (
              '91c6d2876ba80c517a186e28fce3bdbe4e3fc218')
          assert m['freeze_commit'] == r['freeze_commit'] == (
              '3901753eaa746cbe6ac3e18cd80034e728c1aead')
          assert r['verdict'] == 'GREEN' and all(r['checks'].values())
          res = r['results']
          p2 = res['PIB_2_bounded_predictive_information']
          assert p2['exhaustive_grid_cases'] == 670396
          assert p2['violations'] == 0
          assert p2['cases_attaining_equality_with_positive_gain'] == 15328
          assert p2['roster']['W_TIGHT']['gain'] == '1/2'
          assert p2['roster']['W_TIGHT']['l1_dependence'] == '1'
          for w in p2['roster'].values():
              assert w['two_gain_le_D']
              assert w['pinsker_D_sq_over_two_le_MI_lower']
              assert w['MI_upper_le_chi_squared']
              assert w['two_gain_sq_le_MI_lower']
          p1 = res['PIB_1_no_predictive_information']
          for k in ('hist1', 'hist2'):
              assert p1[k]['exactly_independent']
              for lo in p1[k]['losses'].values():
                  assert lo['improvement'] == '0'
          p4 = res['PIB_4_decoder_complexity']
          assert p4['mutual_information_bits_exact'] == '1'
          assert p4['best_accuracy_by_depth']['depth2']['parity'] == '1/2'
          assert p4['best_accuracy_by_depth']['depth3']['parity'] == '1'
          assert p4['best_accuracy_by_depth']['depth1']['dictator'] == '1'
          assert p4['proper_subsets_checked'] == 7
          assert p4['proper_subset_uniformity_violations'] == 0
          assert p4['cryptographic_assumption_used'] is False
          f = res['PIB_5_fixtures']
          assert f['LOWENT_IID']['predictive_gain'] == '0'
          assert f['LOWENT_IID']['l1_dependence'] == '0'
          assert f['HIGHENT_CYCLIC']['predictive_gain'] == '3/4'
          assert f['DRIFT_INVERT']['pooled_exactly_independent'] is True
          assert f['DRIFT_INVERT'][
              'phase1_fitted_rule_accuracy_in_phase2'] == '0'
          assert f['CHAOS_DOUBLING']['certainty_horizon'] == 4
          assert f['CHAOS_DOUBLING']['states_enumerated'] == 256
          assert res['null']['random_worlds_flagged'] == 0
          assert res['null']['known_clean_flagged'] == []
          print('AE2 manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae2-predictive-boundary-v1')
          spec = json.loads((
              root /
              'ISSUE_833_RECONCILIATION_AE2_PREDICTIVE_BOUNDARY_V1.json'
          ).read_text())
          assert spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2'
          assert spec['issue'] == 833
          assert spec['issue_comment_id'] == 5692689542
          assert len(spec['replacements']) == 8
          seen = set()
          for rep in spec['replacements']:
              assert rep['old'].startswith('- [ ] ')
              assert rep['new'].startswith('- [x] ')
              assert rep['new'][6:].startswith(rep['old'][6:])
              assert rep['old'] not in seen
              seen.add(rep['old'])
              assert rep['anchor'].startswith('### AE2 ')
          print('AE2 reconciliation spec OK')
          PY
