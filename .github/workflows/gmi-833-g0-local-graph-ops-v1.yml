name: GMI 833 G0 local graph ops v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-g0-local-graph-ops-v1/**'
      - '.github/workflows/gmi-833-g0-local-graph-ops-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-g0-local-graph-ops-v1/**'
      - '.github/workflows/gmi-833-g0-local-graph-ops-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=7e81a8fedb8f367238f8339200ab15c79e9429bc
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-g0-local-graph-ops-v1/FREEZE_V1.md"
          for p in \
            research/gmi-833-g0-local-graph-ops-v1/local_graph_ops_v1.py \
            research/gmi-833-g0-local-graph-ops-v1/independent_oracle_v1.py \
            research/gmi-833-g0-local-graph-ops-v1/test_local_graph_ops_v1.py \
            research/gmi-833-g0-local-graph-ops-v1/RESULT_V1.json \
            research/gmi-833-g0-local-graph-ops-v1/ORACLE_RESULT_V1.json \
            research/gmi-833-g0-local-graph-ops-v1/CORE.md \
            research/gmi-833-g0-local-graph-ops-v1/LOCAL_GRAPH_OPERATOR_THEOREMS_V1.md \
            research/gmi-833-g0-local-graph-ops-v1/PARENT_LITERATURE_V1.md \
            research/gmi-833-g0-local-graph-ops-v1/MANIFEST_V1.json \
            research/gmi-833-g0-local-graph-ops-v1/ISSUE_833_RECONCILIATION_LOCAL_GRAPH_OPS_V1.json \
            .github/workflows/gmi-833-g0-local-graph-ops-v1.yml; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact existed at freeze: $p" >&2
              exit 1
            fi
          done
      - name: Exact and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-g0-local-graph-ops-v1/test_local_graph_ops_v1.py -v
            python -I -O -B research/gmi-833-g0-local-graph-ops-v1/local_graph_ops_v1.py > /tmp/result.json
            python -I -O -B research/gmi-833-g0-local-graph-ops-v1/independent_oracle_v1.py > /tmp/oracle.json
          else
            python -I -B research/gmi-833-g0-local-graph-ops-v1/test_local_graph_ops_v1.py -v
            python -I -B research/gmi-833-g0-local-graph-ops-v1/local_graph_ops_v1.py > /tmp/result.json
            python -I -B research/gmi-833-g0-local-graph-ops-v1/independent_oracle_v1.py > /tmp/oracle.json
          fi
          cmp /tmp/result.json research/gmi-833-g0-local-graph-ops-v1/RESULT_V1.json
          cmp /tmp/oracle.json research/gmi-833-g0-local-graph-ops-v1/ORACLE_RESULT_V1.json
          echo '0a863546c5ef4c57b73aa150745390c3a7e0f07c860b4d62a08925c9f7cfcca9  research/gmi-833-g0-local-graph-ops-v1/RESULT_V1.json' | sha256sum -c -
          echo '2559054928e5298e95ae060d6be8b7806162da9f1f0fbf6a5c1838bd4dad880d  research/gmi-833-g0-local-graph-ops-v1/ORACLE_RESULT_V1.json' | sha256sum -c -
      - name: Validate exact theorem census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/gmi-833-g0-local-graph-ops-v1')
          m=json.loads((root/'MANIFEST_V1.json').read_text())
          r=json.loads((root/'RESULT_V1.json').read_text())
          o=json.loads((root/'ORACLE_RESULT_V1.json').read_text())
          if m['freeze_commit'] != '7e81a8fedb8f367238f8339200ab15c79e9429bc': raise SystemExit('freeze mismatch')
          if r['freeze_commit'] != m['freeze_commit']: raise SystemExit('receipt freeze mismatch')
          if r['claim_ceiling'] != m['claim_ceiling']: raise SystemExit('claim ceiling mismatch')
          if r['terminal'] != 'GMI_833_LOCAL_GLOBAL_GRAPH_OPS_V1_ALL_GREEN': raise SystemExit('receipt RED')
          c=r['equivariance_census']
          for name in ('POINTWISE','GLOBAL_BROADCAST','NEIGHBOR_UPDATE'):
              if c['comparisons'][name] != 1296: raise SystemExit(f'comparison count {name}')
              if c['equivariance_mismatches'][name] != 0: raise SystemExit(f'equivariance mismatch {name}')
              if c['resource_mismatches'][name] != 0: raise SystemExit(f'resource mismatch {name}')
          expected={'0':[[3,3,0,0]],'1':[[5,3,2,0]],'2':[[7,3,4,1]],'3':[[9,3,6,3]]}
          if r['neighbor_resource_histogram'] != expected: raise SystemExit('resource histogram mismatch')
          if any(not all(block.values()) for block in r['separation_hostiles'].values()): raise SystemExit('separation hostile failed')
          if 'ACCEPTED' in r['malformed_hostiles'].values(): raise SystemExit('malformed hostile accepted')
          if o['terminal'] != 'GREEN': raise SystemExit('oracle RED')
          if o['comparisons'] != c['comparisons'] or o['equivariance_mismatches'] != c['equivariance_mismatches'] or o['resource_mismatches'] != c['resource_mismatches']: raise SystemExit('oracle mismatch')
          if o['neighbor_resource_histogram'] != r['neighbor_resource_histogram']: raise SystemExit('oracle resource mismatch')
          if set(m['forbidden_promotions']) != set(r['forbidden_promotions']): raise SystemExit('forbidden promotions mismatch')
          PY
      - name: Check exact #833 reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode check \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-g0-local-graph-ops-v1/ISSUE_833_RECONCILIATION_LOCAL_GRAPH_OPS_V1.json

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only earned Section E3 rows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode apply \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-g0-local-graph-ops-v1/ISSUE_833_RECONCILIATION_LOCAL_GRAPH_OPS_V1.json
