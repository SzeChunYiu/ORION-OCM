name: gmi-833-maturity-rescore-v3-w4-v1

on:
  push:
    paths:
      - 'research/gmi-833-maturity-rescore-v3-w4-v1/**'
      - '.github/workflows/gmi-833-maturity-rescore-v3-w4-v1.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  pull_request:
    paths:
      - 'research/gmi-833-maturity-rescore-v3-w4-v1/**'
      - '.github/workflows/gmi-833-maturity-rescore-v3-w4-v1.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  workflow_dispatch:

jobs:
  rescore-v3-w4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the custody refs this package's checks depend on
        run: |
          set -u
          git fetch --tags origin || true
          git fetch origin \
            'research/833-g0-grammar-expansion-v1:refs/remotes/origin/research/833-g0-grammar-expansion-v1' || true
          echo "--- custody refs present? (NOT-CHECKED is reported, never silently passed) ---"
          git rev-parse --verify --quiet 'rev-l47-w4-freeze-custody^{commit}' || echo "MISSING tag rev-l47-w4-freeze-custody"
          git rev-parse --verify --quiet 'rev-l47-w4-results^{commit}'        || echo "MISSING tag rev-l47-w4-results"
          git rev-parse --verify --quiet '65073060b1af5b7c863c883307ff5279c783892c^{commit}' || echo "MISSING g0 branch commit"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Freeze must strictly precede every other file of this package (squash-safe)
        run: |
          set -eu
          # Squash-safe custody (parent: PR #1053 freeze; doctrine of #1042). Once the
          # package's PR is squash-merged, freeze and implementation first appear in ONE
          # commit and the ordering can no longer be re-derived from history. The shared
          # checker keeps the strict ordering proof on a linear history; on a squash-
          # published one it withholds ONLY that assertion, still checks everything
          # derivable from HEAD and from the source freeze commit, and prints
          # FREEZE_ORDER_NOT_REDERIVABLE:<commit> checked:<list>. Violations exit 1,
          # could-not-check exits 2; nothing is reported as passed unchecked.
          python3 -I -B research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py \
            --repo . --pkg research/gmi-833-maturity-rescore-v3-w4-v1 --freeze FREEZE_V3_W4.md --impl '*'

      - name: This branch must not touch any frozen artifact
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            git fetch origin main || true
            BASE=$(git rev-parse origin/main 2>/dev/null || echo "")
          fi
          if [ -z "$BASE" ]; then echo "SKIP: no base ref available"; exit 0; fi
          # Enforced per file and scoped to this branch's diff: the frozen artifacts of
          # THIS package must not change. Files outside the package are reported, never
          # gated -- a repo-wide "nothing else touched" assertion here fails every
          # cross-cutting CI branch for changes this package did not make.
          git diff --name-only "$BASE...HEAD" > /tmp/touched.txt || true
          rc=0
          for frozen in research/gmi-833-maturity-rescore-v3-w4-v1/FREEZE_V3_W4.md; do
            if grep -qx "$frozen" /tmp/touched.txt; then echo "FAIL: frozen artifact touched: $frozen"; rc=1; fi
          done
          other=$(grep -v -c -E '^(research/gmi-833-maturity-rescore-v3-w4-v1/|\.github/workflows/gmi-833-maturity-rescore-v3-w4-v1\.yml$)' /tmp/touched.txt || true)
          echo "files touched outside this package (recorded, not gated): ${other:-0}"
          [ "$rc" -eq 0 ] && echo "OK: no frozen artifact of this package is touched by this branch"
          exit "$rc"

      - name: Route A — executor
        working-directory: research/gmi-833-maturity-rescore-v3-w4-v1
        run: python3 -I -B rescore_v3_w4.py

      - name: Route B — independent oracle
        working-directory: research/gmi-833-maturity-rescore-v3-w4-v1
        run: python3 -I -B oracle_v3_w4.py

      - name: Tests (hostiles H1-H5, null, two-route agreement)
        working-directory: research/gmi-833-maturity-rescore-v3-w4-v1
        run: python3 -I -O -B test_rescore_v3_w4.py

      - name: Receipts must match what is committed
        working-directory: research/gmi-833-maturity-rescore-v3-w4-v1
        run: |
          set -eu
          if ! git diff --quiet -- RESULT_V1.json ORACLE_RESULT_V1.json SCORES_V3_DELTA.json; then
            echo "FAIL: regenerated receipts differ from the committed ones"
            git --no-pager diff --stat -- RESULT_V1.json ORACLE_RESULT_V1.json SCORES_V3_DELTA.json
            exit 1
          fi
          echo "OK: receipts reproduce byte-identically"

      - name: No row is claimed by this tranche
        working-directory: research/gmi-833-maturity-rescore-v3-w4-v1
        run: |
          set -eu
          if ls ISSUE_833_RECONCILIATION_*.json >/dev/null 2>&1; then
            echo "FAIL: this correction package must not ship a reconciliation JSON"; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          n = json.load(open("CORRECTION_NOTICE_V1.json"))
          r = json.load(open("RESULT_V1.json"))
          assert n["schema"] == "GMI_CORRECTION_NOTICE_V1", n["schema"]
          assert n["closes_issue_rows"] == [], n["closes_issue_rows"]
          assert n["issue_rows_claimed"] == [], n["issue_rows_claimed"]
          assert n["no_row_earned"] is True
          assert n["produces_reconciliation_json"] is False
          assert r["closes_issue_rows"] == []
          assert r["all_green"] is True, r["self_checks"]
          # the notice's headline numbers must match the receipt exactly
          d = r["W4R3_distribution"]
          assert n["census"]["published"]["M4"] == d["M4_total_published"]
          assert n["census"]["corrected"]["M4"] == d["M4_total_corrected"]
          assert n["census"]["corrected"]["M2"] == d["corrected_M"]["M2"]
          assert n["census"]["corrected"]["total"] == d["corrected_rows"]
          assert n["census"]["M4_membership_left"] == d["M4_membership_left"]
          assert n["census"]["M4_membership_entered"] == d["M4_membership_entered"]
          assert n["propagation_check"]["entries_checked"] == r["W4R4_propagation"]["checked"]
          assert n["propagation_check"]["outcomes"] == r["W4R4_propagation"]["counts"]
          assert n["propagation_check"]["second_flag_adjudicated"]["adjudication"] == r["W4R4_adjudication"][0]["adjudication"]
          # both nulls, including the honest negative
          pn = r["null_permutation"]; nn = n["null"]["permutation_null"]
          for k in ("true_flag_count", "permuted_flag_min", "permuted_flag_max",
                    "permuted_flag_sum", "permuted_draws_at_or_above_true"):
              assert nn[k] == pn[k], (k, nn[k], pn[k])
          assert "honest_negative" in pn and "honest_negative" in nn
          assert "caveat" in r["null_control"]
          # the self-disclosed freeze refinements must match the delivered counts
          dd = n["freeze_conformance_disclosures"]["D1_outcome_typing"]["counts"]
          got = dict(r["W4R4_propagation"]["counts"]); got.setdefault("REFLECTED", 0)
          assert dd == got, (dd, got)
          print("OK: no row claimed; notice and receipt agree on every headline number")
          PY
