name: Zero-copy firing qualification

on:
  push:
    branches:
      - codex/zero-copy-hotpaths-20260906
    paths:
      - 'src/ocm/**'
      - tests/m1/test_firing_zero_copy.py
      - .github/workflows/zero-copy-firing-qualification.yml

permissions:
  contents: write

jobs:
  qualify-and-record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/zero-copy-hotpaths-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned development environment
        run: ./scripts/m0_install_dev.sh
      - name: Run zero-copy firing hostile controls
        run: python -m pytest -q tests/m1/test_firing_zero_copy.py tests/m1/test_mutants.py
      - name: Run and select exact engineering gates
        env:
          PYTHONPATH: src
        run: python tools/record_engineering_revision.py
      - name: Verify all milestone wrappers against selected run
        env:
          PYTHONPATH: src
        run: |
          for m in $(seq 1 12); do
            python "tools/m${m}_receipt.py" --verify
          done
      - name: Commit immutable engineering qualification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/provenance/engineering_revisions/
          if git diff --cached --quiet; then
            echo "Recorder produced no new qualification bytes"
            exit 1
          fi
          git commit -m "test: record zero-copy firing qualification"
          git push origin HEAD:codex/zero-copy-hotpaths-20260906
