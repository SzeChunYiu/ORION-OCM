name: GMI capability interactions (F3 tranche 3)

on:
  pull_request:
    paths:
      - 'research/gmi-capability-interactions-v3/**'
      - '.github/workflows/gmi-capability-interactions-tranche3.yml'
  push:
    paths:
      - 'research/gmi-capability-interactions-v3/**'
      - '.github/workflows/gmi-capability-interactions-tranche3.yml'
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact controls
        shell: bash
        run: |
          if [ "${{ matrix.optimized }}" = "true" ]; then
            python3 -I -O -B research/gmi-capability-interactions-v3/test_capability_interactions_v3.py -v
          else
            python3 -I -B research/gmi-capability-interactions-v3/test_capability_interactions_v3.py -v
          fi
