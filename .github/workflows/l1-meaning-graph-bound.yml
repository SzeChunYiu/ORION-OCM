name: L1 meaning-graph bound

on:
  pull_request:
    paths:
      - 'research/l1-meaning-graph-bound-v1/**'
      - '.github/workflows/l1-meaning-graph-bound.yml'
      - 'src/ocm/language/**'
  push:
    branches: [main]
    paths:
      - 'research/l1-meaning-graph-bound-v1/**'
      - '.github/workflows/l1-meaning-graph-bound.yml'

permissions:
  contents: read

jobs:
  meaning-graph-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/l1-meaning-graph-bound-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-mgb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/l1-meaning-graph-bound-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
      - name: Bound study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-mgb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/l1-meaning-graph-bound-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "l1-mgb-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          allowed = {
              "GRAPH_BOUND_EXCEEDED_AT_SCOPE",
              "GRAPHS_INSIDE_HISTORICAL_BOUND_AT_SCOPE",
              "CANNOT_CHECK_NO_HISTORICAL_BOUND",
          }
          if result["terminal"] not in allowed:
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result.get("l2_started") or result.get("l3_started"):
              sys.exit("L2/L3 must stay locked")
          if result.get("neural_net") or result.get("corpus_n1"):
              sys.exit("NN / corpus N1 is not licensed")
          if result["terminal"] != "CANNOT_CHECK_NO_HISTORICAL_BOUND":
              if result.get("historical_bound", {}).get("value") is None:
                  sys.exit("historical bound must be recorded or CANNOT_CHECK")
          PY
          cp research/l1-meaning-graph-bound-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Frozen L1 G2 RESULT.json not overwritten
        run: |
          set -euo pipefail
          for p in \
            research/l1-linguistic-g2-v1/RESULT.json \
            research/l1-linguistic-g2-v2/RESULT.json \
            research/l1-linguistic-g2-v3/RESULT.json \
            research/l1-linguistic-g2-v4/RESULT.json
          do
            if [ -f "$p" ]; then
              git diff --exit-code -- "$p"
            fi
          done
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-meaning-graph-bound
          path: '${{ runner.temp }}/l1-mgb-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
