name: GMI 833 AE15 world model necessity v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-ae15-world-model-necessity-v1/**'
      - '.github/workflows/gmi-833-ae-ae15-world-model-necessity-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-ae15-world-model-necessity-v1/**'
      - '.github/workflows/gmi-833-ae-ae15-world-model-necessity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=0f166240f67cce4dc7da8ab5acd1189d67ea1107
          pkg=research/gmi-833-ae-ae15-world-model-necessity-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          git cat-file blob "$freeze:$pkg/FREEZE_V1.md" \
            | cmp - "$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/PROSPECTIVE_REGISTER_V1.json" \
            "$pkg/ae15_world_model_necessity_v1.py" \
            "$pkg/independent_world_model_oracle_v1.py" \
            "$pkg/test_ae15_world_model_necessity_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/CORE.md" \
            "$pkg/AE15_THEOREMS_V1.md" \
            "$pkg/PARENT_OWNERSHIP_V1.md" \
            "$pkg/ISSUE_833_RECONCILIATION_AE15_WORLD_MODEL_NECESSITY_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Register custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=0f166240f67cce4dc7da8ab5acd1189d67ea1107
          reg=bbba259b86f9fc53402527dd662405422296fb3f
          pkg=research/gmi-833-ae-ae15-world-model-necessity-v1
          git cat-file -e "$reg^{commit}"
          git cat-file -e "$reg:$pkg/PROSPECTIVE_REGISTER_V1.json"
          git cat-file blob "$reg:$pkg/PROSPECTIVE_REGISTER_V1.json" \
            | cmp - "$pkg/PROSPECTIVE_REGISTER_V1.json"
          git merge-base --is-ancestor "$freeze" "$reg"
          git merge-base --is-ancestor "$reg" HEAD
          for p in \
            "$pkg/ae15_world_model_necessity_v1.py" \
            "$pkg/independent_world_model_oracle_v1.py" \
            "$pkg/test_ae15_world_model_necessity_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/CORE.md" \
            "$pkg/AE15_THEOREMS_V1.md" \
            "$pkg/PARENT_OWNERSHIP_V1.md" \
            "$pkg/ISSUE_833_RECONCILIATION_AE15_WORLD_MODEL_NECESSITY_V1.json"; do
            if git cat-file -e "$reg:$p" 2>/dev/null; then
              echo "implementation blob already existed at the register commit: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            if git cat-file -e "HEAD:$1" 2>/dev/null; then
              actual="$(git rev-parse "HEAD:$1")"
              if [ "$actual" != "$2" ]; then
                echo "parent pin mismatch for $1: $actual != $2" >&2
                exit 1
              fi
              echo "pinned: $1"
            else
              echo "pinned path absent on this ref, skipped: $1"
            fi
          }
          verify_parent research/gmi-833-theory-baseline-v1/BASELINE_V1.md 201ee8e8b290f5bfa3e283e6f8be2429ce8eeb78
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
      - name: Register digest
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('research/gmi-833-ae-ae15-world-model-necessity-v1'
                   '/PROSPECTIVE_REGISTER_V1.json')
          reg = json.loads(p.read_text())
          core = dict(reg)
          core.pop('self_digest_sha256')
          core.pop('self_digest_note')
          got = hashlib.sha256(json.dumps(
              core, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          if got != reg['self_digest_sha256']:
              raise SystemExit('register digest mismatch: %s' % got)
          if got != ('34d35505ea4d0c061df9a8057b5b075cfa832eb572e1c1510a'
                     'f58228ddbb0c8b'):
              raise SystemExit('register digest is not the pinned value')
          print('register digest OK')
          PY
      - name: Executor and tests in both modes
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-ae15-world-model-necessity-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_ae15_world_model_necessity_v1.py" -v
            python -I -O -B "$pkg/ae15_world_model_necessity_v1.py" > /tmp/ae15.json
          else
            python -I -B "$pkg/test_ae15_world_model_necessity_v1.py" -v
            python -I -B "$pkg/ae15_world_model_necessity_v1.py" > /tmp/ae15.json
          fi
          cmp /tmp/ae15.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path

          def need(cond, msg):
              if not cond:
                  raise SystemExit('FAILED: ' + msg)

          root = Path('research/gmi-833-ae-ae15-world-model-necessity-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE15_WORLD_MODEL_NECESSITY_BOUNDARY_DERIVED_ON_'
                      'REGISTERED_FINITE_POMDP_ROSTER')
          need(m['claim_ceiling'] == r['claim_ceiling'] == expected,
               'claim ceiling')
          need(m['source_main'] == r['source_main']
               == '0dcdec54fbece041ee2b7cd1f630469ad85d19d3', 'source_main')
          need(m['freeze_commit'] == r['freeze_commit']
               == '0f166240f67cce4dc7da8ab5acd1189d67ea1107', 'freeze_commit')
          need(m['register_digest'] == r['register_digest'], 'register digest')
          need(r['issue'] == 833 and r['issue_comment_id'] == 5692689542,
               'issue identifiers')
          need(r['verdict'] == 'GREEN', 'verdict')
          need(all(r['checks'].values()),
               'checks: ' + ','.join(sorted(k for k, v in r['checks'].items()
                                            if not v)))
          need(m['theorems'] == r['theorems'], 'theorem ids')
          need(m['rows_left_open'] == [], 'rows left open')

          res = r['results']
          ro = res['reactive_optimal_task']
          need(ro['model_based_optimum'] == '3/4', 'AE15-2 optimum')
          need(ro['best_reactive_value'] == '3/4', 'AE15-2 reactive')
          need(ro['gap'] == '0', 'AE15-2 gap')
          need(ro['value_of_myopically_greedy_reactive_policy'] == '7/16',
               'AE15-2 myopic value')

          mn = res['model_needed_task']
          need(mn['model_based_optimum'] == '1/2', 'AE15-3 optimum')
          for cls in ('REACTIVE_POLICY', 'CACHED_SKILL',
                      'VALUE_REPRESENTATION'):
              need(mn['best_value_by_class'][cls] == '1/4',
                   'AE15-3 class best ' + cls)
              need(mn['gap_by_class'][cls] == '1/4', 'AE15-3 gap ' + cls)
          need(mn['gap'] == '1/4', 'AE15-3 gap')
          need(mn['all_strictly_suboptimal'] is True, 'AE15-3 strictness')
          need(mn['class_sizes_enumerated']['REACTIVE_POLICY'] == 27,
               'AE15-3 reactive enumeration')
          need(mn['class_sizes_enumerated']['CACHED_SKILL'] == 27,
               'AE15-3 cached enumeration')
          need(mn['value_representation_structural_upper_bound_on_'
                  'realizable_maps'] == 6, 'AE15-3 structural bound')

          pb = res['phase_boundary']
          need([x['c_star'] for x in pb['rows']] == ['1/4', '1/2', '3/4', '1'],
               'AE15-4 thresholds')
          need(pb['strictly_increasing_in_G'] is True, 'AE15-4 monotone')
          need(pb['flips_strictly_on_both_sides'] is True, 'AE15-4 flip')
          for x in pb['rows']:
              need(x['margin_below'] == '1/8' and x['margin_at'] == '0'
                   and x['margin_above'] == '-1/8', 'AE15-4 margins')

          probe = res['reward_swap_probe']
          need(res['reward_swap_probe_summary']['reoptimizing_classes']
               == ['EXPLICIT_GENERATIVE_MODEL'], 'AE15-1 probe')
          for cls in ('REACTIVE_POLICY', 'CACHED_SKILL',
                      'VALUE_REPRESENTATION'):
              need(probe[cls]['shortfall'] == '3/4', 'AE15-1 shortfall ' + cls)
          need(probe['EXPLICIT_GENERATIVE_MODEL']['shortfall'] == '0',
               'AE15-1 model shortfall')
          need(res['interfaces']['ordered_pairs_total'] == 20, 'AE15-1 pairs')
          need(res['interfaces']['ordered_pairs_strict'] == 18,
               'AE15-1 strict pairs')
          need(res['interfaces']['every_unordered_pair_separated'] is True,
               'AE15-1 distinctness')

          idt = res['identifiability']
          need(idt['observational_and_predictive_joints_identical'] is True,
               'AE15-5 joints')
          need(idt['latent_cardinalities'] == [2, 4], 'AE15-5 cardinalities')
          need(idt['interventional_profile_A']['do_X=x1']
               == {'y0': '1/2', 'y1': '1/2'}, 'AE15-5 do A')
          need(idt['interventional_profile_B']['do_X=x1'] == {'y1': '1'},
               'AE15-5 do B')
          need(idt['recovered_up_to_relabelling'] is True, 'AE15-5 recovery')
          need(idt['relabelling_permutations_checked'] == 6,
               'AE15-5 permutations')
          need(idt['relabelled_B_flagged_by_checker'] is False,
               'AE15-5 inverted hostile silence')

          need(res['forbidden_promotion_closure']['assertions_found'] == [],
               'AE15-6 scan')

          need(len(r['bounds']) == 3, 'bound count')
          for b in r['bounds']:
              need(b['vacuous'] is False, 'vacuous bound ' + b['id'])
              need(b['status'] == 'FALSIFIABLE_BOUND',
                   'unfalsified bound ' + b['id'])
              need(b['violated_by']['breaks_bound'] is True,
                   'violator ' + b['id'])

          need(len(r['hostiles']) == 5, 'hostile count')
          for h in r['hostiles']:
              need(h['potent'] is True, 'potency ' + h['name'])
              need(h['detected'] is True, 'detection ' + h['name'])
          inv = [h for h in r['hostiles'] if h['inverted']]
          need(len(inv) == 1 and inv[0]['name'] == 'H_LATENT_RELABEL',
               'inverted hostile')
          need(inv[0]['checker_flagged'] is False, 'inverted hostile silence')

          n = r['null']
          need(n['primary']['trials'] == 200, 'null trials')
          need(n['primary']['fired'] == 90, 'null rate')
          need(n['primary']['largest_null_magnitude'] == '99/512',
               'null magnitude')
          need(n['primary']['witness_exceeds_largest_null_magnitude'] is True,
               'threshold-free comparison')
          need(n['planted_positive_magnitude'] == '1/4', 'witness magnitude')
          need(n['known_clean_witnesses_flagged'] == [], 'no-alarm case')
          need(n['structure_matched']['conflict_vs_gap_confusion'][
              'no_conflict_and_gap_positive'] == 0, 'null attribution')

          need(len(r['prospective_predictions']) == 6, 'prediction count')
          for p in r['prospective_predictions']:
              need(p['status'] == 'CONFIRMED',
                   'prediction ' + p['id'] + ' is ' + p['status'])
          print('AE15 manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path

          def need(cond, msg):
              if not cond:
                  raise SystemExit('FAILED: ' + msg)

          root = Path('research/gmi-833-ae-ae15-world-model-necessity-v1')
          spec = json.loads((
              root /
              'ISSUE_833_RECONCILIATION_AE15_WORLD_MODEL_NECESSITY_V1.json'
          ).read_text())
          need(spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2', 'schema')
          need(spec['issue'] == 833, 'issue')
          need(spec['issue_comment_id'] == 5692689542, 'comment id')
          need(len(spec['replacements']) == 6, 'replacement count')
          need(spec['not_closed'] == [], 'not_closed')
          seen = set()
          for rep in spec['replacements']:
              need(rep['old'].startswith('- [ ] '), 'old prefix')
              need(rep['new'].startswith('- [x] '), 'new prefix')
              need(rep['new'][6:].startswith(rep['old'][6:]), 'byte-exact row')
              need(rep['old'] not in seen, 'duplicate row')
              seen.add(rep['old'])
              need(rep['anchor'] == '### AE15 — World-model necessity '
                                    'boundary', 'anchor')
          print('AE15 reconciliation spec OK')
          PY
