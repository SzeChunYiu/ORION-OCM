name: GMI 833 finite axiom core v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-axiom-core-v1/**'
      - '.github/workflows/gmi-833-axiom-core-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-axiom-core-v1/**'
      - '.github/workflows/gmi-833-axiom-core-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=b194a1009e30822e51e7bd3c03faaa699ccfbaad
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-axiom-core-v1/FREEZE_V1.md"
          for p in \
            research/gmi-833-axiom-core-v1/axiom_core_v1.py \
            research/gmi-833-axiom-core-v1/test_axiom_core_v1.py \
            research/gmi-833-axiom-core-v1/RESULT_V1.json \
            research/gmi-833-axiom-core-v1/AXIOM_CORE_THEORY_V1.md \
            research/gmi-833-axiom-core-v1/ISSUE_833_RECONCILIATION_AXIOM_CORE_V1.json; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact existed at freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify and materialize exact parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            path="$1"
            expected="$2"
            actual="$(git rev-parse "HEAD:$path")"
            if [ "$actual" != "$expected" ]; then
              echo "parent path/blob drift: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
            if [ ! -f "$path" ]; then
              mkdir -p "$(dirname "$path")"
              git show "HEAD:$path" > "$path"
            fi
            test "$(git hash-object "$path")" = "$expected"
          }
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
          verify_parent research/gmi-833-parent-equivalence-v1/RESULT_V1.json 7f6ee1c2d6e3e1bc24e66b192abffcc2d0a23ed3
          verify_parent research/gmi-833-morphcap-v1/RESULT_V1.json bdc5c3cd42e312d8c7af52f7ba84220631a25f8a
          verify_parent research/gmi-833-global-uncertainty-v1/RESULT_V1.json 9ab16cf59087214e093ace3b18c6d08fc79ab871
      - name: Exact finite-model and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-axiom-core-v1/test_axiom_core_v1.py -v
            python -I -O -B research/gmi-833-axiom-core-v1/axiom_core_v1.py > /tmp/result.json
          else
            python -I -B research/gmi-833-axiom-core-v1/test_axiom_core_v1.py -v
            python -I -B research/gmi-833-axiom-core-v1/axiom_core_v1.py > /tmp/result.json
          fi
          cmp /tmp/result.json research/gmi-833-axiom-core-v1/RESULT_V1.json
      - name: Check manifest and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/gmi-833-axiom-core-v1')
          manifest=json.loads((root/'MANIFEST_V1.json').read_text())
          result=json.loads((root/'RESULT_V1.json').read_text())
          expected='GMI_REGISTERED_FINITE_AXIOM_CORE_SATISFIABLE_AND_COMPACT_AT_SCOPE'
          assert manifest['freeze_commit']=='b194a1009e30822e51e7bd3c03faaa699ccfbaad'
          assert manifest['claim_ceiling']==expected==result['claim_ceiling']
          assert result['verdict']=='GREEN'
          assert all(result['checks'].values())
          assert result['hostile_hypercube']['cases']==128
          assert result['hostile_hypercube']['satisfying_cases']==1
          assert result['hostile_hypercube']['failures']==[]
          PY
      - name: Check #833 exact reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode check \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-axiom-core-v1/ISSUE_833_RECONCILIATION_AXIOM_CORE_V1.json

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only earned #833 Section C axiom-core rows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode apply \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-axiom-core-v1/ISSUE_833_RECONCILIATION_AXIOM_CORE_V1.json
