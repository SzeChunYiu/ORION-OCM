name: gmi-uncertainty-composition

on:
  pull_request:
    paths:
      - 'research/gmi-uncertainty-composition-v1/**'
      - '.github/workflows/gmi-uncertainty-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-hostile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-implementation freeze custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=417db4581fb66903eeba5c6bfb6e60a02719716d
          # L46-F2 fix: the freeze commit landed via squash merge and is not
          # an ancestor of main; it may be absent from a fresh checkout.
          # Reachable -> strict original custody. Unreachable -> verify the
          # recorded freeze record instead (hash + pre-registration phrase).
          if git cat-file -e "$FREEZE^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$FREEZE" HEAD 2>/dev/null; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$FREEZE" | sed '/^$/d')"
            test "$changed" = "research/gmi-uncertainty-composition-v1/FREEZE_V1.md"
            if git cat-file -e "$FREEZE:research/gmi-uncertainty-composition-v1/uncertainty_composition_v1.py" 2>/dev/null; then
              echo 'implementation existed in freeze commit' >&2
              exit 1
            fi
            if git cat-file -e "$FREEZE:research/gmi-uncertainty-composition-v1/RESULT_V1.json" 2>/dev/null; then
              echo 'result existed in freeze commit' >&2
              exit 1
            fi
          else
            grep -q "$FREEZE" research/gmi-uncertainty-composition-v1/FORMALIZATION_V1.md
            grep -q 'committed before this executor' research/gmi-uncertainty-composition-v1/FORMALIZATION_V1.md
            echo 'freeze commit unreachable from this checkout (squash-merged landing): verified recorded freeze record instead'
          fi
      - name: Run exact and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} -m unittest discover \
            -s research/gmi-uncertainty-composition-v1 \
            -p 'test_*.py'
      - name: Reproduce committed receipt
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-uncertainty-composition-v1/uncertainty_composition_v1.py > /tmp/RESULT_V1.json
          cmp /tmp/RESULT_V1.json research/gmi-uncertainty-composition-v1/RESULT_V1.json
