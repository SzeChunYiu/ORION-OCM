name: GMI 833 AE14 generalization taxonomy v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-ae14-generalization-taxonomy-v1/**'
      - '.github/workflows/gmi-833-ae-ae14-generalization-taxonomy-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-ae14-generalization-taxonomy-v1/**'
      - '.github/workflows/gmi-833-ae-ae14-generalization-taxonomy-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=6cd9f2924d153ea7f5938eca1a7694f9bf50606b
          pkg=research/gmi-833-ae-ae14-generalization-taxonomy-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/ae14_generalization_taxonomy_v1.py" \
            "$pkg/independent_taxonomy_oracle_v1.py" \
            "$pkg/test_ae14_generalization_taxonomy_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/CORE.md" \
            "$pkg/AE14_THEOREMS_V1.md" \
            "$pkg/PARENT_OWNERSHIP_V1.md" \
            "$pkg/PROSPECTIVE_REGISTER_V1.json" \
            "$pkg/ISSUE_833_RECONCILIATION_AE14_GENERALIZATION_TAXONOMY_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Register custody
        shell: bash
        run: |
          set -euo pipefail
          register=9857a838acd2f6f83499cac36de2193348c26d09
          pkg=research/gmi-833-ae-ae14-generalization-taxonomy-v1
          git cat-file -e "$register^{commit}"
          git cat-file -e "$register:$pkg/PROSPECTIVE_REGISTER_V1.json"
          # the register commit must precede every implementation blob
          for p in \
            "$pkg/ae14_generalization_taxonomy_v1.py" \
            "$pkg/independent_taxonomy_oracle_v1.py" \
            "$pkg/test_ae14_generalization_taxonomy_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/AE14_THEOREMS_V1.md"; do
            if git cat-file -e "$register:$p" 2>/dev/null; then
              echo "implementation blob already existed at the register: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            if git cat-file -e "HEAD:$1" 2>/dev/null; then
              actual="$(git rev-parse "HEAD:$1")"
              test "$actual" = "$2"
            else
              echo "pinned parent path not present on this ref: $1"
            fi
          }
          verify_parent research/gmi-833-theory-baseline-v1/BASELINE_V1.md 201ee8e8b290f5bfa3e283e6f8be2429ce8eeb78
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
      - name: Exact taxonomy tests, hostiles and nulls
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-ae14-generalization-taxonomy-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_ae14_generalization_taxonomy_v1.py" -v
            python -I -O -B "$pkg/ae14_generalization_taxonomy_v1.py" > /tmp/ae14.json
          else
            python -I -B "$pkg/test_ae14_generalization_taxonomy_v1.py" -v
            python -I -B "$pkg/ae14_generalization_taxonomy_v1.py" > /tmp/ae14.json
          fi
          cmp /tmp/ae14.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path

          def need(cond, msg):
              if not cond:
                  raise SystemExit("named-numbers check failed: " + msg)

          root = Path('research/gmi-833-ae-ae14-generalization-taxonomy-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE14_GENERALIZATION_MODES_OPERATIONALLY_'
                      'SEPARATED_ON_REGISTERED_FINITE_TASK_ROSTER')
          need(m['claim_ceiling'] == r['claim_ceiling'] == expected,
               'claim ceiling')
          need(m['source_main'] == r['source_main'] ==
               '0dcdec54fbece041ee2b7cd1f630469ad85d19d3', 'source main')
          need(m['freeze_commit'] == r['freeze_commit'] ==
               '6cd9f2924d153ea7f5938eca1a7694f9bf50606b', 'freeze commit')
          need(m['register_digest'] == r['register_digest'],
               'register digest')
          need(r['verdict'] == 'GREEN', 'verdict')
          need(all(r['checks'].values()), 'checks')
          need(m['target_rows'] == 6, 'target rows')
          need(m['rows_left_open'] == [], 'rows left open')

          res = r['results']
          enum = res['row2_enumeration']
          need(enum['GROUP_ORBIT']['classes']['L_mod'][
              'best_attainable_accuracy'] == '13/15', 'analogy L_mod')
          need(enum['GROUP_ORBIT']['classes']['L_search'][
              'best_attainable_accuracy'] == '1', 'analogy L_search')
          need(enum['COMPOSITION_DEPTH_GE_2']['classes']['L0'][
              'best_attainable_accuracy'] == '4/5', 'planning L0')
          need(enum['COMPOSITION_DEPTH_GE_2']['classes']['L_search'][
              'best_attainable_accuracy'] == '1', 'planning L_search')
          need(enum['DEDUCTIVE_CLOSURE']['classes']['L1'][
              'best_attainable_accuracy'] == '9/10', 'reasoning L1')
          need(enum['DEDUCTIVE_CLOSURE']['classes']['L_search'][
              'best_attainable_accuracy'] == '1', 'reasoning L_search')
          need(enum['GROUP_ORBIT']['classes']['L1'][
              'distinct_members'] == 70, 'L1 size')
          need(enum['GROUP_ORBIT']['classes']['L_lin'][
              'distinct_members'] == 32, 'L_lin size')
          need(enum['GROUP_ORBIT']['classes']['L_mod'][
              'distinct_members'] == 520, 'L_mod size')

          need(res['row2_modes_requiring_composition_machinery'] ==
               ['ANALOGY', 'PLANNING_INFERENCE', 'REASONING'], 'hard modes')
          need(res['row2_modes_reducible_to_prediction'] ==
               ['EXTRAPOLATION', 'INTERPOLATION', 'MEMORIZATION',
                'SYSTEMATIC_GENERALIZATION'], 'reducible modes')

          r3 = res['row3_matched_predictive_pair']
          need(r3['bayes_predictive_accuracy']['T_MATCH_COMPOSITIONAL'] ==
               r3['bayes_predictive_accuracy']['T_MATCH_LOOKUP'] == '3/4',
               'row 3 bayes')
          need(r3['recombination_accuracy']['T_MATCH_COMPOSITIONAL'] == '0',
               'row 3 compositional recombination')
          need(r3['recombination_accuracy']['T_MATCH_LOOKUP'] == '1',
               'row 3 lookup recombination')

          r4 = res['row4_matched_compression_pair']
          need(r4['T_CODE_A']['description_length_bits'] ==
               r4['T_CODE_B']['description_length_bits'] == 11, 'row 4 length')
          need(r4['T_CODE_A']['transfer_accuracy'] == '3/8', 'row 4 transfer A')
          need(r4['T_CODE_B']['transfer_accuracy'] == '3/4', 'row 4 transfer B')
          need(r4['kraft_sum'] == '523273/2097152', 'kraft sum')
          need(r4['kraft_compliant'] is True, 'kraft compliance')

          r5 = res['row5_mechanism_predictor']
          need(r5['hit_count'] == 7, 'predictor hits')
          need(r5['null_largest_hit_count'] == 4, 'null largest')
          need(r5['null_trials'] == 200, 'null trials')
          need(r5['predictor_strictly_beats_null'] is True, 'predictor beats')
          need(r5['evidential_hit_count'] == 6, 'evidential hits')
          sweep = r5['family_sweep']
          need(sweep['AFFINE']['rate'] == '1', 'affine sweep')
          need(sweep['JUNTA']['rate'] == '1', 'junta sweep')
          need(sweep['BLOCK_FACTORIZED']['rate'] == '1', 'block sweep')
          need(sweep['COMPOSITION_DEPTH_GE_2']['rate'] == '1', 'composition sweep')
          need(sweep['GROUP_ORBIT']['rate'] == '26/27', 'group sweep')

          sep = r['null']['separation_null']
          need(sep['witness_magnitude'] == 3, 'separation witness')
          need(sep['largest_null_magnitude'] < sep['witness_magnitude'],
               'separation null beaten')
          need(sep['known_clean_specifications_flagged'] == [],
               'no alarm on clean')

          need(res['pairwise_distinctness_summary']['ordered_pairs'] == 42,
               'ordered pairs')
          need(res['pairwise_distinctness_summary']['nondegenerate'] == 41,
               'nondegenerate witnesses')
          need(res['row6_forbidden_blanket_claim'][
              'unguarded_occurrences_in_package'] == [],
              'forbidden blanket guard')

          for b in r['bounds']:
              need(b['violated_by']['violates'] is True,
                   'bound without a violating witness: ' + b['id'])
              need(b['vacuous'] is False, 'vacuous bound: ' + b['id'])
          for h in r['hostiles']:
              need(h['potent'] is True, 'impotent hostile: ' + h['name'])
              need(h['detected'] is True, 'undetected hostile: ' + h['name'])
          ids = sorted(p['id'] for p in r['prospective_predictions'])
          need(ids == ['AE14-P1', 'AE14-P2', 'AE14-P3', 'AE14-P4', 'AE14-P5',
                       'AE14-P6'], 'prospective prediction ids')
          need(r['prospective_predictions_refuted'] == ['AE14-P1'],
               'reported refutations')
          print('AE14 manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path

          def need(cond, msg):
              if not cond:
                  raise SystemExit("reconciliation check failed: " + msg)

          root = Path('research/gmi-833-ae-ae14-generalization-taxonomy-v1')
          spec = json.loads((
              root /
              'ISSUE_833_RECONCILIATION_AE14_GENERALIZATION_TAXONOMY_V1.json'
          ).read_text())
          need(spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2', 'schema')
          need(spec['issue'] == 833, 'issue')
          need(spec['issue_comment_id'] == 5692689542, 'comment id')
          need(len(spec['replacements']) == 6, 'replacement count')
          need(spec['not_closed'] == [], 'not closed')
          seen = set()
          for rep in spec['replacements']:
              need(rep['old'].startswith('- [ ] '), 'old prefix')
              need(rep['new'].startswith('- [x] '), 'new prefix')
              need(rep['new'][6:].startswith(rep['old'][6:]), 'new keeps old')
              need(rep['old'] not in seen, 'duplicate row')
              seen.add(rep['old'])
              need(rep['anchor'].startswith('### AE14 '), 'anchor')
          print('AE14 reconciliation spec OK')
          PY
