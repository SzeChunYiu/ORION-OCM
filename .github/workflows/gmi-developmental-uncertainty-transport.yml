name: gmi-developmental-uncertainty-transport

on:
  pull_request:
    paths:
      - 'research/gmi-developmental-uncertainty-transport-v1/**'
      - 'research/gmi-developmental-taxonomy-v1/**'
      - 'research/gmi-f1-replay-resistant-adapter-v1/**'
      - '.github/workflows/gmi-developmental-uncertainty-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-hostile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-implementation freeze custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=041bb8950ebeed94b8b258e7ad23258df19eec1c
          FREEZE_PATH=research/gmi-developmental-uncertainty-transport-v1/FREEZE_V1.md
          # L46-F2 fix: #749 was squash-merged, so the freeze commit is not an
          # ancestor of main and may be absent from a fresh checkout. If the
          # object is present, verify the immutable freeze object directly
          # (exists, changed only the freeze file, contained no implementation
          # or result, and the merged freeze file is byte-identical to it).
          # If the object is unreachable, verify the recorded freeze record
          # instead (hash + pre-registration phrase in FORMALIZATION_V1.md).
          if git cat-file -e "$FREEZE^{commit}" 2>/dev/null; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$FREEZE" | sed '/^$/d')"
            test "$changed" = "$FREEZE_PATH"
            git show "$FREEZE:$FREEZE_PATH" > /tmp/FREEZE_V1.md
            cmp /tmp/FREEZE_V1.md "$FREEZE_PATH"
            if git cat-file -e "$FREEZE:research/gmi-developmental-uncertainty-transport-v1/developmental_uncertainty_transport_v1.py" 2>/dev/null; then
              echo 'implementation existed in freeze commit' >&2
              exit 1
            fi
            if git cat-file -e "$FREEZE:research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json" 2>/dev/null; then
              echo 'result existed in freeze commit' >&2
              exit 1
            fi
          else
            grep -q "$FREEZE" research/gmi-developmental-uncertainty-transport-v1/FORMALIZATION_V1.md
            grep -q 'committed before this executor' research/gmi-developmental-uncertainty-transport-v1/FORMALIZATION_V1.md
            echo 'freeze commit unreachable from this checkout (squash-merged landing): verified recorded freeze record instead'
          fi
      - name: Run exact and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} -m unittest discover \
            -s research/gmi-developmental-uncertainty-transport-v1 \
            -p 'test_*.py'
      - name: Reproduce committed receipt
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-developmental-uncertainty-transport-v1/developmental_uncertainty_transport_v1.py > /tmp/RESULT_V1.json
          cmp /tmp/RESULT_V1.json research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json
      - name: Reproduce dependence certificate
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-developmental-uncertainty-transport-v1/dependence_certificate_v1.py > /tmp/DEPENDENCE_CERTIFICATE_V1.json
          cmp /tmp/DEPENDENCE_CERTIFICATE_V1.json research/gmi-developmental-uncertainty-transport-v1/DEPENDENCE_CERTIFICATE_V1.json
