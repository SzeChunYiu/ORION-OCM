name: gmi-833-update-law-regimes-v1

on:
  push:
    paths:
      - 'research/gmi-833-update-law-regimes-v1/**'
      - '.github/workflows/gmi-833-update-law-regimes-v1.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  pull_request:
    paths:
      - 'research/gmi-833-update-law-regimes-v1/**'
      - '.github/workflows/gmi-833-update-law-regimes-v1.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  workflow_dispatch:

jobs:
  regimes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/gmi-833-update-law-regimes-v1
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the freeze-ancestry gate below walks git log
          fetch-depth: 0

      - name: freeze precedes implementation (squash-safe)
        working-directory: .
        run: |
          set -e
          # Squash-safe custody (parent: PR #1053 freeze; doctrine of #1042). Once the
          # package's PR is squash-merged, freeze and implementation first appear in ONE
          # commit and the ordering can no longer be re-derived from history. The shared
          # checker keeps the strict ordering proof on a linear history; on a squash-
          # published one it withholds ONLY that assertion, still checks everything
          # derivable from HEAD and from the source freeze commit, and prints
          # FREEZE_ORDER_NOT_REDERIVABLE:<commit> checked:<list>. Violations exit 1,
          # could-not-check exits 2; nothing is reported as passed unchecked.
          python3 -I -B research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py \
            --repo . --pkg research/gmi-833-update-law-regimes-v1 --freeze FREEZE_V1.md \
            --freeze-commit 6e42ccd2a7852ce88196765a6013b32315a78108 \
            --impl update_law_regimes_v1.py --impl oracle_update_law_regimes_v1.py \
            --impl test_update_law_regimes_v1.py --impl measure_d1_sensitivity_v1.py \
            --impl RESULT_V1.json --impl ORACLE_RESULT_V1.json --impl D1_SENSITIVITY_V1.json

      - name: route B (oracle)
        run: python3 -I -B oracle_update_law_regimes_v1.py

      - name: route A (executor)
        run: python3 -I -B update_law_regimes_v1.py

      - name: receipts are byte-reproducible
        run: |
          set -e
          cp RESULT_V1.json /tmp/a1.json
          cp ORACLE_RESULT_V1.json /tmp/b1.json
          python3 -I -O -B update_law_regimes_v1.py
          python3 -I -O -B oracle_update_law_regimes_v1.py
          cmp /tmp/a1.json RESULT_V1.json
          cmp /tmp/b1.json ORACLE_RESULT_V1.json

      - name: receipts match the committed ones
        working-directory: .
        run: git diff --exit-code -- research/gmi-833-update-law-regimes-v1

      - name: checks
        run: |
          python3 -I -B  test_update_law_regimes_v1.py
          python3 -I -O -B test_update_law_regimes_v1.py

      - name: D1 exposure is measured, not asserted
        run: |
          set -e
          python3 -I -B measure_d1_sensitivity_v1.py
          # NOTE: this heredoc body is indented to the YAML block indent.
          # YAML strips exactly that indent, so python receives it at column 0.
          # Written at column 0 here it would terminate the block scalar and
          # make the whole workflow unparseable, which is what it did before.
          python3 - <<'PY'
          import json
          d = json.load(open("D1_SENSITIVITY_V1.json"))
          if d["sensitivity_test"]["certificate_leaf_fields"] <= 0:
              raise SystemExit("FAIL: no certificate leaf fields counted")
          print("D1 exposure:", d["sensitivity_test"]["fields_changed"], "of",
                d["sensitivity_test"]["certificate_leaf_fields"])
          PY
          git -C . diff --exit-code -- D1_SENSITIVITY_V1.json || \
            (echo "FAIL: committed D1 sensitivity does not reproduce"; exit 1)
          # the deviation-free re-run must leave every other receipt untouched
          git -C . diff --exit-code -- .
          test -z "$(git -C . status --porcelain -- .)"

