name: N1 packed construction parser
on:
  pull_request:
    paths:
      - 'research/ocm-n1/**'
      - 'research/ocm-prototype/**'
      - 'src/ocm/**'
      - '.github/workflows/n1-packed-chart.yml'
  push:
    branches: [main]
    paths:
      - 'research/ocm-n1/**'
      - 'research/ocm-prototype/**'
      - 'src/ocm/**'
      - '.github/workflows/n1-packed-chart.yml'
permissions:
  contents: read
jobs:
  packed-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: ./scripts/m0_install_dev.sh
      - name: Install pinned donor and independent checker dependencies
        run: python -m pip install -r research/ocm-prototype/requirements-g1.txt
      - name: Fetch custody-checked development data for external grader controls
        run: curl --fail --location --retry 2 --connect-timeout 10 --output "$RUNNER_TEMP/g1-dev.conllu" https://raw.githubusercontent.com/UniversalDependencies/UD_English-EWT/r2.14/en_ewt-ud-dev.conllu
      - name: N1 parser and shared vessel lifecycle checks
        env:
          OCM_G1_DEV_PATH: ${{ runner.temp }}/g1-dev.conllu
        run: python -m pytest research/ocm-n1 research/ocm-prototype -q
