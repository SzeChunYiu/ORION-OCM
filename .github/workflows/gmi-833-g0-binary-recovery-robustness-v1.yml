name: GMI 833 G0 binary recovery robustness v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-g0-binary-recovery-v1/**'
      - '.github/workflows/gmi-833-g0-binary-recovery-robustness-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-g0-binary-recovery-v1/**'
      - '.github/workflows/gmi-833-g0-binary-recovery-robustness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-robustness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scientific freeze ancestry and concurrent parent
        shell: bash
        run: |
          set -euo pipefail
          freeze=302ad7fed43b0e310b6e22252ceb21260edd865b
          parent=497977a071f33a824628332caf1ccc44e077f924
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$parent^{commit}"
          git cat-file -e "$freeze:research/gmi-833-g0-binary-recovery-v1/FREEZE_V1.md"
          test -f research/gmi-833-robustness-controls-v1/robustness_controls_v1.py
          test -f research/gmi-833-robustness-controls-v1/RESULT_V1.json
      - name: Apply merged robustness control implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-g0-binary-recovery-v1/test_robustness_application_v1.py -v
            python -I -O -B research/gmi-833-g0-binary-recovery-v1/robustness_application_v1.py > /tmp/robustness.json
          else
            python -I -B research/gmi-833-g0-binary-recovery-v1/test_robustness_application_v1.py -v
            python -I -B research/gmi-833-g0-binary-recovery-v1/robustness_application_v1.py > /tmp/robustness.json
          fi
          cmp /tmp/robustness.json research/gmi-833-g0-binary-recovery-v1/ROBUSTNESS_RESULT_V1.json
      - name: Check robustness manifest and terminals
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-g0-binary-recovery-v1')
          manifest = json.loads((root/'ROBUSTNESS_MANIFEST_V1.json').read_text())
          result = json.loads((root/'ROBUSTNESS_RESULT_V1.json').read_text())
          parent = json.loads(Path('research/gmi-833-robustness-controls-v1/RESULT_V1.json').read_text())
          assert manifest['scientific_freeze_commit'] == '302ad7fed43b0e310b6e22252ceb21260edd865b'
          assert manifest['parent_control_claim'] == parent['claim_ceiling']
          assert result['parent_control_claim'] == parent['claim_ceiling']
          assert result['scientific_claim'] == manifest['scientific_claim']
          assert result['verdict'] == 'GREEN'
          assert all(result['checks'].values())
          assert all(a['control_requirements_terminal'] == 'CONTROL_REQUIREMENTS_SATISFIED' for a in result['audits'].values())
          assert all(a['terminal'] == 'ROBUST_AT_REGISTERED_CONTROLS' for a in result['audits'].values())
          PY
