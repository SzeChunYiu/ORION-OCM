name: gmi-833-z-z12-prediction-scoring

on:
  push:
    paths:
      - 'research/gmi-833-z-z12-prediction-scoring-v1/**'
      - 'research/gmi-833-z-map-v1/**'
      - '.github/workflows/gmi-833-z-z12-prediction-scoring.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  pull_request:
    paths:
      - 'research/gmi-833-z-z12-prediction-scoring-v1/**'
      - 'research/gmi-833-z-map-v1/**'
      - '.github/workflows/gmi-833-z-z12-prediction-scoring.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  workflow_dispatch:

jobs:
  z12:
    name: Z12 exact prediction scoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze precedes implementation (squash-safe)
        run: |
          set -eu
          # Squash-safe custody (parent: PR #1053 freeze; doctrine of #1042). Once the
          # package's PR is squash-merged, freeze and implementation first appear in ONE
          # commit and the ordering can no longer be re-derived from history. The shared
          # checker keeps the strict ordering proof on a linear history; on a squash-
          # published one it withholds ONLY that assertion, still checks everything
          # derivable from HEAD and from the source freeze commit, and prints
          # FREEZE_ORDER_NOT_REDERIVABLE:<commit> checked:<list>. Violations exit 1,
          # could-not-check exits 2; nothing is reported as passed unchecked.
          python3 -I -B research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py \
            --repo . --pkg research/gmi-833-z-z12-prediction-scoring-v1 --freeze FREEZE_V1.md \
            --freeze-commit 2ced72d59cabf44caf7394ab4d973d61f18c3cd8 \
            --impl z12_prediction_scoring_v1.py --impl independent_scoring_oracle_v1.py \
            --impl test_z12_prediction_scoring_v1.py --impl RESULT_V1.json --impl ORACLE_RESULT_V1.json

      - name: Section Z map integrity
        run: python3 -I -B research/gmi-833-z-map-v1/check_z_map_v1.py

      - name: Workflow integrity
        run: python3 -I -B research/gmi-833-workflow-integrity-v1/check_workflows_v1.py

      - name: Route B oracle
        run: python3 -I -B research/gmi-833-z-z12-prediction-scoring-v1/independent_scoring_oracle_v1.py

      - name: Route A executor
        run: python3 -I -B research/gmi-833-z-z12-prediction-scoring-v1/z12_prediction_scoring_v1.py

      - name: Receipt is byte-stable
        run: |
          set -eu
          git diff --exit-code -- research/gmi-833-z-z12-prediction-scoring-v1/RESULT_V1.json
          git diff --exit-code -- research/gmi-833-z-z12-prediction-scoring-v1/ORACLE_RESULT_V1.json

      - name: Tests (normal mode)
        run: python3 -I -B research/gmi-833-z-z12-prediction-scoring-v1/test_z12_prediction_scoring_v1.py -v

      - name: Tests (optimized mode)
        run: python3 -I -O -B research/gmi-833-z-z12-prediction-scoring-v1/test_z12_prediction_scoring_v1.py -v

      - name: Verdict gate
        run: |
          set -eu
          python3 -I -B - research/gmi-833-z-z12-prediction-scoring-v1/RESULT_V1.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as fh:
              r = json.load(fh)
          bad = [k for k, v in r["gates"].items() if not v]
          if bad:
              sys.exit("gates failed: %s" % bad)
          if r["verdict"] != "GREEN":
              sys.exit("verdict %s" % r["verdict"])
          print("Z12 GREEN, gates:", len(r["gates"]))
          PY
