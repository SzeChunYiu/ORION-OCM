name: G1 duplicate cognitive cores

on:
  pull_request:
    paths:
      - 'research/g1-duplicate-cores-v1/**'
      - 'research/g1-vessel-freeze-v1/**'
      - '.github/workflows/g1-duplicate-cores.yml'
      - 'src/ocm/runtime/**'
      - 'src/ocm/language/**'
      - 'src/ocm/science/**'
      - 'src/ocm/work/**'
      - 'src/ocm/dialogue/**'
      - 'src/ocm/lifetime/**'
      - 'src/ocm/operators/**'
      - 'src/ocm/kso/**'
  push:
    branches: [main]
    paths:
      - 'research/g1-duplicate-cores-v1/**'
      - '.github/workflows/g1-duplicate-cores.yml'

permissions:
  contents: read

jobs:
  g1-duplicate-cores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g1-duplicate-cores-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-dup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/g1-duplicate-cores-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/g1-duplicate-cores-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Shared-core measurement
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-dup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/g1-duplicate-cores-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          cp research/g1-duplicate-cores-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Frozen G1.1 inventory not overwritten
        run: git diff --exit-code -- research/g1-vessel-freeze-v1
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-duplicate-cores
          path: '${{ runner.temp }}/g1-dup-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
