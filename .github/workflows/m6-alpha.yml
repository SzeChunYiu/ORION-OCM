name: M6 conversational alpha
on:
  pull_request:
  push:
    branches: [main, m6/conversational-alpha]
permissions:
  contents: read
concurrency:
  group: m6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: ./scripts/m0_install_dev.sh
      - name: M6 world, realisation, planner and chat suites
        run: python -m pytest -q tests/m6
      - name: M5, M4 and M3 still green under M6
        run: python -m pytest -q tests/m5 tests/m4 tests/m3 && python tools/m5_receipt.py --verify && python tools/m4_receipt.py --verify && python tools/m3_receipt.py --verify
      - name: Scripted Alpha demonstration runs on a clean state
        run: python -m ocm.chat --demo --state /tmp/ocm_demo_ci | tail -5
      - name: Scenario receipt is reproducible
        run: |
          rm -f /tmp/m6_eval.json
          python -m ocm.evaluation.m6_alpha_eval --out /tmp/m6_eval.json > /dev/null
          python - <<'PY'
          import json
          a = json.load(open("/tmp/m6_eval.json")); b = json.load(open("research/ocm-m6/M6_ALPHA_SCENARIO_EVAL_V1.json"))
          for k in ("scenarios", "steps_total", "steps_expected", "hostiles", "incidents", "external_io"):
              assert a[k] == b[k], (k,)
          print("scenario receipt reproduced")
          PY
      - name: M6 receipt drift
        run: python tools/m6_receipt.py --verify
