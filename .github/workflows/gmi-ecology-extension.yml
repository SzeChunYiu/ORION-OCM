name: GMI ecology extension (A2)

on:
  pull_request:
    paths:
      - 'research/gmi-ecology-extension-v1/**'
      - '.github/workflows/gmi-ecology-extension.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-ecology-extension-v1/**'
      - '.github/workflows/gmi-ecology-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecology-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Run ecology extension controls
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          args=(-I -B)
          if [ "$MODE" = optimized ]; then args+=(-O); fi
          python "${args[@]}" research/gmi-ecology-extension-v1/test_ecology_extension_v1.py -v
