name: GMI 833 AE1 structure separation v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-ae1-structure-separation-v1/**'
      - '.github/workflows/gmi-833-ae-ae1-structure-separation-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-ae1-structure-separation-v1/**'
      - '.github/workflows/gmi-833-ae-ae1-structure-separation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=a466dab4c464e0c697f4caf5a3cceb3a5d73278c
          pkg=research/gmi-833-ae-ae1-structure-separation-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/ae1_structure_separation_v1.py" \
            "$pkg/independent_separation_oracle_v1.py" \
            "$pkg/test_ae1_structure_separation_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/AE1_THEOREMS_V1.md" \
            "$pkg/minimality_sweeps_v1.py" \
            "$pkg/ISSUE_833_RECONCILIATION_AE1_STRUCTURE_SEPARATION_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            actual="$(git rev-parse "HEAD:$1")"
            test "$actual" = "$2"
          }
          verify_parent research/gmi-833-theory-baseline-v1/BASELINE_V1.md 201ee8e8b290f5bfa3e283e6f8be2429ce8eeb78
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
      - name: Exact separation tests and hostiles
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-ae1-structure-separation-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_ae1_structure_separation_v1.py" -v
            python -I -O -B "$pkg/ae1_structure_separation_v1.py" > /tmp/ae1.json
          else
            python -I -B "$pkg/test_ae1_structure_separation_v1.py" -v
            python -I -B "$pkg/ae1_structure_separation_v1.py" > /tmp/ae1.json
          fi
          cmp /tmp/ae1.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae1-structure-separation-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE1_TASK_RELATIVE_EXPLOITABLE_STRUCTURE_'
                      'SEPARATED_ON_REGISTERED_FINITE_WITNESS_ROSTER')
          assert m['claim_ceiling'] == r['claim_ceiling'] == expected
          assert m['source_main'] == r['source_main'] == (
              '91c6d2876ba80c517a186e28fce3bdbe4e3fc218')
          assert m['freeze_commit'] == r['freeze_commit'] == (
              'a466dab4c464e0c697f4caf5a3cceb3a5d73278c')
          assert r['verdict'] == 'GREEN' and all(r['checks'].values())
          res = r['results']
          assert res['distributional_separation']['W_DEP_NOPRED']['gain'] == '0'
          assert res['distributional_separation'][
              'W_DEP_NOPRED']['l1_dependence'] == '1/5'
          assert res['distributional_separation'][
              'W_IND_SKEW']['l1_dependence'] == '0'
          assert res['existence_vs_accessibility']['best_acc_at_k2_d2'] == '1/2'
          assert res['existence_vs_accessibility']['best_acc_at_k3_d2'] == '1/2'
          assert res['existence_vs_accessibility']['best_acc_at_k3_d3'] == '1'
          assert res['causal_separation']['interventional_gain'] == '0'
          assert res['causal_separation']['observational_gain'] == '3/20'
          assert res['control_separation']['W_CTRL_NOPRED']['control_gain'] == '1/4'
          assert res['control_separation']['W_PRED_NOCTRL']['control_gain'] == '0'
          assert res['discoverability']['learning_curve']['m0'] == '9/16'
          assert res['discoverability']['learning_curve']['m3'] == '6715/8192'
          assert res['scalar_impossibility']['reversal'] is True
          assert res['profile_object']['monotone'] is True
          mn = res['minimality']
          assert mn['distributional'][
              'shapes_admitting_PRED_without_DEP'] == []
          assert mn['control_row4'][
              'PRED_without_CTRL_nonconstant_utility'][
                  'minimal_shapes_at_least_two_actions'] == [[2, 2, 2]]
          assert mn['control_row4']['CTRL_without_PRED'][
              'minimal_shapes_at_least_two_actions'] == [[2, 3, 2]]
          assert mn['causal_row4']['PRED_with_zero_interventional_gain'][
              'minimal_shapes'] == [[2, 2, 2]]
          assert mn['accessibility_row5']['arity_gap']['minimal_n'] == 2
          assert mn['accessibility_row5'][
              'depth_gap_with_every_coordinate_reachable']['minimal_n'] == 3
          assert mn['discoverability_row6']['minimal_n'] == 1
          ws = mn['witness_minimality_status']
          assert ws['W_PARITY3']['minimal_for_plain_arity_gap'] is False
          assert ws['parity_family_n3']['minimal'] is False
          assert res['null']['random_worlds_at_or_above_threshold'] == 0
          assert res['null']['known_clean_worlds_flagged'] == []
          assert res['null']['largest_null_gap_magnitude'] == '3/16'
          assert res['null']['witness_exceeds_largest_null_gap'] is True
          assert res['null']['planted_positive_gap_magnitude'] == '1/2'
          print('AE1 manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae1-structure-separation-v1')
          spec = json.loads((
              root /
              'ISSUE_833_RECONCILIATION_AE1_STRUCTURE_SEPARATION_V1.json'
          ).read_text())
          assert spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2'
          assert spec['issue'] == 833
          assert spec['issue_comment_id'] == 5692689542
          assert len(spec['replacements']) == 8
          seen = set()
          for rep in spec['replacements']:
              assert rep['old'].startswith('- [ ] ')
              assert rep['new'].startswith('- [x] ')
              assert rep['new'][6:].startswith(rep['old'][6:])
              assert rep['old'] not in seen
              seen.add(rep['old'])
              assert rep['anchor'].startswith('### AE1 ')
          print('AE1 reconciliation spec OK')
          PY
