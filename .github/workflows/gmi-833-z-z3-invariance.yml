name: gmi-833-z-z3-invariance

on:
  push:
    paths:
      - 'research/gmi-833-z-z3-invariance-v1/**'
      - '.github/workflows/gmi-833-z-z3-invariance.yml'
  pull_request:
    paths:
      - 'research/gmi-833-z-z3-invariance-v1/**'
      - '.github/workflows/gmi-833-z-z3-invariance.yml'
  workflow_dispatch:

jobs:
  z3:
    name: Z3 invariance and representation independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze precedes implementation
        run: |
          set -eu
          PKG=research/gmi-833-z-z3-invariance-v1
          FREEZE=$(git log --format=%ct --diff-filter=A -- "$PKG/FREEZE_V1.md" | tail -1)
          IMPL=$(git log --format=%ct --diff-filter=A -- "$PKG/z3_invariance_v1.py" | tail -1)
          ORACLE=$(git log --format=%ct --diff-filter=A -- "$PKG/independent_invariance_oracle_v1.py" | tail -1)
          if [ -z "$FREEZE" ]; then echo "negative control: freeze not found in history"; exit 1; fi
          if [ -z "$IMPL" ]; then echo "negative control: executor not found in history"; exit 1; fi
          if [ -z "$ORACLE" ]; then echo "negative control: oracle not found in history"; exit 1; fi
          echo "freeze=$FREEZE impl=$IMPL oracle=$ORACLE"
          if [ "$FREEZE" -ge "$IMPL" ]; then echo "FREEZE DOES NOT PRECEDE THE EXECUTOR"; exit 1; fi
          if [ "$FREEZE" -ge "$ORACLE" ]; then echo "FREEZE DOES NOT PRECEDE THE ORACLE"; exit 1; fi

      - name: Amendment precedes the receipt
        run: |
          set -eu
          PKG=research/gmi-833-z-z3-invariance-v1
          AMEND=$(git log --format=%ct --diff-filter=A -- "$PKG/FREEZE_V1_AMENDMENT_1.md" | tail -1)
          RESULT=$(git log --format=%ct --diff-filter=A -- "$PKG/RESULT_V1.json" | tail -1)
          if [ -z "$AMEND" ]; then echo "negative control: amendment not found in history"; exit 1; fi
          if [ -z "$RESULT" ]; then echo "negative control: receipt not found in history"; exit 1; fi
          echo "amend=$AMEND result=$RESULT"
          if [ "$AMEND" -gt "$RESULT" ]; then echo "AMENDMENT POSTDATES THE RECEIPT"; exit 1; fi

      - name: Workflow integrity
        run: python3 -I -B research/gmi-833-workflow-integrity-v1/check_workflows_v1.py

      - name: Route B oracle
        run: python3 -I -B research/gmi-833-z-z3-invariance-v1/independent_invariance_oracle_v1.py

      - name: Route A executor
        run: python3 -I -B research/gmi-833-z-z3-invariance-v1/z3_invariance_v1.py

      - name: Receipts are byte-stable
        run: |
          set -eu
          git diff --exit-code -- research/gmi-833-z-z3-invariance-v1/RESULT_V1.json
          git diff --exit-code -- research/gmi-833-z-z3-invariance-v1/ORACLE_RESULT_V1.json
          git diff --exit-code -- research/gmi-833-z-z3-invariance-v1/TRANSFORMATION_REGISTRY_V1.json

      - name: Tests (normal mode)
        run: python3 -I -B research/gmi-833-z-z3-invariance-v1/test_z3_invariance_v1.py -v

      - name: Tests (optimized mode)
        run: python3 -I -O -B research/gmi-833-z-z3-invariance-v1/test_z3_invariance_v1.py -v

      - name: Verdict gate
        run: |
          set -eu
          python3 -I -B - research/gmi-833-z-z3-invariance-v1/RESULT_V1.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as fh:
              r = json.load(fh)
          bad = [k for k, v in r["gates"].items() if not v]
          if bad:
              sys.exit("gates failed: %s" % bad)
          if r["verdict"] != "GREEN":
              sys.exit("verdict %s" % r["verdict"])
          if r["null"]["revived_detector_survived"] != 0:
              sys.exit("pseudo-renames survive the revived detector")
          if r["null"]["clean_case_alarms"] != 0:
              sys.exit("the clean rename case alarmed")
          if r["IV_4"]["mixed_convention_flips"] <= 0:
              sys.exit("row 4 branch 2 has no counterexample")
          if r["IV_4"]["behaviourally_stateless_declared_stateful"] <= 4096:
              sys.exit("behavioural census did not exceed the syntactic family")
          print("Z3 GREEN, gates:", len(r["gates"]))
          PY
