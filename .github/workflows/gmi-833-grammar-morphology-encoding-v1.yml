name: gmi-833-grammar-morphology-encoding-v1

on:
  push:
    paths:
      - 'research/gmi-833-grammar-morphology-encoding-v1/**'
      - '.github/workflows/gmi-833-grammar-morphology-encoding-v1.yml'
  pull_request:
    paths:
      - 'research/gmi-833-grammar-morphology-encoding-v1/**'
      - '.github/workflows/gmi-833-grammar-morphology-encoding-v1.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze precedes implementation (git order)
        run: |
          cd "$GITHUB_WORKSPACE"
          FREEZE=$(git log --diff-filter=A --format=%H -- \
            research/gmi-833-grammar-morphology-encoding-v1/FREEZE_V1.md | tail -1)
          IMPL=$(git log --diff-filter=A --format=%H -- \
            research/gmi-833-grammar-morphology-encoding-v1/grammar_morphology_encoding_v1.py | tail -1)
          echo "freeze=$FREEZE impl=$IMPL"
          test -n "$FREEZE"
          test -n "$IMPL"
          git merge-base --is-ancestor "$FREEZE" "$IMPL"
          echo "FREEZE_PRECEDES_IMPLEMENTATION_OK"

      - name: Executor (regenerates every receipt)
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          python3 -I -B grammar_morphology_encoding_v1.py > /dev/null

      - name: Independent oracle (route 2)
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          python3 -I -B independent_oracle_v1.py > /dev/null

      - name: Test battery
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          python3 -I -B    test_grammar_morphology_encoding_v1.py
          python3 -I -O -B test_grammar_morphology_encoding_v1.py

      - name: Receipts are reproducible (byte-exact on the pure artifacts)
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          git diff --exit-code -- GRAMMAR_DUMP_V1.json ORACLE_RESULT_V1.json

      - name: Receipts are reproducible (field-exact on the corpus-sweep artifacts)
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          python3 - <<'PY'
          import json, subprocess
          def committed(path):
              return json.loads(subprocess.check_output(
                  ['git', 'show', 'HEAD:research/gmi-833-grammar-morphology-encoding-v1/'
                   + path]).decode())
          now, was = json.load(open('RESULT_V1.json')), committed('RESULT_V1.json')
          # D-COST is pure arithmetic over imported corpus modules: byte-exact everywhere.
          assert now['d_cost'] == was['d_cost'], (now['d_cost'], was['d_cost'])
          # The corpus fields come from the four pinned parent packages and are
          # merge-invariant. P_LEX_* is a function of whatever else lives under research/
          # at scan time, so it legitimately moves when other lanes land: print, never fail.
          for k in ('corpus_grammar_instances', 'corpus_packages',
                    'corpus_with_declared_target', 'corpus_no_declared_target',
                    'validation_fixtures', 'total_instances_loaded'):
              assert now['population'][k] == was['population'][k], k
          for k in ('P_LEX_packages', 'P_LEX_blocks'):
              if now['population'][k] != was['population'][k]:
                  print('NOTE: %s moved %r -> %r (other packages landed under research/)'
                        % (k, was['population'][k], now['population'][k]))
          assert now['predictions'] == was['predictions']
          assert now['validation']['ALL_PASS'] is True
          # D-LEX re-parses OTHER packages' sources; ast.get_source_segment can differ by
          # Python version, so the invariant asserted here is the verdict, not the bytes.
          assert now['d_lex']['CONFIRMED'] == 0
          if now['d_lex'] != was['d_lex']:
              print('NOTE: D-LEX sweep differs from the committed run on this interpreter')
              print('  committed:', json.dumps(was['d_lex'], sort_keys=True))
              print('  regenerated:', json.dumps(now['d_lex'], sort_keys=True))
          print('RECEIPTS_REPRODUCIBLE_OK')
          PY

      - name: Claim ceiling and forbidden promotions
        run: |
          cd research/gmi-833-grammar-morphology-encoding-v1
          python3 - <<'PY'
          import json
          r = json.load(open('RESULT_V1.json'))
          m = json.load(open('MANIFEST_V1.json'))
          assert r['claim_ceiling'] == m['claim_ceiling']
          assert set(m['forbidden_promotions']) <= set(r['forbidden_promotions'])
          assert r['validation']['ALL_PASS'] is True
          assert r['d_lex']['CONFIRMED'] == 0
          assert r['parent_boundary']['issue'] == 891
          assert 'NOT_OVERTURNED' in r['parent_boundary']['status']
          blob = open('GRAMMAR_MORPHOLOGY_ENCODING_THEOREMS_V1.md').read()
          for bad in m['forbidden_promotions']:
              assert ('%s is proved' % bad) not in blob
          print('CLAIM_DISCIPLINE_OK')
          PY
