name: gmi-1068-continuation-v8
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-continuation-v8.yml'
jobs:
  continuation-and-recursive-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=7941f06d1f5a35df54615ac308439ead0e537d4d
          P=research/gmi-1068-continuation-v8
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V8.md"
          if /usr/bin/git cat-file -e "$F:$P/continuation_v8.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V8.md"
          V=research/gmi-1068-recursive-audit-v7/SCOPE_SNAPSHOT_V7.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v7.json
          cmp /tmp/gmi-v7.json "$V"
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Exact independent replay
        run: |
          P=research/gmi-1068-continuation-v8
          python3 -I -B "$P/check_continuation_v8.py" > /tmp/continuation.json
          python3 -I -O -B "$P/check_continuation_v8.py" > /tmp/continuation-opt.json
          cmp /tmp/continuation.json /tmp/continuation-opt.json
      - name: All-round successor integrity
        run: |
          P=research/gmi-1068-recursive-audit-v8
          python3 -I -B "$P/check_snapshot_v8.py"
          python3 -I -O -B "$P/check_snapshot_v8.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V8.json" --baseline /tmp/gmi-v7.json --changed-files /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Admission-free kernel replay
        run: |
          set -euo pipefail
          P=research/gmi-1068-continuation-v8/ContinuationV8.lean
          if grep -En '\b(sorry|admit|axiom|unsafe)\b' "$P"; then exit 1; fi
          lean -DwarningAsError=true "$P" | tee /tmp/continuation-lean.txt
          if grep -q sorryAx /tmp/continuation-lean.txt; then exit 1; fi
