name: N1 language bootstrap audit
on:
  pull_request:
    paths:
      - 'research/ocm-n1/**'
      - '.github/workflows/n1-bootstrap-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/ocm-n1/**'
      - '.github/workflows/n1-bootstrap-audit.yml'
permissions:
  contents: read
jobs:
  bootstrap-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: ./scripts/m0_install_dev.sh
      - name: Verify frozen language prior inventory
        run: python research/ocm-n1/bootstrap_audit.py --verify
      - name: Bootstrap hostile tests
        run: python research/ocm-n1/test_bootstrap_audit.py
