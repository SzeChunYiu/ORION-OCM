name: G5 warrant adoption economics

on:
  pull_request:
    paths:
      - 'research/g5-warrant-adoption-v1/**'
      - 'research/g5-zdd-warrant-v3/**'
      - 'research/g5-bdd-warrant-v2/**'
      - 'research/g5-factored-warrant-v1/**'
      - '.github/workflows/g5-warrant-adoption.yml'
      - 'src/ocm/kso/warrant.py'
  push:
    branches: [main]
    paths:
      - 'research/g5-warrant-adoption-v1/**'
      - '.github/workflows/g5-warrant-adoption.yml'

permissions:
  contents: read

jobs:
  warrant-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Snapshot frozen RESULT hashes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g5-adoption-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g5-adoption-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          paths = [
              "research/g5-warrant-adoption-v1/RESULT.json",
              "research/g5-factored-warrant-v1/RESULT.json",
              "research/g5-bdd-warrant-v2/RESULT.json",
              "research/g5-zdd-warrant-v3/RESULT.json",
          ]
          frozen = {}
          for rel in paths:
              p = root / rel
              frozen[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          (out / "frozen-sha256.json").write_text(json.dumps(frozen, indent=2) + "\n")
          PY
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g5-adoption-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B -m unittest discover -s research/g5-warrant-adoption-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/g5-warrant-adoption-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Adoption economics (write to temp, not capsule)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g5-adoption-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/g5-warrant-adoption-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          python -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g5-adoption-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          honest = {
              "PRODUCTION_WARRANT_UNCHANGED",
              "DATABASE_PARENT_SUFFICIENT",
              "PARENT_SUFFICIENT",
          }
          if result["terminal"] not in honest:
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result.get("production_adoption") or result.get("production_warrant_switched"):
              sys.exit("production warrant must stay unchanged")
          if result.get("physical_denominator_clean"):
              sys.exit("PHYSICAL_DENOMINATOR_CLEAN is not licensed")
          if result.get("programme_tick"):
              sys.exit("G5.3/008 must not programme-tick")
          if result["g5_3_boxes"].get("G5.3/008") != "ECONOMICS_DO_NOT_SUPPORT_PRODUCTION_SWITCH":
              sys.exit("G5.3/008 disposition drifted")
          if result.get("dollars") or result.get("coordinates_scalarized"):
              sys.exit("coordinates must stay separate")
          if not result.get("parent_sufficient_is_not_failure"):
              sys.exit("PARENT_SUFFICIENT is not failure")
          PY
          cp research/g5-warrant-adoption-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Restore frozen RESULT after runs
        if: always()
        run: |
          set -euo pipefail
          git checkout -- research/g5-warrant-adoption-v1/RESULT.json
          git diff --exit-code -- research/g5-warrant-adoption-v1/RESULT.json
          git diff --exit-code -- research/g5-factored-warrant-v1/RESULT.json
          git diff --exit-code -- research/g5-bdd-warrant-v2/RESULT.json
          git diff --exit-code -- research/g5-zdd-warrant-v3/RESULT.json
          python -B - <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g5-adoption-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          frozen = json.loads((out / "frozen-sha256.json").read_text())
          for rel, digest in frozen.items():
              got = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              if got != digest:
                  sys.exit("frozen RESULT drifted: %s" % rel)
          PY
      - name: Production src unchanged
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-warrant-adoption
          path: '${{ runner.temp }}/g5-adoption-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
