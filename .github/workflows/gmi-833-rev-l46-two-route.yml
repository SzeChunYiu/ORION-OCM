name: gmi-833-rev-l46-two-route

on:
  pull_request:
    paths:
      - 'research/gmi-formal-proof-audit-v1/independent_oracle_v1.py'
      - 'research/gmi-formal-proof-audit-v1/l46_crosscheck_v1.py'
      - 'research/gmi-formal-proof-audit-v1/test_independent_oracle_v1.py'
      - 'research/gmi-developmental-uncertainty-transport-v1/independent_oracle_v1.py'
      - 'research/gmi-developmental-uncertainty-transport-v1/l46_crosscheck_v1.py'
      - 'research/gmi-developmental-uncertainty-transport-v1/test_independent_oracle_v1.py'
      - 'research/gmi-capability-ceilings-v1/independent_oracle_v1.py'
      - 'research/gmi-capability-ceilings-v1/l46_crosscheck_v1.py'
      - 'research/gmi-capability-ceilings-v1/test_independent_oracle_v1.py'
      - 'research/gmi-analog-semantics-closure-v1/independent_oracle_v1.py'
      - 'research/gmi-analog-semantics-closure-v1/l46_crosscheck_v1.py'
      - 'research/gmi-analog-semantics-closure-v1/test_independent_oracle_v1.py'
      - 'research/gmi-uncertainty-composition-v1/independent_oracle_v1.py'
      - 'research/gmi-uncertainty-composition-v1/l46_crosscheck_v1.py'
      - 'research/gmi-uncertainty-composition-v1/test_independent_oracle_v1.py'
      - 'research/gmi-dependency-aware-uncertainty-composition-v1/independent_oracle_v1.py'
      - 'research/gmi-dependency-aware-uncertainty-composition-v1/l46_crosscheck_v1.py'
      - 'research/gmi-dependency-aware-uncertainty-composition-v1/test_independent_oracle_v1.py'
      - 'research/gmi-structural-threshold-repair-v1/independent_oracle_v1.py'
      - 'research/gmi-structural-threshold-repair-v1/l46_crosscheck_v1.py'
      - 'research/gmi-structural-threshold-repair-v1/test_independent_oracle_v1.py'
      - 'research/gmi-learning-law-selection-v1/independent_oracle_v1.py'
      - 'research/gmi-learning-law-selection-v1/l46_crosscheck_v1.py'
      - 'research/gmi-learning-law-selection-v1/test_independent_oracle_v1.py'
      - 'research/gmi-833-rev-l46-two-route-programme-v1/**'
      - '.github/workflows/gmi-833-rev-l46-two-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-route-oracles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route-2 oracle tests (all 8 tranche-1 packages)
        run: |
          set -e
          pkgs="gmi-formal-proof-audit-v1 gmi-developmental-uncertainty-transport-v1 gmi-capability-ceilings-v1 gmi-analog-semantics-closure-v1 gmi-uncertainty-composition-v1 gmi-dependency-aware-uncertainty-composition-v1 gmi-structural-threshold-repair-v1 gmi-learning-law-selection-v1"
          for p in $pkgs; do
            echo "== $p =="
            (cd "research/$p" && ${{ matrix.python_cmd }} -I -B test_independent_oracle_v1.py)
          done
      - name: Programme ranking regenerates byte-identically
        run: |
          set -e
          cp research/gmi-833-rev-l46-two-route-programme-v1/RANKING_V1.json /tmp/rank-a.json
          python -I -B research/gmi-833-rev-l46-two-route-programme-v1/rank_population_v1.py >/dev/null
          cp research/gmi-833-rev-l46-two-route-programme-v1/RANKING_V1.json /tmp/rank-b.json
          /usr/bin/git checkout -- research/gmi-833-rev-l46-two-route-programme-v1/RANKING_V1.json
          cmp /tmp/rank-a.json /tmp/rank-b.json
          echo "ranking determinism + committed-equality: OK"
