name: G6 intervention parent comparison

on:
  pull_request:
    paths:
      - 'research/g6-intervention-parents-v2/**'
      - 'research/g6-intervention-lab-v1/**'
      - '.github/workflows/g6-intervention-parents.yml'
  push:
    branches: [main]
    paths:
      - 'research/g6-intervention-parents-v2/**'
      - '.github/workflows/g6-intervention-parents.yml'

permissions:
  contents: read

jobs:
  intervention-parents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g6-intervention-parents-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g6-parents-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/g6-intervention-parents-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
      - name: Parent comparison
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g6-parents-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/g6-intervention-parents-v2/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
      - name: Frozen v1 plant not overwritten
        run: git diff --exit-code -- research/g6-intervention-lab-v1
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-intervention-parents
          path: '${{ runner.temp }}/g6-parents-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
