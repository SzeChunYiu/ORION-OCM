name: gmi-1068-r6-blank-computer-genesis-v1
on:
  pull_request:
    paths:
      - 'research/gmi-1068-r6-blank-computer-genesis-v1/**'
      - '.github/workflows/gmi-1068-r6-blank-computer-genesis-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          F=0b1d1d00179d5a593f394df229cf44c285dbfdf3
          P=research/gmi-1068-r6-blank-computer-genesis-v1
          git cat-file -e "${F}:${P}/FREEZE_V1.md"
          if git cat-file -e "${F}:${P}/RESULT_V1.json" 2>/dev/null; then exit 1; fi
          git merge-base --is-ancestor "$F" HEAD
      - name: Exact dual-route genesis checks
        run: |
          python3 -I -B research/gmi-1068-r6-blank-computer-genesis-v1/check_r6.py >/tmp/a.json
          python3 -I -O -B research/gmi-1068-r6-blank-computer-genesis-v1/check_r6.py >/tmp/ao.json
          python3 -I -B research/gmi-1068-r6-blank-computer-genesis-v1/independent_oracle_v1.py >/tmp/b.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a.json'));b=json.load(open('/tmp/b.json'))
          for k in ('delayed_sequences','stateless_solutions','one_bit_solutions','perfect_adaptive_maps','first_abstraction_n','fair_registry','search_threshold'): assert a[k]==b[k],k
          PY
      - name: Install Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean kernel check
        run: lean research/gmi-1068-r6-blank-computer-genesis-v1/Genesis.lean
