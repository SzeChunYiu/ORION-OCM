name: Installed runtime distribution
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/m0_install_dev.sh
      - name: Build and install a wheel outside the source tree
        run: python -m pytest -q tests/test_distribution.py
