name: Migration and evaluation continuation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 sympy==1.14.0
      - name: Replay exact historical migration and repaired adapter
        run: python research/migration-completion-v1/replay.py --out "$RUNNER_TEMP/migration-replay.json"
      - name: Reject missing or changed migration evidence
        run: python research/migration-completion-v1/test_custody.py
      - name: Check matched observations and retained knowledge semantics
        run: python research/evaluation-continuation-v1/test_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: migration-continuation-replay
          path: ${{ runner.temp }}/migration-replay.json
      - run: git diff --exit-code
