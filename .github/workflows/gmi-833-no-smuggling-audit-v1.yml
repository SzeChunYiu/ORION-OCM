name: GMI 833 no-smuggling audit v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-no-smuggling-audit-v1/**'
      - '.github/workflows/gmi-833-no-smuggling-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-no-smuggling-audit-v1/**'
      - '.github/workflows/gmi-833-no-smuggling-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=f23ec41e0ba584c8f24ce29e971b3b33c30fc064
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-no-smuggling-audit-v1/FREEZE_V1.md"
          for p in \
            research/gmi-833-no-smuggling-audit-v1/audit_core_v1.py \
            research/gmi-833-no-smuggling-audit-v1/fixtures_v1.py \
            research/gmi-833-no-smuggling-audit-v1/no_smuggling_audit_v1.py \
            research/gmi-833-no-smuggling-audit-v1/test_no_smuggling_audit_v1.py \
            research/gmi-833-no-smuggling-audit-v1/RESULT_V1.json \
            research/gmi-833-no-smuggling-audit-v1/NO_SMUGGLING_AUDIT_CONTRACT_V1.md \
            research/gmi-833-no-smuggling-audit-v1/ISSUE_833_RECONCILIATION_NO_SMUGGLING_V1.json; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact existed at freeze: $p" >&2
              exit 1
            fi
          done
      - name: Exact and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-no-smuggling-audit-v1/test_no_smuggling_audit_v1.py -v
            python -I -O -B research/gmi-833-no-smuggling-audit-v1/no_smuggling_audit_v1.py > /tmp/result.json
          else
            python -I -B research/gmi-833-no-smuggling-audit-v1/test_no_smuggling_audit_v1.py -v
            python -I -B research/gmi-833-no-smuggling-audit-v1/no_smuggling_audit_v1.py > /tmp/result.json
          fi
          cmp /tmp/result.json research/gmi-833-no-smuggling-audit-v1/RESULT_V1.json
      - name: Check manifest and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-no-smuggling-audit-v1')
          manifest = json.loads((root/'MANIFEST_V1.json').read_text())
          receipt = json.loads((root/'RESULT_V1.json').read_text())
          expected = 'GMI_NO_SMUGGLING_AUDIT_TOOLING_VALIDATED_AT_REGISTERED_FINITE_FIXTURE_SCOPE'
          assert manifest['freeze_commit'] == 'f23ec41e0ba584c8f24ce29e971b3b33c30fc064'
          assert manifest['claim_ceiling'] == expected == receipt['claim_ceiling']
          assert receipt['verdict'] == 'GREEN'
          assert all(receipt['checks'].values())
          PY
      - name: Check #833 exact reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode check \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-no-smuggling-audit-v1/ISSUE_833_RECONCILIATION_NO_SMUGGLING_V1.json

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only earned #833 Section D audit-tooling rows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode apply \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-no-smuggling-audit-v1/ISSUE_833_RECONCILIATION_NO_SMUGGLING_V1.json
