name: P1 tiny causal reuse

on:
  pull_request:
    paths:
      - 'research/p1-causal-reuse-v1/**'
      - 'research/g2-macro-operator-v1/**'
      - '.github/workflows/p1-causal-reuse.yml'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/kso/**'
      - 'src/ocm/store/**'
  push:
    branches: [main]
    paths:
      - 'research/p1-causal-reuse-v1/**'
      - '.github/workflows/p1-causal-reuse.yml'

permissions:
  contents: read

jobs:
  p1-causal-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/p1-causal-reuse-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p1-causal-reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/p1-causal-reuse-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/p1-causal-reuse-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: P1 causal-reuse study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p1-causal-reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/p1-causal-reuse-v1/experiment.py --out "$out/RESULT.json" | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "p1-causal-reuse-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          allowed = {
              "P1_CAUSAL_REUSE_SUPPORTED_AT_POLYNOMIAL_MICROSCOPE",
              "MACRO_TOURNAMENT_SELECTS_NO_METHOD",
              "NO_OS_PROCESS_RESTART",
              "NO_ACTUAL_MACRO_USE",
              "NO_MEASURABLE_BENEFIT",
              "CANNOT_CHECK_METHOD_REMOVAL_ABLATION",
              "CANNOT_CHECK_ORDINARY_PARENT_PARITY",
              "P1_CAUSAL_REUSE_INCOMPLETE",
          }
          if result["terminal"] not in allowed:
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result["terminal"] == "CAUSAL_METHOD_REUSE_SUPPORTED":
              sys.exit("unscoped CAUSAL_METHOD_REUSE_SUPPORTED is not licensed")
          if result.get("g24_complete"):
              sys.exit("this capsule must not claim G2.4 complete")
          if result["terminal"] == "P1_CAUSAL_REUSE_SUPPORTED_AT_POLYNOMIAL_MICROSCOPE":
              child = result["os_process"]
              if child["pid"] == result["process"]["pid"]:
                  sys.exit("child pid equals parent pid; not an OS process restart")
              if result["in_process_reconstruction"]["pid"] != result["process"]["pid"]:
                  sys.exit("in-process reconstruction control must share the parent pid")
              earned = result.get("p1_boxes_earned") or []
              required = [
                  "P1/005-admit_scoped_learned_method",
                  "P1/006-restart",
                  "P1/007-fresh_task",
                  "P1/008-actual_use_witness",
                  "P1/009-measurable_benefit",
                  "P1/010-method_removal_ablation",
                  "P1/011-strongest_persistent_parent",
              ]
              missing = [box for box in required if box not in earned]
              if missing:
                  sys.exit("positive terminal missing boxes: %s" % missing)
          PY
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-causal-reuse
          path: '${{ runner.temp }}/p1-causal-reuse-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
