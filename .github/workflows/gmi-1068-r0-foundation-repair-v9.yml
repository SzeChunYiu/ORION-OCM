name: gmi-1068-r0-foundation-repair-v9
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-r0-foundation-repair-v9.yml'
jobs:
  governance-and-semantic-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=86a8ecb556cbd970d39e013a639fd7e1e92ddc99
          P=research/gmi-1068-r0-foundation-repair-v9
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V9.md"
          if /usr/bin/git cat-file -e "$F:$P/semantic_v9.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V9.md"
          V=research/gmi-1068-recursive-audit-v8/SCOPE_SNAPSHOT_V8.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v8.json
          cmp /tmp/gmi-v8.json "$V"
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Exact independent replay
        run: |
          P=research/gmi-1068-r0-foundation-repair-v9
          python3 -I -B "$P/check_foundation_v9.py" > /tmp/foundation-v9.json
          python3 -I -O -B "$P/check_foundation_v9.py" > /tmp/foundation-v9-opt.json
          cmp /tmp/foundation-v9.json /tmp/foundation-v9-opt.json
      - name: All-round successor integrity
        run: |
          P=research/gmi-1068-recursive-audit-v9
          python3 -I -B "$P/check_snapshot_v9.py"
          python3 -I -O -B "$P/check_snapshot_v9.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V9.json" --baseline /tmp/gmi-v8.json --changed-files /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Admission-free kernel replay
        run: |
          set -euo pipefail
          P=research/gmi-1068-r0-foundation-repair-v9/RecoverabilityV9.lean
          if grep -En '\b(sorry|admit|axiom|unsafe)\b' "$P"; then exit 1; fi
          lean -DwarningAsError=true "$P" | tee /tmp/foundation-v9-lean.txt
          if grep -q sorryAx /tmp/foundation-v9-lean.txt; then exit 1; fi
