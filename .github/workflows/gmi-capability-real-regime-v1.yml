name: GMI capability real-regime (F4)

on:
  pull_request:
    paths:
      - 'research/gmi-capability-real-regime-v1/**'
      - 'research/gmi-capability-predictor-dev-v1/**'
      - '.github/workflows/gmi-capability-real-regime-v1.yml'
  push:
    paths:
      - 'research/gmi-capability-real-regime-v1/**'
      - 'research/gmi-capability-predictor-dev-v1/**'
      - '.github/workflows/gmi-capability-real-regime-v1.yml'
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real-regime controls (normal)
        run: python -I -B research/gmi-capability-real-regime-v1/test_real_regime_v1.py -v
      - name: Run real-regime controls (optimized)
        run: python -I -O -B research/gmi-capability-real-regime-v1/test_real_regime_v1.py -v
