name: Publication constitution v2

on:
  pull_request:
    paths:
      - 'research/publication-constitution-v2/**'
      - 'research/publication-constitution-v1/PROTOCOL.json'
      - '.github/workflows/publication-constitution-v2.yml'
  push:
    branches: [main]
    paths:
      - 'research/publication-constitution-v2/**'
      - 'research/publication-constitution-v1/PROTOCOL.json'
      - '.github/workflows/publication-constitution-v2.yml'

permissions:
  contents: read

jobs:
  publication-constitution-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/research/publication-constitution-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol freeze tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pubcon-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/publication-constitution-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/publication-constitution-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Source custody
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-constitution-v2
          path: '${{ runner.temp }}/pubcon-v2-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
