name: MATH-1 N4 miniature subgoal v2

on:
  pull_request:
    paths:
      - 'research/math-n4-subgoal-v2/**'
      - 'research/math-n4-lemma-reuse-v1/RESULT.json'
      - '.github/workflows/math-n4-subgoal.yml'
  push:
    branches: [main]
    paths:
      - 'research/math-n4-subgoal-v2/**'
      - '.github/workflows/math-n4-subgoal.yml'

permissions:
  contents: read

jobs:
  miniature-subgoal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/math-n4-subgoal-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Freeze controls
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/math-n4-subgoal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/math-n4-subgoal-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/math-n4-subgoal-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Miniature Hilbert subgoal-introduction study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/math-n4-subgoal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/math-n4-subgoal-v2/experiment.py --out "$out/result.json" \
            --core "$out/CORE.md" \
            2>&1 | tee "$out/console.txt"
          python -B - <<'PY'
          import json, pathlib, os, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "math-n4-subgoal-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "result.json").read_text())
          terminal = result["terminal"]
          allowed = {
              "CAUSAL_SUBGOAL_LEMMA_INTRODUCTION_SUPPORTED_AT_MINIATURE_SCOPE",
              "NO_CAUSAL_REUSE",
              "PARENT_SUFFICIENT",
          }
          if terminal == "CAUSAL_PROOF_METHOD_REUSE_SUPPORTED":
              sys.exit("unscoped CAUSAL_PROOF_METHOD_REUSE_SUPPORTED is not licensed")
          if not (terminal in allowed or str(terminal).startswith("CANNOT_CHECK_")):
              sys.exit("unexpected terminal %s" % terminal)
          if not result["v1_result_custody"]["unchanged"]:
              sys.exit("frozen v1 RESULT.json was overwritten")
          PY
      - name: Frozen v1 RESULT.json
        run: git diff --exit-code -- research/math-n4-lemma-reuse-v1/RESULT.json
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-n4-subgoal
          path: '${{ runner.temp }}/math-n4-subgoal-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
