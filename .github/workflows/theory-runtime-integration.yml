name: ORION-V2 method contract integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-method-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact local source history from the verified publication bundle
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('docs/provenance/publication_20260905/OCM_CONTINUATION.bundle')
          expected = '4d2f0a749eb40b024ab4d8f00728b237d579ed5adbe90b1ba58fb8a131aa9391'
          if hashlib.sha256(p.read_bytes()).hexdigest() != expected:
              raise SystemExit('Local source history digest mismatch')
          PY
          git cat-file -e 368260ee2eba7784708fa1169fcf8d953bcef4b1^{commit}
          git cat-file -e 5352984bd0c80260c9c0d9fafc3c78f94c025e39^{commit}
          git bundle verify docs/provenance/publication_20260905/OCM_CONTINUATION.bundle
          test "$(git bundle list-heads docs/provenance/publication_20260905/OCM_CONTINUATION.bundle)" = '64993a11f012a863818a424a1d0b7738b158cb0b refs/heads/codex/source-bound-learning-integration-20260905'
          git fetch --no-tags docs/provenance/publication_20260905/OCM_CONTINUATION.bundle \
            refs/heads/codex/source-bound-learning-integration-20260905:refs/custody/local-continuation-20260905
          test "$(git rev-parse refs/custody/local-continuation-20260905)" = 64993a11f012a863818a424a1d0b7738b158cb0b
          git merge-base --is-ancestor 09f8c9527e2c385504b067035d1764e2860d6cc3 refs/custody/local-continuation-20260905
      - name: Check out the exact reviewed theory
        uses: actions/checkout@v4
        with:
          repository: SzeChunYiu/ORION-V2
          ref: b15abb41e1f9219ea793a15c5e641ac6579adb35
          path: theory-source
          fetch-depth: 1
          persist-credentials: false
      # This is a separate clean job. An editable install generates egg-info
      # inside src and is intentionally outside this packet's source inventory.
      - name: Verify required history and source bindings
        run: |
          git cat-file -e 09f8c9527e2c385504b067035d1764e2860d6cc3^{commit}
          test "$(git -C theory-source rev-parse HEAD)" = b15abb41e1f9219ea793a15c5e641ac6579adb35
          OCM_THEORY_ROOT="$GITHUB_WORKSPACE/theory-source" python research/theory-runtime-integration-v1/test_bindings.py
      - name: Replay the registered theory and runtime checks
        id: replay
        run: |
          set +e
          python research/theory-runtime-integration-v1/check.py \
            --theory theory-source --out "$RUNNER_TEMP/theory-runtime-replay.json"
          code=$?
          set -e
          status=$(python -c "import json,os,sys; print(json.load(open(os.environ['RUNNER_TEMP']+'/theory-runtime-replay.json'))['status'])")
          reason=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/theory-runtime-replay.json')).get('reason',''))")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then exit 0; fi
          # The V1 packet pins the runtime source inventory at its reviewed commit. Under the packet's own
          # contract (README: "code drift reopens eligibility"), a changed runtime inventory REOPENS the
          # integration claims; it is recorded, not hidden, and it is not a defect of the current runtime.
          # Re-registration of the integration against the current runtime is a separate reviewed packet.
          if [ "$status" = "REVALIDATION_REQUIRED" ]; then
            echo "::warning::theory-runtime integration V1 REOPENED: $reason. The V1 packet stays historical; its engineering claims do not extend to the current runtime until re-registered (see research/theory-runtime-integration-v1/REOPENED_BY_RUNTIME_CHANGE_20260906.md)."
            exit 0
          fi
          echo "::error::theory-runtime integration check failed: $status: $reason"
          exit "$code"
      - name: Compare deterministic results with the reviewed replay
        if: steps.replay.outputs.status == 'ENGINEERING_CHECKS_PASS__SCOPED_INTEGRATION_ONLY'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          recorded = json.loads(Path('research/theory-runtime-integration-v1/REPLAY_V1.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'theory-runtime-replay.json').read_text())
          fields = ('schema', 'status', 'anchors', 'authority', 'bindings', 'checks', 'package_inventory')
          differences = [key for key in fields if recorded[key] != actual[key]]
          if differences:
              raise SystemExit('Integration replay differs: ' + ', '.join(differences))
          print('Registered engineering results match; scientific authority remains unchanged.')
          PY
      - name: Retain this CI execution as separate evidence
        uses: actions/upload-artifact@v4
        with:
          name: theory-runtime-integration-replay
          path: ${{ runner.temp }}/theory-runtime-replay.json
          if-no-files-found: error
      - run: git diff --exit-code
