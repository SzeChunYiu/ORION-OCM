name: GMI 833 AE5 causal state audit v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-ae-ae5-causal-state-audit-v1/**'
      - '.github/workflows/gmi-833-ae-ae5-causal-state-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-ae-ae5-causal-state-audit-v1/**'
      - '.github/workflows/gmi-833-ae-ae5-causal-state-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          freeze=c69062ee7c7c9bee9aa1534fe5c88de58b7f50d5
          pkg=research/gmi-833-ae-ae5-causal-state-audit-v1
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:$pkg/FREEZE_V1.md"
          for p in \
            "$pkg/ae5_causal_state_audit_v1.py" \
            "$pkg/independent_process_oracle_v1.py" \
            "$pkg/test_ae5_causal_state_audit_v1.py" \
            "$pkg/RESULT_V1.json" \
            "$pkg/MANIFEST_V1.json" \
            "$pkg/AE5_THEOREMS_V1.md" \
            "$pkg/PARENT_OWNERSHIP_V1.md" \
            "$pkg/CORE.md" \
            "$pkg/ISSUE_833_RECONCILIATION_AE5_CAUSAL_STATE_AUDIT_V1.json"; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact already existed at the freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify pinned parent receipts
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            actual="$(git rev-parse "HEAD:$1")"
            test "$actual" = "$2"
          }
          verify_parent research/gmi-833-theory-baseline-v1/BASELINE_V1.md 201ee8e8b290f5bfa3e283e6f8be2429ce8eeb78
          verify_parent research/gmi-833-foundation-v1/RESULT_V1.json c0c574c4ec6e237d5fdafa694eac131399625a70
          verify_parent research/gmi-833-ae-ae1-structure-separation-v1/RESULT_V1.json ceb77f5beac99b5427d1350915b19df546495fb8
          verify_parent research/gmi-833-ae-ae2-predictive-boundary-v1/RESULT_V1.json cd1e1d5f68342918c0b54583fc5f5b70eabe203c
          verify_parent research/gmi-833-ae-ae10-usable-information-v1/RESULT_V1.json 69aafebec4016f539c46b1f71546f740a8018421
      - name: Exact AE5 tests, two routes, hostiles and nulls
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-ae-ae5-causal-state-audit-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B "$pkg/test_ae5_causal_state_audit_v1.py" -v
            python -I -O -B "$pkg/ae5_causal_state_audit_v1.py" > /tmp/ae5.json
          else
            python -I -B "$pkg/test_ae5_causal_state_audit_v1.py" -v
            python -I -B "$pkg/ae5_causal_state_audit_v1.py" > /tmp/ae5.json
          fi
          cmp /tmp/ae5.json "$pkg/RESULT_V1.json"
      - name: Check manifest, claim ceiling and named numbers
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae5-causal-state-audit-v1')
          m = json.loads((root / 'MANIFEST_V1.json').read_text())
          r = json.loads((root / 'RESULT_V1.json').read_text())
          expected = ('GMI_833_AE5_PREDICTIVE_STATE_PARENT_OWNERSHIP_AUDITED_ON_'
                      'A_REGISTERED_FINITE_DYADIC_PROCESS_FAMILY')
          assert m['claim_ceiling'] == r['claim_ceiling'] == expected
          assert m['source_main'] == r['source_main'] == (
              '349c2e62c4ae01f52cf66f61e4dacdbdfcf10071')
          assert m['freeze_commit'] == r['freeze_commit'] == (
              'c69062ee7c7c9bee9aa1534fe5c88de58b7f50d5')
          assert r['verdict'] == 'GREEN' and all(r['checks'].values())
          assert r['rows_closed'] == m['rows_closed'] == 5
          assert 'morphology-sweep' in r['row_closed_elsewhere']
          res = r['results']
          a1 = res['AE5_1_horizon_scope']
          assert a1['refinement_is_monotone_on_every_member'] is True
          assert a1['stabilisation_horizon_histogram'] == {'1': 1863, '2': 156}
          ce = a1['horizon_1_counterexample']
          assert ce['classes_by_horizon'][0] < ce['classes_by_horizon'][-1]
          a2 = res['AE5_2_statistical_complexity_and_excess_entropy']
          assert a2['tree_processes_enumerated'] == 2187
          assert a2['family_size'] == 2019
          assert a2['excluded_for_non_dyadic_state_masses'] == 168
          assert a2['members_with_exactly_computable_excess_entropy'] == 1527
          assert a2['E_le_C_mu_holds_on'] == 1527
          assert a2['E_le_C_mu_holds_on_all'] is True
          assert a2['every_member_is_dyadic'] is True
          assert a2['no_logarithm_evaluated'] is True
          w = a2['strict_crypticity_witness']
          assert w['C_mu'] == '3/2' and w['E'] == '1/2'
          assert w['crypticity'] == '1'
          nu = a2['non_uniform_state_mass_witness']
          assert nu['state_masses'] == ['1/4', '1/4', '1/2']
          assert a2['distinct_S_values'] == [3, 4, 5, 6]
          assert a2['distinct_C_mu_values'] == ['0', '1', '3/2']
          a3 = res['AE5_3_parent_ownership_audit']
          assert a3['verdict_counts']['PARENT_SUFFICIENT'] == 4
          assert a3['verdict_counts']['RESIDUAL'] == 1
          assert a3['novelty_claimed_for_gmi_state_complexity'] is False
          assert a3['parent_sufficient_is_a_success_terminal'] is True
          a4 = res['AE5_4_four_quantity_disagreement']
          assert a4['ordered_pairs'] == 12
          assert a4['ordered_pairs_disagreeing'] == 11
          assert a4['determined_directions'] == ['C_mu_vs_rank']
          assert a4['every_unordered_pair_is_non_equivalent'] is True
          assert a4['rank_le_state_count_verified_on_every_member'] is True
          assert a4['ordered_pairs_with_a_strict_order_reversal'] == 6
          a6 = res['AE5_6_finite_horizon_gap_preservation']
          assert a6['gap_alarms_on_this_receipt'] == 0
          assert a6['gap_alarm_paths'] == []
          assert a6['horizon_truncation_loses_information'] is True
          assert len(a6[
              'infinite_horizon_assumptions_that_would_be_required_open']) == 5
          assert 'INFINITE_HORIZON_EQUIVALENCE_PROVED' in r[
              'forbidden_promotions']
          assert len(r['hostiles']) == 5
          for h in r['hostiles']:
              assert h['perturbation_moved_its_quantity'], h['id']
              assert h['detected'], h['id']
          n = r['null']
          assert n['shuffle_trials'] == 200
          assert n['shuffle_trials_matching'] == 0
          assert n['true_family_alarms'] == 0
          assert len(m['parent_pins']) == 5
          print('AE5 manifest and named numbers OK')
          PY
      - name: Check reconciliation rows are byte-exact and unique
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/gmi-833-ae-ae5-causal-state-audit-v1')
          spec = json.loads((
              root / 'ISSUE_833_RECONCILIATION_AE5_CAUSAL_STATE_AUDIT_V1.json'
          ).read_text())
          assert spec['schema'] == 'GMI_ISSUE_RECONCILIATION_V2'
          assert spec['issue'] == 833
          assert spec['issue_comment_id'] == 5692689542
          assert len(spec['replacements']) == 5
          assert len(spec['not_closed']) == 1
          seen = set()
          for rep in spec['replacements']:
              assert rep['old'].startswith('- [ ] ')
              assert rep['new'].startswith('- [x] ')
              assert rep['new'][6:].startswith(rep['old'][6:])
              assert rep['old'] not in seen
              seen.add(rep['old'])
              assert rep['anchor'].startswith('### AE5 ')
          assert spec['not_closed'][0]['old'] not in seen
          assert 'morphology-sweep' in spec['not_closed'][0]['reason']
          sweep = json.loads(Path(
              'research/gmi-833-ae-morphology-sweep-v1/'
              'ISSUE_833_RECONCILIATION_AE_MORPHOLOGY_SWEEP_V1.json'
          ).read_text())
          sweep_rows = set(x['old'] for x in sweep['replacements'])
          assert spec['not_closed'][0]['old'] in sweep_rows
          assert not (seen & sweep_rows)
          print('AE5 reconciliation spec OK and disjoint from the sweep')
          PY
