name: GMI 833 theory baseline v1

on:
  pull_request:
    paths:
      - "research/gmi-833-theory-baseline-v1/**"
      - ".github/workflows/gmi-833-theory-baseline-v1.yml"
  push:
    branches:
      - "research/833-theory-baseline-v1"
    paths:
      - "research/gmi-833-theory-baseline-v1/**"
      - ".github/workflows/gmi-833-theory-baseline-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tamper-evidence validator (normal and optimized modes)
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-theory-baseline-v1
          python -I -B "$pkg/test_theory_baseline_v1.py"
          python -I -O -B "$pkg/test_theory_baseline_v1.py"
      - name: Manifest integrity anchor and builder determinism
        shell: bash
        run: |
          set -euo pipefail
          pkg=research/gmi-833-theory-baseline-v1
          # committed manifest must match the pinned sha256 literal below;
          # any change to the manifest must change this workflow in the same
          # commit (loud by design - see BASELINE_V1.md §5)
          echo "31de4041c0b6cb94152debbc4901041fb46626b9866122010a11df5319a62e97  $pkg/BASELINE_MANIFEST_V1.json" | shasum -a 256 -c -
          # determinism: two same-checkout rebuilds must be byte-identical
          # (arrivals_since_pin legitimately evolves with origin/main, so the
          # rebuild is compared against a second rebuild, not the commit).
          # Once post-freeze supplements exist the V1 builder no longer
          # applies (pin-state assertions); then skip - a BASELINE_MANIFEST_V2
          # carries its own builder.
          if python -I -B "$pkg/build_manifest_v1.py" >/dev/null 2>&1; then
            cp "$pkg/BASELINE_MANIFEST_V1.json" /tmp/rebuild-a.json
            /usr/bin/git checkout -- "$pkg/BASELINE_MANIFEST_V1.json"
            python -I -O -B "$pkg/build_manifest_v1.py" >/dev/null
            cp "$pkg/BASELINE_MANIFEST_V1.json" /tmp/rebuild-b.json
            /usr/bin/git checkout -- "$pkg/BASELINE_MANIFEST_V1.json"
            cmp /tmp/rebuild-a.json /tmp/rebuild-b.json
            echo "rebuild determinism: OK"
          else
            echo "V1 pin-state builder not applicable to this tree (post-freeze state); determinism check delegated to the current manifest's builder"
          fi
