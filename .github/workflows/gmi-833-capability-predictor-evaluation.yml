name: gmi-833-capability-predictor-evaluation

on:
  push:
    paths:
      - 'research/gmi-833-capability-predictor-evaluation-v1/**'
      - 'research/gmi-833-capability-predictor-v1/**'
      - '.github/workflows/gmi-833-capability-predictor-evaluation.yml'
  pull_request:
    paths:
      - 'research/gmi-833-capability-predictor-evaluation-v1/**'
      - 'research/gmi-833-capability-predictor-v1/**'
      - '.github/workflows/gmi-833-capability-predictor-evaluation.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      PKG: research/gmi-833-capability-predictor-evaluation-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze order (the #976 POST_HOC_SUSPECT gate)
        run: |
          set -eu
          FREEZE=$(awk '{print $1; exit}' "$PKG/FREEZE_COMMIT.txt")
          echo "freeze commit: $FREEZE"
          git ls-tree -r --name-only "$FREEZE" -- "$PKG/" > /tmp/at_freeze.txt
          test -s /tmp/at_freeze.txt
          echo "--- negative control: these MUST be present at the freeze ---"
          for good in FREEZE_V1.md SCOPE_V1.md BLINDNESS_V1.md heldout_universes_v1.py freeze_predictions_v1.py FROZEN_PREDICTIONS_V1.json; do
            grep -qx "$PKG/$good" /tmp/at_freeze.txt || { echo "NEGATIVE CONTROL FAILED: $good absent at the freeze"; exit 1; }
            echo "  present: $good"
          done
          echo "--- these must NOT be reachable from the freeze ---"
          for bad in external_evaluator_v1.py oracle_route_b_v1.py score_heldout_v1.py real_systems_run_v1.py real_systems_run_v2.py real_systems_run_v3.py test_capability_predictor_evaluation_v1.py RESULT_V1.json ROUTE_B_RESULT_V1.json REAL_RUNS; do
            if grep -q "$PKG/$bad" /tmp/at_freeze.txt; then
              echo "IMPLEMENTATION OR OUTCOME ARTIFACT AT THE FREEZE: $bad"
              exit 1
            fi
            echo "  absent: $bad"
          done
          git rev-list "$FREEZE..HEAD" > /tmp/after.txt
          for f in score_heldout_v1.py external_evaluator_v1.py oracle_route_b_v1.py FROZEN_PREDICTIONS_V4.json; do
            INTRO=$(git log --diff-filter=A --format=%H -- "$PKG/$f" | tail -1)
            test -n "$INTRO" || { echo "no introducing commit for $f"; exit 1; }
            grep -qx "$INTRO" /tmp/after.txt || { echo "$f was introduced at or before the freeze"; exit 1; }
          done
          echo "--- each revival's outcomes must postdate its own freeze ---"
          for pair in "FROZEN_PREDICTIONS_V2.json:REAL_RUNS_V2/REAL_MEASURED_V2.json" "FROZEN_PREDICTIONS_V3.json:REAL_RUNS_V3/REAL_MEASURED_V3.json"; do
            FZ=${pair%%:*}
            OUT=${pair##*:}
            FZC=$(git log --diff-filter=A --format=%H -- "$PKG/$FZ" | tail -1)
            OUTC=$(git log --diff-filter=A --format=%H -- "$PKG/$OUT" | tail -1)
            test -n "$FZC" -a -n "$OUTC" || { echo "missing $FZ or $OUT"; exit 1; }
            git rev-list "$FZC..HEAD" | grep -qx "$OUTC" || { echo "$OUT predates its freeze $FZ"; exit 1; }
            echo "  ok: $OUT postdates $FZ"
          done

      - name: Parent blob pin
        run: |
          set -eu
          ACTUAL=$(git rev-parse HEAD:research/gmi-833-capability-predictor-v1/capability_predictor_v1.py)
          PINNED=$(sed -n 's/^PARENT_BLOB_SHA = "\([0-9a-f]\{40\}\)".*/\1/p' "$PKG/heldout_universes_v1.py")
          echo "actual=$ACTUAL pinned=$PINNED"
          test -n "$PINNED"
          test "$ACTUAL" = "$PINNED"

      - name: Route B (materially independent oracle)
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B oracle_route_b_v1.py > /tmp/route_b.json
          cmp /tmp/route_b.json ROUTE_B_RESULT_V1.json

      - name: Canonical executor, both modes
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B score_heldout_v1.py > /tmp/result_a.json
          cmp /tmp/result_a.json RESULT_V1.json
          python3 -I -O -B score_heldout_v1.py > /tmp/result_o.json
          cmp /tmp/result_a.json /tmp/result_o.json

      - name: Reconciliation is rebuilt from the receipts
        run: |
          set -eu
          cd "$PKG"
          cp ISSUE_833_RECONCILIATION_KEVAL_V1.json /tmp/recon_committed.json
          python3 -I -B build_reconciliation_v1.py
          cmp ISSUE_833_RECONCILIATION_KEVAL_V1.json /tmp/recon_committed.json

      - name: Receipt gates
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B  test_capability_predictor_evaluation_v1.py -v
          python3 -I -O -B test_capability_predictor_evaluation_v1.py -v

      - name: Real-system receipt integrity
        run: |
          set -eu
          cd "$PKG"
          python3 check_real_receipts_v1.py
