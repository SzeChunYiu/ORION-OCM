name: gmi-833-capability-predictor-evaluation

on:
  push:
    paths:
      - 'research/gmi-833-capability-predictor-evaluation-v1/**'
      - 'research/gmi-833-capability-predictor-v1/**'
      - '.github/workflows/gmi-833-capability-predictor-evaluation.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  pull_request:
    paths:
      - 'research/gmi-833-capability-predictor-evaluation-v1/**'
      - 'research/gmi-833-capability-predictor-v1/**'
      - '.github/workflows/gmi-833-capability-predictor-evaluation.yml'
      - 'research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      PKG: research/gmi-833-capability-predictor-evaluation-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze order (the #976 POST_HOC_SUSPECT gate, squash-safe)
        run: |
          set -eu
          # Squash-safe custody (parent: PR #1053 freeze; doctrine of #1042). Once the
          # package's PR is squash-merged, freeze and implementation first appear in ONE
          # commit and the ordering can no longer be re-derived from history. The shared
          # checker keeps the strict ordering proof on a linear history; on a squash-
          # published one it withholds ONLY that assertion, still checks everything
          # derivable from HEAD and from the source freeze commit, and prints
          # FREEZE_ORDER_NOT_REDERIVABLE:<commit> checked:<list>. Violations exit 1,
          # could-not-check exits 2; nothing is reported as passed unchecked.
          CHK=research/gmi-833-squash-safe-gates-v1/squash_safe_freeze_check_v1.py
          echo "--- V1 freeze (FREEZE_COMMIT.txt): frozen artifacts present, implementation and outcomes absent at the freeze ---"
          python3 -I -B "$CHK" --repo . --pkg "$PKG" --freeze FREEZE_V1.md --freeze-commit-file FREEZE_COMMIT.txt \
            --present-at-freeze SCOPE_V1.md --present-at-freeze BLINDNESS_V1.md \
            --present-at-freeze heldout_universes_v1.py --present-at-freeze freeze_predictions_v1.py \
            --present-at-freeze FROZEN_PREDICTIONS_V1.json \
            --impl external_evaluator_v1.py --impl oracle_route_b_v1.py --impl score_heldout_v1.py \
            --impl real_systems_run_v1.py --impl real_systems_run_v2.py --impl real_systems_run_v3.py \
            --impl test_capability_predictor_evaluation_v1.py --impl RESULT_V1.json \
            --impl ROUTE_B_RESULT_V1.json --impl 'REAL_RUNS*' --impl FROZEN_PREDICTIONS_V4.json
          echo "--- the V4 power revival: its freeze must precede the receipt that scores it ---"
          # SIGMA_SYN2 / SIGMA_ARCH2 outcomes come from external_evaluator_v1.py, which
          # already existed at the V1 implementation commit.  FREEZE_V4_POWER_ADDENDUM.md
          # section 4 discloses that this stratum's custody is weaker than V1's: the claim
          # is only that the predictions were committed before their outcomes were computed.
          # This gate enforces exactly that and nothing stronger.
          python3 -I -B "$CHK" --repo . --pkg "$PKG" --freeze FROZEN_PREDICTIONS_V4.json \
            --impl RESULT_V1.json --label capability-predictor-evaluation:V4-power-revival
          echo "--- each revival's outcomes must postdate its own freeze ---"
          python3 -I -B "$CHK" --repo . --pkg "$PKG" --freeze FROZEN_PREDICTIONS_V2.json \
            --impl REAL_RUNS_V2/REAL_MEASURED_V2.json --label capability-predictor-evaluation:V2-revival
          python3 -I -B "$CHK" --repo . --pkg "$PKG" --freeze FROZEN_PREDICTIONS_V3.json \
            --impl REAL_RUNS_V3/REAL_MEASURED_V3.json --label capability-predictor-evaluation:V3-revival

      - name: Parent blob pin
        run: |
          set -eu
          ACTUAL=$(git rev-parse HEAD:research/gmi-833-capability-predictor-v1/capability_predictor_v1.py)
          PINNED=$(sed -n 's/^PARENT_BLOB_SHA = "\([0-9a-f]\{40\}\)".*/\1/p' "$PKG/heldout_universes_v1.py")
          echo "actual=$ACTUAL pinned=$PINNED"
          test -n "$PINNED"
          test "$ACTUAL" = "$PINNED"

      - name: Route B (materially independent oracle)
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B oracle_route_b_v1.py > /tmp/route_b.json
          cmp /tmp/route_b.json ROUTE_B_RESULT_V1.json

      - name: Canonical executor, both modes
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B score_heldout_v1.py > /tmp/result_a.json
          cmp /tmp/result_a.json RESULT_V1.json
          python3 -I -O -B score_heldout_v1.py > /tmp/result_o.json
          cmp /tmp/result_a.json /tmp/result_o.json

      - name: Reconciliation is rebuilt from the receipts
        run: |
          set -eu
          cd "$PKG"
          cp ISSUE_833_RECONCILIATION_KEVAL_V1.json /tmp/recon_committed.json
          python3 -I -B build_reconciliation_v1.py
          cmp ISSUE_833_RECONCILIATION_KEVAL_V1.json /tmp/recon_committed.json

      - name: Receipt gates
        run: |
          set -eu
          cd "$PKG"
          python3 -I -B  test_capability_predictor_evaluation_v1.py -v
          python3 -I -O -B test_capability_predictor_evaluation_v1.py -v

      - name: Real-system receipt integrity
        run: |
          set -eu
          cd "$PKG"
          python3 check_real_receipts_v1.py
