name: GMI 833 AA logical-form register (AA16 AA17 AA18 AA20 AA22)

on:
  pull_request:
    paths:
      - 'research/gmi-833-aa-logical-form-register-v1/**'
      - 'research/gmi-833-corpus-census-v1/CORPUS_INDEX_V1.json'
      - '.github/workflows/gmi-833-aa-logical-form-register-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-aa-logical-form-register-v1/**'
      - 'research/gmi-833-corpus-census-v1/CORPUS_INDEX_V1.json'
      - '.github/workflows/gmi-833-aa-logical-form-register-v1.yml'

permissions:
  contents: read

jobs:
  logical-form-register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PKG: research/gmi-833-aa-logical-form-register-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze precedes implementation
        run: |
          set -euo pipefail
          git log --reverse --format=%H -- "$PKG/" > /tmp/all_commits.txt
          head -1 /tmp/all_commits.txt > /tmp/first.txt
          git show --name-only --format= "$(cat /tmp/first.txt)" -- "$PKG/" > /tmp/firstfiles.txt
          cat /tmp/firstfiles.txt
          if [ "$(grep -c . /tmp/firstfiles.txt)" = "1" ]; then
            grep -q 'FREEZE_V1.md' /tmp/firstfiles.txt
            echo 'freeze-first commit ordering intact'
          else
            grep -q 'FREEZE_V1.md' /tmp/firstfiles.txt
            echo 'package published by squash; freeze present in the publishing commit'
          fi
      - name: Frozen census untouched (theory-baseline pin)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/gmi-833-corpus-census-v1/CORPUS_INDEX_V1.json)" = 709159c53c6284366aaf1f05380f5fada8d81a98
          echo 'census blob matches the freeze pin'
      - name: Route A regenerates the register byte-identically (pinned blobs re-read through git)
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/logical_form_register_v1.py" > /tmp/lfr_routeA.json
          python3 -I -B -c "import json,sys; d=json.load(open('/tmp/lfr_routeA.json')); sys.exit(0 if d['blob_state']=='BLOBS_REACHABLE' and d['snapshot_byte_identical_to_committed'] else 1)"
          git diff --exit-code --stat -- "$PKG/STATEMENT_SNAPSHOT_V1.json" "$PKG/LOGICAL_FORM_REGISTER_V1.json" "$PKG/QUEUES_V1.json"
          echo 'snapshot, register and queues regenerated byte-identically'
      - name: Route B independent oracle agrees on every form and queue
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/independent_form_oracle_v1.py" > /tmp/lfr_routeB.json
          python3 -I -B -c "import json,sys; d=json.load(open('/tmp/lfr_routeB.json')); print(d['form_agree'], d['all_forms_agree'], d['all_queues_agree']); sys.exit(0 if d['all_forms_agree'] and d['all_queues_agree'] else 1)"
      - name: Tests (normal)
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/test_logical_form_register_v1.py" 2>&1 | tee /tmp/lfr_tests.txt
      - name: Tests (optimized)
        run: |
          set -euo pipefail
          python3 -I -O -B "$PKG/test_logical_form_register_v1.py" 2>&1 | tee /tmp/lfr_tests-O.txt
      - name: Receipt matches the live two-route run
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/check_receipt_v1.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmi-833-aa-logical-form-register-v1
          path: |
            /tmp/lfr_routeA.json
            /tmp/lfr_routeB.json
            /tmp/lfr_tests.txt
            /tmp/lfr_tests-O.txt
          if-no-files-found: error
