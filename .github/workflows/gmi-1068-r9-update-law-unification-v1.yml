name: gmi-1068-r9-update-law-unification-v1
on:
  pull_request:
    paths:
      - 'research/gmi-1068-r9-update-law-unification-v1/**'
      - '.github/workflows/gmi-1068-r9-update-law-unification-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          F=5b4b0d7ee2969bd92841bcc81005e43a9462c9f2
          P=research/gmi-1068-r9-update-law-unification-v1
          git cat-file -e "${F}:${P}/FREEZE_V1.md"
          if git cat-file -e "${F}:${P}/RESULT_V1.json" 2>/dev/null; then exit 1; fi
          git merge-base --is-ancestor "$F" HEAD
      - name: Dual-route checks
        run: |
          python3 -I -B research/gmi-1068-r9-update-law-unification-v1/check_r9.py >/tmp/a
          python3 -I -O -B research/gmi-1068-r9-update-law-unification-v1/check_r9.py >/tmp/ao
          python3 -I -B research/gmi-1068-r9-update-law-unification-v1/independent_oracle_v1.py >/tmp/b
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a'));b=json.load(open('/tmp/b'))
          for k in ('U1_surface','U2_surface','posterior','partial_hypotheses','full_hypotheses','library_first_n','meta_threshold'):assert a[k]==b[k],k
          PY
