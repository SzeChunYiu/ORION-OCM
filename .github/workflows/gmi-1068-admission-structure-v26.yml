name: gmi-1068-admission-structure-v26
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - 'research/gmi-833*/**'
      - 'research/gmi-prior-free-derivation/**'
      - 'research/gmi-ledger-selection-transport-repair-v1/**'
      - 'research/machine-intelligence-morphogenesis-v1/**'
      - '.github/workflows/gmi-1068-admission-structure-v26.yml'
jobs:
  admission-optional-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=c9fd15cba845e80448672b3fc65bdb7430fe8043
          P=research/gmi-1068-admission-structure-v26
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V26.md"
          if /usr/bin/git cat-file -e "$F:$P/functors_v26.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V26.md"
          V=research/gmi-1068-recursive-audit-v25/SCOPE_SNAPSHOT_V25.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v25-predecessor.json
          cmp /tmp/gmi-v25-predecessor.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v26/SCOPE_SNAPSHOT_V26.json --predecessor "$V" --output /tmp/gmi-v26-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          set -eu
          P=research/gmi-1068-admission-structure-v26
          python3 -I -B "$P/check_admission_v26.py" > /tmp/admission-v26.json
          python3 -I -O -B "$P/check_admission_v26.py" > /tmp/admission-v26-opt.json
          cmp /tmp/admission-v26.json /tmp/admission-v26-opt.json
      - name: All-round successor integrity
        run: |
          set -eu
          P=research/gmi-1068-recursive-audit-v26
          python3 -I -B "$P/check_snapshot_v26.py"
          python3 -I -O -B "$P/check_snapshot_v26.py"
          python3 -I -B "$P/test_snapshot_v26.py"
          python3 -I -O -B "$P/test_snapshot_v26.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V26.json" --baseline /tmp/gmi-v26-ci-base.json --changed-files /tmp/gmi-changed.txt
