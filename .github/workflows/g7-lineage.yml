name: G7 persistent developmental lineage

on:
  pull_request:
    paths:
      - 'research/g7-lineage-v1/**'
      - '.github/workflows/g7-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'research/g7-lineage-v1/**'
      - '.github/workflows/g7-lineage.yml'

permissions:
  contents: read

jobs:
  microscope-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/research/g7-lineage-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Freeze controls
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g7-lineage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/g7-lineage-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/g7-lineage-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Two-transition lineage study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g7-lineage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/time -v python -B research/g7-lineage-v1/experiment.py \
            --out "$out/result.json" \
            --transitions "$out/transitions" \
            2> >(tee "$out/time-and-stderr.txt" >&2) \
            | tee "$out/console.txt"
      - name: Source custody
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-lineage
          path: '${{ runner.temp }}/g7-lineage-${{ github.run_id }}-${{ github.run_attempt }}'
          if-no-files-found: error
