name: N1 UD induction and grammar
on:
  pull_request:
    paths:
      - 'research/ocm-n1/ud_induction.py'
      - 'research/ocm-n1/ud_grammar.py'
      - 'research/ocm-n1/n1_ud_dev_eval.py'
      - 'research/ocm-n1/test_ud_induction_grammar.py'
      - 'research/ocm-n1/test_ud_dev_eval.py'
      - '.github/workflows/n1-ud-induction.yml'
  push:
    branches: [main]
    paths:
      - 'research/ocm-n1/ud_induction.py'
      - 'research/ocm-n1/ud_grammar.py'
      - 'research/ocm-n1/n1_ud_dev_eval.py'
      - 'research/ocm-n1/test_ud_induction_grammar.py'
      - 'research/ocm-n1/test_ud_dev_eval.py'
      - '.github/workflows/n1-ud-induction.yml'
permissions:
  contents: read
jobs:
  ud-induction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: ./scripts/m0_install_dev.sh
      - name: Synthetic custody, induction, projectivity and parse tests
        run: |
          python research/ocm-n1/test_ud_induction_grammar.py
          python research/ocm-n1/test_ud_dev_eval.py
