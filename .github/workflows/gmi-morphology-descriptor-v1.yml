name: GMI morphology descriptor (F4)

on:
  pull_request:
    paths:
      - 'research/gmi-morphology-descriptor-v1/**'
      - '.github/workflows/gmi-morphology-descriptor-v1.yml'
  push:
    paths:
      - 'research/gmi-morphology-descriptor-v1/**'
      - '.github/workflows/gmi-morphology-descriptor-v1.yml'
  workflow_dispatch:

jobs:
  descriptor-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run descriptor controls
        shell: bash
        run: |
          if [ "${{ matrix.optimized }}" = "true" ]; then
            python3 -I -O -B research/gmi-morphology-descriptor-v1/test_morphology_descriptor_v1.py -v
          else
            python3 -I -B research/gmi-morphology-descriptor-v1/test_morphology_descriptor_v1.py -v
          fi
