name: GMI capability predictor (F4 development-only)

on:
  pull_request:
    paths:
      - 'research/gmi-capability-predictor-dev-v1/**'
      - '.github/workflows/gmi-capability-predictor-dev-v1.yml'
  push:
    paths:
      - 'research/gmi-capability-predictor-dev-v1/**'
      - '.github/workflows/gmi-capability-predictor-dev-v1.yml'
  workflow_dispatch:

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact controls
        shell: bash
        run: |
          if [ "${{ matrix.optimized }}" = "true" ]; then
            python -I -O -B research/gmi-capability-predictor-dev-v1/test_dev_predictor_v1.py -v
          else
            python -I -B research/gmi-capability-predictor-dev-v1/test_dev_predictor_v1.py -v
          fi
