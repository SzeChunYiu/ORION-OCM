name: gmi-1068-scalarization-v12
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-scalarization-v12.yml'
jobs:
  scalarization-boundaries-and-original-atom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=3d5e7b524c05081ba28548b3d209d0c5d7e9cd18
          P=research/gmi-1068-scalarization-v12
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V12.md"
          if /usr/bin/git cat-file -e "$F:$P/scalarization_v12.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V12.md"
          V=research/gmi-1068-recursive-audit-v11/SCOPE_SNAPSHOT_V11.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v11.json
          cmp /tmp/gmi-v11.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v12/SCOPE_SNAPSHOT_V12.json --predecessor "$V" --output /tmp/gmi-v12-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          P=research/gmi-1068-scalarization-v12
          python3 -I -B "$P/check_scalarization_v12.py" > /tmp/scalarization-v12.json
          python3 -I -O -B "$P/check_scalarization_v12.py" > /tmp/scalarization-v12-opt.json
          cmp /tmp/scalarization-v12.json /tmp/scalarization-v12-opt.json
      - name: All-round successor integrity
        run: |
          P=research/gmi-1068-recursive-audit-v12
          python3 -I -B "$P/check_snapshot_v12.py"
          python3 -I -O -B "$P/check_snapshot_v12.py"
          python3 -I -B "$P/test_snapshot_v12.py"
          python3 -I -O -B "$P/test_snapshot_v12.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V12.json" --baseline /tmp/gmi-v12-ci-base.json --changed-files /tmp/gmi-changed.txt
