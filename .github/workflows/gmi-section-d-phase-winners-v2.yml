name: GMI Section D phase winners v2

on:
  pull_request:
    paths:
      - 'research/gmi-section-d-phase-winners-v2/**'
      - '.github/workflows/gmi-section-d-phase-winners-v2.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-section-d-phase-winners-v2/**'
      - '.github/workflows/gmi-section-d-phase-winners-v2.yml'

jobs:
  exact-phase-winners:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact receipt
        shell: bash
        run: |
          cd research/gmi-section-d-phase-winners-v2
          if [ "${{ matrix.mode }}" = "optimized" ]; then
            python -O section_d_phase_winners_witness.py
          else
            python section_d_phase_winners_witness.py
          fi
          git diff --exit-code -- RESULT_V2_V3.json
      - name: Run hostile and theorem checks
        shell: bash
        run: |
          cd research/gmi-section-d-phase-winners-v2
          if [ "${{ matrix.mode }}" = "optimized" ]; then
            python -O -m unittest -v test_section_d_phase_winners.py
          else
            python -m unittest -v test_section_d_phase_winners.py
          fi
      - name: Source custody
        run: git diff --exit-code
