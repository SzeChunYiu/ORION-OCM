name: Goal-only lifecycle integration
on:
  push:
    branches: [research/goal-only-lifecycle-20260909]
    paths:
      - '.github/workflows/goal-only-lifecycle.yml'
      - 'research/goal-only-lifecycle-v1/**'
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source without executing studies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ocm-source"
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/ocm-source/checkout.tar.gz"
          git ls-tree -r HEAD > "${RUNNER_TEMP}/ocm-source/GIT-TREE.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/ocm-source/COMMIT.txt"
          git rev-parse HEAD^{tree} > "${RUNNER_TEMP}/ocm-source/TREE.txt"
          sha256sum "${RUNNER_TEMP}/ocm-source/checkout.tar.gz" > "${RUNNER_TEMP}/ocm-source/ARCHIVE-SHA256.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: goal-only-lifecycle-source-${{ github.sha }}
          path: ${{ runner.temp }}/ocm-source/
          retention-days: 7
          if-no-files-found: error
