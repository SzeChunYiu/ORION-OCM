name: Goal-only lifecycle integration
on:
  push:
    branches: [research/goal-only-lifecycle-20260909]
    paths:
      - '.github/workflows/goal-only-lifecycle.yml'
      - 'research/goal-only-lifecycle-v1/**'
  pull_request:
    paths:
      - '.github/workflows/goal-only-lifecycle.yml'
      - 'research/goal-only-lifecycle-v1/**'
permissions:
  contents: read
jobs:
  authored-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authored cold-process controls, not historical studies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/goal-lifecycle"
          python research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "${RUNNER_TEMP}/goal-lifecycle/normal.log"
          python -O research/goal-only-lifecycle-v1/test_lifecycle.py 2>&1 | tee "${RUNNER_TEMP}/goal-lifecycle/optimized.log"
          git rev-parse HEAD > "${RUNNER_TEMP}/goal-lifecycle/COMMIT.txt"
          git ls-tree -r HEAD research/goal-only-lifecycle-v1 .github/workflows/goal-only-lifecycle.yml > "${RUNNER_TEMP}/goal-lifecycle/GIT-TREE.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-lifecycle-controls-${{ github.sha }}
          path: ${{ runner.temp }}/goal-lifecycle/
          retention-days: 30
          if-no-files-found: error
