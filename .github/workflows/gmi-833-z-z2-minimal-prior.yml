name: GMI 833 Z2 minimal prior
on:
  pull_request:
    paths:
      - 'research/gmi-833-z-z2-minimal-prior-v1/**'
      - '.github/workflows/gmi-833-z-z2-minimal-prior.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-z-z2-minimal-prior-v1/**'
      - '.github/workflows/gmi-833-z-z2-minimal-prior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  z2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze precedes implementation
        run: |
          set -eu
          P=research/gmi-833-z-z2-minimal-prior-v1
          FIRST=$(git log --format=%H --reverse -- "$P" | head -1)
          echo "first commit touching the package: $FIRST"
          FILES=$(git show --pretty=format: --name-only "$FIRST" -- "$P" | sed '/^$/d')
          echo "$FILES"
          if [ "$FILES" = "$P/FREEZE_V1.md" ]; then
            echo "strict: the package was born as a freeze-only commit"
          else
            # a squash merge legitimately collapses the branch into one commit;
            # the guarantee that survives is that the freeze is present in it
            echo "$FILES" | grep -qx "$P/FREEZE_V1.md" \
              || { echo "FREEZE_V1.md absent from the publishing commit"; exit 1; }
            echo "squash-tolerant: the freeze is part of the package the moment it exists"
          fi
          # every amendment must precede the first receipt
          REC=$(git log --format=%H --reverse -- "$P/RESULT_V1.json" | head -1)
          for A in 1 2 3 4; do
            AC=$(git log --format=%H --reverse -- "$P/FREEZE_V1_AMENDMENT_$A.md" | head -1)
            if [ -n "$AC" ] && [ -n "$REC" ] && [ "$AC" != "$REC" ]; then
              git merge-base --is-ancestor "$AC" "$REC" \
                || { echo "amendment $A does not precede the receipt"; exit 1; }
            fi
          done
          echo "freeze order OK"

      - name: Route B (independent oracle)
        run: python3 -I -B research/gmi-833-z-z2-minimal-prior-v1/independent_minimal_prior_oracle_v1.py

      - name: Route A (simulation)
        run: python3 -I -B research/gmi-833-z-z2-minimal-prior-v1/z2_minimal_prior_v1.py

      - name: Row-3 site audit over the live corpus
        run: python3 -I -B research/gmi-833-z-z2-minimal-prior-v1/prior_free_site_audit_v1.py

      - name: Receipts must be reproducible byte-for-byte
        run: |
          set -eu
          git diff --exit-code -- \
            research/gmi-833-z-z2-minimal-prior-v1/RESULT_V1.json \
            research/gmi-833-z-z2-minimal-prior-v1/ORACLE_RESULT_V1.json \
            research/gmi-833-z-z2-minimal-prior-v1/PRIOR_FREE_SITE_AUDIT_V1.json

      - name: Tests
        run: |
          python3 -I -B research/gmi-833-z-z2-minimal-prior-v1/test_z2_minimal_prior_v1.py -v
          python3 -I -O -B research/gmi-833-z-z2-minimal-prior-v1/test_z2_minimal_prior_v1.py -v
