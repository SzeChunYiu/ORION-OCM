name: GMI derived metacognition (META-1-4)

on:
  pull_request:
    paths:
      - 'research/gmi-metacognition-v1/**'
      - '.github/workflows/gmi-metacognition.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-metacognition-v1/**'
      - '.github/workflows/gmi-metacognition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metacognition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Run derived metacognition controls
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          args=(-I -B)
          if [ "$MODE" = optimized ]; then args+=(-O); fi
          python "${args[@]}" research/gmi-metacognition-v1/test_metacognition_v1.py -v
