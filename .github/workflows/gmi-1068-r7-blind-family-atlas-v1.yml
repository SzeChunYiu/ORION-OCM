name: gmi-1068-r7-blind-family-atlas-v1
on:
  pull_request:
    paths:
      - 'research/gmi-1068-r7-blind-family-atlas-v1/**'
      - '.github/workflows/gmi-1068-r7-blind-family-atlas-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Freeze custody
        shell: bash
        run: |
          set -euo pipefail
          F=8c306b2ffc656f5676818ee41d125daa7abd3fab
          P=research/gmi-1068-r7-blind-family-atlas-v1
          git cat-file -e "${F}:${P}/FREEZE_V1.md"
          if git cat-file -e "${F}:${P}/RESULT_V1.json" 2>/dev/null; then exit 1; fi
          git merge-base --is-ancestor "$F" HEAD
      - name: Exact atlas checks
        run: |
          python3 -I -B research/gmi-1068-r7-blind-family-atlas-v1/check_r7.py >/tmp/a.json
          python3 -I -O -B research/gmi-1068-r7-blind-family-atlas-v1/check_r7.py >/tmp/ao.json
          python3 -I -B research/gmi-1068-r7-blind-family-atlas-v1/independent_oracle_v1.py >/tmp/b.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a.json'));b=json.load(open('/tmp/b.json'))
          assert a['rows_green']==b['rows_green'] and a['row_count']==b['row_count']==18
          PY
