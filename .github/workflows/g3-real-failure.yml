name: G3 source-bound real failure incidents

on:
  pull_request:
    paths:
      - 'research/g3-real-failure-v1/**'
      - '.github/workflows/g3-real-failure.yml'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/kso/**'
      - 'src/ocm/store/**'
  push:
    branches: [main]
    paths:
      - 'research/g3-real-failure-v1/**'
      - '.github/workflows/g3-real-failure.yml'

permissions:
  contents: read

jobs:
  source-bound-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g3-real-failure-v1:${{ github.workspace }}/research/g2-cognitive-objects-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g3-realfail-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/g3-real-failure-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/g3-real-failure-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Source-bound probe study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g3-realfail-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/time -v python3 -B research/g3-real-failure-v1/experiment.py --out "$out/RESULT.json" \
            2> >(tee "$out/time-and-stderr.txt" >&2) \
            | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g3-realfail-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          allowed = {
              "PARENT_SUFFICIENT_AT_SCOPE",
              "SOURCE_BOUND_FAILURE_RECOVERY_SUPPORTED_AT_SCOPE",
              "SOURCE_BOUND_FAILURE_NOT_RECOVERED",
          }
          if not (result["terminal"] in allowed or result["terminal"].startswith("CANNOT_CHECK_")):
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result.get("programme_wide_g3_close"):
              sys.exit("this capsule must not claim G3 programme-wide close")
          if result["terminal"] == "JUMP":
              sys.exit("timeout must not license JUMP")
          if result["os_process"]["pid"] == result["process"]["pid"]:
              sys.exit("child pid equals parent pid; not an OS process restart")
          PY
      - name: Source custody
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- src
          git diff --exit-code -- \
            research/g3-failure-memory-v1/RESULT.json \
            research/g3-representation-v1/RESULT.json \
            research/g3-representation-diagnosis-v1/RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-real-failure
          path: '${{ runner.temp }}/g3-realfail-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
