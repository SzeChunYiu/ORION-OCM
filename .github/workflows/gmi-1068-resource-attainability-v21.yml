name: gmi-1068-resource-attainability-v21
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-resource-attainability-v21.yml'
jobs:
  execution-and-resource-attainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=7a4d076300b03f4f30d27ee6f65ded1ba55b4dc9
          P=research/gmi-1068-resource-attainability-v21
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V21.md"
          if /usr/bin/git cat-file -e "$F:$P/execution_v21.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V21.md"
          V=research/gmi-1068-recursive-audit-v20/SCOPE_SNAPSHOT_V20.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v20-predecessor.json
          cmp /tmp/gmi-v20-predecessor.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v21/SCOPE_SNAPSHOT_V21.json --predecessor "$V" --output /tmp/gmi-v21-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          set -eu
          P=research/gmi-1068-resource-attainability-v21
          python3 -I -B "$P/check_attainability_v21.py" > /tmp/attainability-v21.json
          python3 -I -O -B "$P/check_attainability_v21.py" > /tmp/attainability-v21-opt.json
          cmp /tmp/attainability-v21.json /tmp/attainability-v21-opt.json
      - name: All-round successor integrity
        run: |
          set -eu
          P=research/gmi-1068-recursive-audit-v21
          python3 -I -B "$P/check_snapshot_v21.py"
          python3 -I -O -B "$P/check_snapshot_v21.py"
          python3 -I -B "$P/test_snapshot_v21.py"
          python3 -I -O -B "$P/test_snapshot_v21.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V21.json" --baseline /tmp/gmi-v21-ci-base.json --changed-files /tmp/gmi-changed.txt
