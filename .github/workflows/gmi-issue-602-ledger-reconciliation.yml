name: GMI issue 602 ledger reconciliation

on:
  pull_request:
    paths:
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_V1.json"
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_COMPOSITION_V1.json"
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_CAPABILITY_CALIBRATION_V1.json"
      - "research/gmi-grand-unification-v1/reconcile_issue_602_v1.py"
      - ".github/workflows/gmi-issue-602-ledger-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_V1.json"
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_COMPOSITION_V1.json"
      - "research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_CAPABILITY_CALIBRATION_V1.json"
      - "research/gmi-grand-unification-v1/reconcile_issue_602_v1.py"
      - ".github/workflows/gmi-issue-602-ledger-reconciliation.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the registered reconciliation to live issue #602"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail-closed live-ledger check on pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode check --repository "${GITHUB_REPOSITORY}"
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode check --repository "${GITHUB_REPOSITORY}" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_COMPOSITION_V1.json
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode check --repository "${GITHUB_REPOSITORY}" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_CAPABILITY_CALIBRATION_V1.json
      - name: Apply exact registered transitions after merge to main
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode apply --repository "${GITHUB_REPOSITORY}"
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode apply --repository "${GITHUB_REPOSITORY}" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_COMPOSITION_V1.json
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode apply --repository "${GITHUB_REPOSITORY}" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_CAPABILITY_CALIBRATION_V1.json
      - name: Manual check/apply
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          mode=check
          if [ "$APPLY" = "true" ]; then mode=apply; fi
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode "$mode" --repository "$GITHUB_REPOSITORY"
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode "$mode" --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_COMPOSITION_V1.json
          python research/gmi-grand-unification-v1/reconcile_issue_602_v1.py \
            --mode "$mode" --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-grand-unification-v1/ISSUE_602_RECONCILIATION_CAPABILITY_CALIBRATION_V1.json
