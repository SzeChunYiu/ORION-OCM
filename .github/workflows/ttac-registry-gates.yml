name: ttac-registry-gates

# #323 recursive hardening, section 9: registry artifacts are DERIVED, never
# hand-copied, and generators never drift from their committed outputs.
# Fail-closed: any divergence, hand-edited census, off-taxonomy class,
# duplicate-key JSON, or machine-specific absolute path fails the build.
# python3 stdlib only; no installs.
on:
  push:
    paths:
      - "research/top-tier-atomic-closure-v1/**"
      - ".github/workflows/ttac-registry-gates.yml"
  pull_request:
    paths:
      - "research/top-tier-atomic-closure-v1/**"
      - ".github/workflows/ttac-registry-gates.yml"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Census derivation (RH-01: census is derived, never hand-copied)"
        run: python3 research/top-tier-atomic-closure-v1/derive_census.py

      - name: "Rebuild registry chain (RH-02: generator drift fails closed)"
        run: |
          cd research/top-tier-atomic-closure-v1
          python3 build_d2.py
          python3 build_d3.py
          python3 build_d9.py
          # build_b7.py is deliberately NOT re-run: it appends to the
          # append-only REPLAY_RECEIPTS_V1 ledger and is not idempotent.

      - name: Rebuild-vs-committed diff (stale generators fail closed)
        run: |
          /usr/bin/git diff --exit-code -- research/top-tier-atomic-closure-v1 \
            || { echo "REGISTRY_DRIFT: rebuilt artifacts differ from committed ones; regenerate and commit them"; exit 1; }

      - name: Post-rebuild census re-check
        run: python3 research/top-tier-atomic-closure-v1/derive_census.py

      - name: "Duplicate-key JSON ban (RH-07: parse-stable artifacts)"
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          def no_dupes(pairs):
              keys = [k for k, _ in pairs]
              if len(keys) != len(set(keys)):
                  raise ValueError(f"duplicate keys: {sorted(k for k in keys if keys.count(k) > 1)}")
              return dict(pairs)

          # Raw evidence captures are preserved byte-for-byte by design (truncated logs,
          # stdin dumps, planted tamper specimens) and are NOT claim-bearing JSON;
          # verified against the live tree: all 13 unparsable files live under these paths.
          SKIP_MARKERS = ("/raw/", "/records/", "diagnostic", "source_tamper")

          dup, unparsable, checked, skipped = [], [], 0, 0
          for p in Path("research").rglob("*.json"):
              if any(m in str(p) for m in SKIP_MARKERS):
                  skipped += 1
                  continue
              checked += 1
              try:
                  json.loads(p.read_text(), object_pairs_hook=no_dupes)
              except ValueError as e:
                  if "duplicate keys" in str(e):
                      dup.append(f"{p}: {e}")
                  else:
                      unparsable.append(f"{p}: {e}")
          if dup or unparsable:
              print("\n".join(dup + unparsable))
              print(f"JSON_STABILITY: {len(dup)} duplicate-key, {len(unparsable)} unparsable claim-bearing files")
              sys.exit(1)
          print(f"JSON_STABILITY PASS: {checked} claim-bearing files parse-stable ({skipped} raw captures skipped)")
          EOF

      - name: Machine-specific absolute-path ban (RH-14)
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          # Fail-closed scanner (distinct exit codes):
          #   1 ABSOLUTE_PATH_LEAK   unmarked machine-specific path in committed code
          #   3 CANNOT_CHECK         the scan itself failed
          # Evidence carve-out: a line QUOTING a defect path as recorded evidence is
          # legal only when explicitly marked "RH-14-EVIDENCE" on the same line
          # (see build_b7.py qg34 defect + its OUT_OF_REPO_CUSTODY resolution).
          # Runnable-code paths get no exemption.
          p = subprocess.run(
              ["grep", "-rn", "-E", r"/private/tmp|/Users/[a-z]", "--include=*.py", "research/"],
              capture_output=True, text=True)
          if p.returncode not in (0, 1):
              print(f"RH-14 CANNOT_CHECK: grep exit {p.returncode}: {p.stderr.strip()}")
              sys.exit(3)
          hits = p.stdout.splitlines()
          leaks = [l for l in hits if "RH-14-EVIDENCE" not in l]
          evidence = len(hits) - len(leaks)
          if leaks:
              print("\n".join(leaks))
              print(f"ABSOLUTE_PATH_LEAK: {len(leaks)} machine-specific absolute path(s) in "
                    f"committed code (quoted-evidence lines must carry the RH-14-EVIDENCE marker)")
              sys.exit(1)
          print(f"RH-14 PASS: 0 unmarked machine-specific absolute paths in research/*.py "
                f"({evidence} marked evidence quote(s) allowed)")
          EOF
