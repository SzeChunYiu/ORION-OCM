name: G2 utility-gated parent v2

on:
  pull_request:
    paths:
      - 'research/g2-utility-gated-parents-v2/**'
      - 'research/g2-strong-parents-v1/experiment.py'
      - '.github/workflows/g2-utility-gated-parents.yml'
      - 'src/ocm/learning/methods.py'
  push:
    branches: [main]
    paths:
      - 'research/g2-utility-gated-parents-v2/**'
      - '.github/workflows/g2-utility-gated-parents.yml'

permissions:
  contents: read

jobs:
  utility-gated-parents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g2-utility-gated-parents-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g2-ug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/g2-utility-gated-parents-v2 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
      - name: Utility-gated ledger
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g2-ug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/g2-utility-gated-parents-v2/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
      - name: Frozen v1 not overwritten
        run: git diff --exit-code -- research/g2-strong-parents-v1/RESULT.json
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-utility-gated-parents
          path: '${{ runner.temp }}/g2-ug-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
