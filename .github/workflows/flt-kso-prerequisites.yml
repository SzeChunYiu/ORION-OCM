name: FLT KSO prerequisite engineering
on:
  push:
    branches: [codex/flt-kso-prerequisites-20260906]
    paths:
      - 'research/flt-kso-v1/**'
      - '.github/workflows/flt-kso-prerequisites.yml'
  pull_request:
    paths:
      - 'research/flt-kso-v1/**'
      - '.github/workflows/flt-kso-prerequisites.yml'
permissions:
  contents: read
concurrency:
  group: flt-kso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact public source for reproducible offline editing
        run: |
          mkdir -p "$RUNNER_TEMP/flt-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/flt-evidence/source.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/flt-evidence/source.tree"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/flt-evidence/ocm-source.tar.gz"
          sha256sum "$RUNNER_TEMP/flt-evidence/ocm-source.tar.gz" > "$RUNNER_TEMP/flt-evidence/source.sha256"
      - name: Existing replay Python controls (not a kernel result)
        run: python research/proof-replay-v1/test_replay.py
      - name: New development controls (initial commit is expected RED)
        run: python research/flt-kso-v1/test_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flt-prerequisite-${{ github.sha }}
          path: ${{ runner.temp }}/flt-evidence/
          retention-days: 7
          if-no-files-found: error
