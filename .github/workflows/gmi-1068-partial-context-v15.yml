name: gmi-1068-partial-context-v15
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-partial-context-v15.yml'
jobs:
  partial-context-and-original-atoms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=9f99a97816571c5ef08a49982305b4718736d5ee
          P=research/gmi-1068-partial-context-v15
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V15.md"
          if /usr/bin/git cat-file -e "$F:$P/context_v15.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V15.md"
          V=research/gmi-1068-recursive-audit-v14/SCOPE_SNAPSHOT_V14.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v14.json
          cmp /tmp/gmi-v14.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v15/SCOPE_SNAPSHOT_V15.json --predecessor "$V" --output /tmp/gmi-v15-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          P=research/gmi-1068-partial-context-v15
          python3 -I -B "$P/check_context_v15.py" > /tmp/context-v15.json
          python3 -I -O -B "$P/check_context_v15.py" > /tmp/context-v15-opt.json
          cmp /tmp/context-v15.json /tmp/context-v15-opt.json
      - name: All-round successor integrity
        run: |
          P=research/gmi-1068-recursive-audit-v15
          python3 -I -B "$P/check_snapshot_v15.py"
          python3 -I -O -B "$P/check_snapshot_v15.py"
          python3 -I -B "$P/test_snapshot_v15.py"
          python3 -I -O -B "$P/test_snapshot_v15.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V15.json" --baseline /tmp/gmi-v15-ci-base.json --changed-files /tmp/gmi-changed.txt
