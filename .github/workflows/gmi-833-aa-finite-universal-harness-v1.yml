name: GMI 833 AA21 finite-scope-to-universal detector validation

on:
  pull_request:
    paths:
      - 'research/gmi-833-aa-finite-universal-harness-v1/**'
      - 'research/gmi-833-corpus-census-v1/**'
      - '.github/workflows/gmi-833-aa-finite-universal-harness-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-aa-finite-universal-harness-v1/**'
      - 'research/gmi-833-corpus-census-v1/**'
      - '.github/workflows/gmi-833-aa-finite-universal-harness-v1.yml'

permissions:
  contents: read

jobs:
  aa21-finite-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PKG: research/gmi-833-aa-finite-universal-harness-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze precedes implementation
        run: |
          set -euo pipefail
          git log --reverse --format=%H -- "$PKG/" | head -1 > /tmp/first.txt
          git show --name-only --format= "$(cat /tmp/first.txt)" -- "$PKG/" > /tmp/firstfiles.txt
          cat /tmp/firstfiles.txt
          # Strict form: the freeze is the only thing in the first commit that
          # ever touched this path. After a squash merge the whole package
          # arrives in one commit, so fall back to requiring the freeze to be
          # present in that publishing commit.
          if [ "$(grep -c . /tmp/firstfiles.txt)" = "1" ]; then
            grep -q 'FREEZE_V1.md' /tmp/firstfiles.txt
            echo 'freeze-first commit ordering intact'
          else
            grep -q 'FREEZE_V1.md' /tmp/firstfiles.txt
            echo 'package published by squash; freeze present in the publishing commit'
          fi
      - name: Route A harness
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/finite_universal_harness_v1.py" | tee /tmp/aa21_routeA.json
      - name: Route B independent oracle
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/independent_fin2univ_oracle_v1.py" | tee /tmp/aa21_routeB.json
      - name: Tests (normal)
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/test_finite_universal_harness_v1.py" 2>&1 | tee /tmp/aa21_tests.txt
      - name: Tests (optimized)
        run: |
          set -euo pipefail
          python3 -I -O -B "$PKG/test_finite_universal_harness_v1.py" 2>&1 | tee /tmp/aa21_tests-O.txt
      - name: Receipt matches the live two-route run
        run: |
          set -euo pipefail
          python3 -I -B "$PKG/check_receipt_v1.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmi-833-aa-finite-universal-harness-v1
          path: |
            /tmp/aa21_routeA.json
            /tmp/aa21_routeB.json
            /tmp/aa21_tests.txt
            /tmp/aa21_tests-O.txt
          if-no-files-found: error
