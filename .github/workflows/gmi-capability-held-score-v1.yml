name: GMI capability held-family score (F4)

on:
  pull_request:
    paths:
      - 'research/gmi-capability-held-score-v1/**'
      - 'research/gmi-capability-held-freeze-v1/**'
      - '.github/workflows/gmi-capability-held-score-v1.yml'
  push:
    paths:
      - 'research/gmi-capability-held-score-v1/**'
      - 'research/gmi-capability-held-freeze-v1/**'
      - '.github/workflows/gmi-capability-held-score-v1.yml'
  workflow_dispatch:

jobs:
  score-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run held score controls (normal)
        run: python -I -B research/gmi-capability-held-score-v1/test_held_score_v1.py -v
      - name: Run held score controls (optimized)
        run: python -I -O -B research/gmi-capability-held-score-v1/test_held_score_v1.py -v
