name: gmi-1068-r1-successor-v2
on:
  pull_request:
    paths:
      - 'research/gmi-1068-r1-minimal-process-core-v1/**'
      - '.github/workflows/gmi-1068-r1-successor-v2.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Freeze custody
        run: |
          set -euo pipefail
          F=4c6c0f7856691495edcb2effe900b83774f684eb
          P=research/gmi-1068-r1-minimal-process-core-v1
          git cat-file -e "${F}:${P}/SUCCESSOR_FREEZE_V2.md"
          if git cat-file -e "${F}:${P}/RESULT_V2.json" 2>/dev/null; then exit 1; fi
          if git cat-file -e "${F}:${P}/check_r1_successor_v2.py" 2>/dev/null; then exit 1; fi
          git merge-base --is-ancestor "$F" HEAD
      - name: Dual route
        run: |
          set -euo pipefail
          P=research/gmi-1068-r1-minimal-process-core-v1
          python3 -I -B "$P/check_r1_successor_v2.py" >/tmp/a
          python3 -I -O -B "$P/check_r1_successor_v2.py" >/tmp/ao
          python3 -I -B "$P/independent_oracle_v2.py" >/tmp/b
          cmp /tmp/a /tmp/ao
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a')); b=json.load(open('/tmp/b'))
          for k in ('reachable_pairs','empty_identities','assoc_path'):
              if a[k]!=b[k]: raise SystemExit(f'route disagreement {k}')
          if a['hostiles_caught']!=6: raise SystemExit('hostile count')
          PY
      - name: Registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/gmi-1068-r1-minimal-process-core-v1')
          r=json.loads((p/'RESULT_V2.json').read_text())
          q=json.loads((p/'RECONCILIATION_V2.json').read_text())
          ids=[x['id'] for x in q['rows']]
          if ids != [f'GMI2-R1-{i:03d}' for i in range(1,11)]: raise SystemExit('row ids')
          if q['claim_ceiling'] != r['claim_ceiling']: raise SystemExit('ceiling')
          if r['independent_requirement_bearing_components'] != 3: raise SystemExit('primitive count')
          PY
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean
        run: lean research/gmi-1068-r1-minimal-process-core-v1/ProcessCoreV2.lean
