name: GMI 833 global uncertainty contract v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-uncertainty-contract-v1/**'
      - '.github/workflows/gmi-833-uncertainty-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-uncertainty-contract-v1/**'
      - '.github/workflows/gmi-833-uncertainty-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=8525aa17ef26b94b7c3df112bc10847c07f1d799
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-uncertainty-contract-v1/FREEZE_V1.md"
          for p in \
            research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py \
            research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py \
            research/gmi-833-uncertainty-contract-v1/RESULT_V1.json \
            research/gmi-833-uncertainty-contract-v1/GLOBAL_UNCERTAINTY_CONTRACT_THEOREMS_V1.md; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then echo "post-freeze artifact existed at freeze: $p" >&2; exit 1; fi
          done
      - name: Verify and materialize pinned parent Git objects
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            path="$1"; expected="$2"; actual="$(git rev-parse "HEAD:$path")"; test "$actual" = "$expected"
            if [ ! -f "$path" ]; then mkdir -p "$(dirname "$path")"; git show "HEAD:$path" > "$path"; fi
            test "$(git hash-object "$path")" = "$expected"
          }
          verify_parent research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json d5253d8b77f45a3dfc9f96ddf66eef427acb1bf9
          verify_parent research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json 49df3257c9181c64bae63b53c503e302ca887fe8
          verify_parent research/gmi-epistemic-aleatoric-separation-v1/RESULT_V1.json e422a880c7e1f49cd80260cc679c31e056a4046d
          verify_parent research/gmi-capability-calibration-v2/RESULT_V2.json 278845962ef2a573d3664fc3a400591e440ed313
      - name: Hostile A1 — parent evidence pin audit
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          n=GlobalUncertaintyContractV1Tests.test_parent_evidence_exactly_pinned
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "$n" -v; else python -I -B "$t" "$n" -v; fi
      - name: Hostile A2 — parent mutation fails closed
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          n=GlobalUncertaintyContractV1Tests.test_parent_pin_mutation_fails_closed
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "$n" -v; else python -I -B "$t" "$n" -v; fi
      - name: Hostile A3 — deterministic receipt reproduction
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          n=GlobalUncertaintyContractV1Tests.test_receipt_green_and_byte_reproducible
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "$n" -v; else python -I -B "$t" "$n" -v; fi
      - name: Hostiles B — typed uncertainty object validation
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          args=(GlobalUncertaintyContractV1Tests.test_feasible_set_is_not_confidence_set GlobalUncertaintyContractV1Tests.test_set_objects_are_immutable_and_domain_checked GlobalUncertaintyContractV1Tests.test_confidence_budget_validation GlobalUncertaintyContractV1Tests.test_predictive_law_requires_normalized_unique_outcomes GlobalUncertaintyContractV1Tests.test_latent_model_duplicate_ids_and_outcomes_fail_closed)
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "${args[@]}" -v; else python -I -B "$t" "${args[@]}" -v; fi
      - name: Hostiles C — composition and dependence
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          args=(GlobalUncertaintyContractV1Tests.test_chain_composition_budget_and_version_are_exact GlobalUncertaintyContractV1Tests.test_relation_outside_registered_domain_is_rejected GlobalUncertaintyContractV1Tests.test_dependence_hostile_refutes_independence_product GlobalUncertaintyContractV1Tests.test_shared_ancestor_global_relation_is_stricter)
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "${args[@]}" -v; else python -I -B "$t" "${args[@]}" -v; fi
      - name: Hostiles D — query identification and abstention terminals
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          args=(GlobalUncertaintyContractV1Tests.test_missing_relation_is_unknown_not_source_copy GlobalUncertaintyContractV1Tests.test_unknown_nonconstant_query_abstains GlobalUncertaintyContractV1Tests.test_unknown_constant_query_can_still_be_identified GlobalUncertaintyContractV1Tests.test_empty_relation_is_inconsistency_with_zero_guaranteed_coverage GlobalUncertaintyContractV1Tests.test_cannot_identify_cannot_check_and_inconsistency_are_distinct GlobalUncertaintyContractV1Tests.test_non_set_uncertainty_object_cannot_be_queried_as_identified_set GlobalUncertaintyContractV1Tests.test_coverage_and_informativeness_are_separate)
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "${args[@]}" -v; else python -I -B "$t" "${args[@]}" -v; fi
      - name: Hostiles E — uncertainty-kind and claim-boundary controls
        shell: bash
        run: |
          t=research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py
          args=(GlobalUncertaintyContractV1Tests.test_same_marginal_can_have_opposite_uncertainty_decomposition GlobalUncertaintyContractV1Tests.test_selective_prediction_never_counts_abstention_as_success GlobalUncertaintyContractV1Tests.test_claim_ceiling_is_bounded GlobalUncertaintyContractV1Tests.test_no_floats_in_receipt)
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B "$t" "${args[@]}" -v; else python -I -B "$t" "${args[@]}" -v; fi
      - name: Full exact hostile suite
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py -v; else python -I -B research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py -v; fi
      - name: Regenerate deterministic receipt
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = optimized ]; then python -I -O -B research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py > /tmp/result.json; else python -I -B research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py > /tmp/result.json; fi
      - name: Byte-identical receipt gate
        run: cmp /tmp/result.json research/gmi-833-uncertainty-contract-v1/RESULT_V1.json
      - name: Check #833 exact reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py --mode check --repository "$GITHUB_REPOSITORY" --spec research/gmi-833-uncertainty-contract-v1/ISSUE_833_RECONCILIATION_UNCERTAINTY_V1.json

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize pinned parent Git objects
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() { path="$1"; expected="$2"; actual="$(git rev-parse "HEAD:$path")"; test "$actual" = "$expected"; if [ ! -f "$path" ]; then mkdir -p "$(dirname "$path")"; git show "HEAD:$path" > "$path"; fi; test "$(git hash-object "$path")" = "$expected"; }
          verify_parent research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json d5253d8b77f45a3dfc9f96ddf66eef427acb1bf9
          verify_parent research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json 49df3257c9181c64bae63b53c503e302ca887fe8
          verify_parent research/gmi-epistemic-aleatoric-separation-v1/RESULT_V1.json e422a880c7e1f49cd80260cc679c31e056a4046d
          verify_parent research/gmi-capability-calibration-v2/RESULT_V2.json 278845962ef2a573d3664fc3a400591e440ed313
      - name: Apply only earned #833 Section C rows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py --mode apply --repository "$GITHUB_REPOSITORY" --spec research/gmi-833-uncertainty-contract-v1/ISSUE_833_RECONCILIATION_UNCERTAINTY_V1.json
