name: GMI 833 global uncertainty contract v1

on:
  pull_request:
    paths:
      - 'research/gmi-833-uncertainty-contract-v1/**'
      - '.github/workflows/gmi-833-uncertainty-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'research/gmi-833-uncertainty-contract-v1/**'
      - '.github/workflows/gmi-833-uncertainty-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze custody on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          freeze=8525aa17ef26b94b7c3df112bc10847c07f1d799
          git cat-file -e "$freeze^{commit}"
          git cat-file -e "$freeze:research/gmi-833-uncertainty-contract-v1/FREEZE_V1.md"
          for p in \
            research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py \
            research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py \
            research/gmi-833-uncertainty-contract-v1/RESULT_V1.json \
            research/gmi-833-uncertainty-contract-v1/GLOBAL_UNCERTAINTY_CONTRACT_THEOREMS_V1.md; do
            if git cat-file -e "$freeze:$p" 2>/dev/null; then
              echo "post-freeze artifact existed at freeze: $p" >&2
              exit 1
            fi
          done
      - name: Verify and materialize pinned parent Git objects
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            path="$1"
            expected="$2"
            actual="$(git rev-parse "HEAD:$path")"
            if [ "$actual" != "$expected" ]; then
              echo "parent path/blob drift: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
            if [ ! -f "$path" ]; then
              echo "worktree omitted pinned parent; materializing exact HEAD object: $path"
              mkdir -p "$(dirname "$path")"
              git show "HEAD:$path" > "$path"
            fi
            worktree_blob="$(git hash-object "$path")"
            if [ "$worktree_blob" != "$expected" ]; then
              echo "materialized parent blob mismatch: $path expected=$expected actual=$worktree_blob" >&2
              exit 1
            fi
          }
          verify_parent research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json d5253d8b77f45a3dfc9f96ddf66eef427acb1bf9
          verify_parent research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json 49df3257c9181c64bae63b53c503e302ca887fe8
          verify_parent research/gmi-epistemic-aleatoric-separation-v1/RESULT_V1.json e422a880c7e1f49cd80260cc679c31e056a4046d
          verify_parent research/gmi-capability-calibration-v2/RESULT_V2.json 278845962ef2a573d3664fc3a400591e440ed313
      - name: Exact parent-pin and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py -v
          else
            python -I -B research/gmi-833-uncertainty-contract-v1/test_uncertainty_contract_v1.py -v
          fi
      - name: Regenerate deterministic receipt
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -I -O -B research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py > /tmp/result.json
          else
            python -I -B research/gmi-833-uncertainty-contract-v1/uncertainty_contract_v1.py > /tmp/result.json
          fi
      - name: Byte-identical receipt gate
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/result.json research/gmi-833-uncertainty-contract-v1/RESULT_V1.json
      - name: Check #833 exact reconciliation
        if: github.event_name == 'pull_request' && matrix.mode == 'normal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode check \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-uncertainty-contract-v1/ISSUE_833_RECONCILIATION_UNCERTAINTY_V1.json

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize pinned parent Git objects
        shell: bash
        run: |
          set -euo pipefail
          verify_parent() {
            path="$1"
            expected="$2"
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected"
            if [ ! -f "$path" ]; then
              mkdir -p "$(dirname "$path")"
              git show "HEAD:$path" > "$path"
            fi
            test "$(git hash-object "$path")" = "$expected"
          }
          verify_parent research/gmi-dependency-aware-uncertainty-composition-v1/RESULT_V1.json d5253d8b77f45a3dfc9f96ddf66eef427acb1bf9
          verify_parent research/gmi-developmental-uncertainty-transport-v1/RESULT_V1.json 49df3257c9181c64bae63b53c503e302ca887fe8
          verify_parent research/gmi-epistemic-aleatoric-separation-v1/RESULT_V1.json e422a880c7e1f49cd80260cc679c31e056a4046d
          verify_parent research/gmi-capability-calibration-v2/RESULT_V2.json 278845962ef2a573d3664fc3a400591e440ed313
      - name: Apply only earned #833 Section C rows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B research/gmi-833-foundation-v1/reconcile_issue_833_v1.py \
            --mode apply \
            --repository "$GITHUB_REPOSITORY" \
            --spec research/gmi-833-uncertainty-contract-v1/ISSUE_833_RECONCILIATION_UNCERTAINTY_V1.json
