name: gmi-833-z-z1-master-principle

on:
  push:
    paths:
      - 'research/gmi-833-z-z1-master-principle-v1/**'
      - '.github/workflows/gmi-833-z-z1-master-principle.yml'
  pull_request:
    paths:
      - 'research/gmi-833-z-z1-master-principle-v1/**'
      - '.github/workflows/gmi-833-z-z1-master-principle.yml'
  workflow_dispatch:

jobs:
  z1:
    name: Z1 marginal value principle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze precedes implementation, amendment precedes the receipt
        run: |
          set -euo pipefail
          PKG=research/gmi-833-z-z1-master-principle-v1
          # Strict form: the first commit that ever touched this package carries
          # the freeze. After a squash merge the whole package arrives in one
          # commit, so the timestamp form ("freeze strictly older than executor")
          # is unusable on main; presence-in-the-publishing-commit is the form
          # the sibling #833 workflows already use and it survives the squash.
          git log --reverse --format=%H -- "$PKG/" > /tmp/all_z1.txt
          FIRST=$(head -1 /tmp/all_z1.txt)
          if [ -z "$FIRST" ]; then echo "negative control: package absent from history"; exit 1; fi
          git show --name-only --format= "$FIRST" -- "$PKG/" > /tmp/firstfiles_z1.txt
          cat /tmp/firstfiles_z1.txt
          if ! grep -q 'FREEZE_V1.md' /tmp/firstfiles_z1.txt; then
            echo "FREEZE IS NOT IN THE COMMIT THAT FIRST TOUCHED THIS PACKAGE"; exit 1
          fi
          if [ "$(grep -c . /tmp/firstfiles_z1.txt)" = "1" ]; then
            echo 'freeze-first commit ordering intact'
          else
            echo 'package published by squash; freeze present in the publishing commit'
          fi
          # The amendment must not postdate the receipt it governs.
          git log --reverse --format=%H --diff-filter=A -- "$PKG/FREEZE_V1_AMENDMENT_1.md" > /tmp/amend.txt
          A=$(head -1 /tmp/amend.txt)
          git log --reverse --format=%H --diff-filter=A -- "$PKG/RESULT_V1.json" > /tmp/receipt.txt
          R=$(head -1 /tmp/receipt.txt)
          if [ -z "$A" ]; then echo "negative control: amendment absent from history"; exit 1; fi
          if [ -z "$R" ]; then echo "negative control: receipt absent from history"; exit 1; fi
          echo "amendment=$A receipt=$R"
          if [ "$A" != "$R" ] && ! git merge-base --is-ancestor "$A" "$R"; then
            echo "AMENDMENT DOES NOT PRECEDE THE RECEIPT"; exit 1
          fi

      - name: Workflow integrity
        run: python3 -I -B research/gmi-833-workflow-integrity-v1/check_workflows_v1.py

      - name: Route B oracle
        run: python3 -I -B research/gmi-833-z-z1-master-principle-v1/independent_compression_oracle_v1.py

      - name: Route A executor
        run: python3 -I -B research/gmi-833-z-z1-master-principle-v1/z1_master_principle_v1.py

      - name: Receipts are byte-stable
        run: |
          set -eu
          git diff --exit-code -- research/gmi-833-z-z1-master-principle-v1/RESULT_V1.json
          git diff --exit-code -- research/gmi-833-z-z1-master-principle-v1/ORACLE_RESULT_V1.json

      - name: Tests (normal mode)
        run: python3 -I -B research/gmi-833-z-z1-master-principle-v1/test_z1_master_principle_v1.py -v

      - name: Tests (optimized mode)
        run: python3 -I -O -B research/gmi-833-z-z1-master-principle-v1/test_z1_master_principle_v1.py -v

      - name: Verdict gate
        run: |
          set -eu
          python3 -I -B - research/gmi-833-z-z1-master-principle-v1/RESULT_V1.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as fh:
              r = json.load(fh)
          if not r["IC_1_all_corollaries_hold"]:
              sys.exit("a corollary of IC-1 failed")
          if not r["nonvacuity"]["W_NONVACUITY_holds"]:
              sys.exit("separation population has no shared profiles: the claim would be vacuous")
          if not r["W_NOALARM_holds"]:
              sys.exit("no law is compressible: the separator separates everything and is broken")
          if r["incompressible_laws"] != ["L_DEGENERACY", "L_DISTINCT", "L_MDL", "L_REACH"]:
              sys.exit("separation set drifted: %s" % r["incompressible_laws"])
          for name in r["incompressible_laws"]:
              w = r["incompressibility"][name]["separation_witness"]
              if w is None:
                  sys.exit("%s claimed incompressible with no exhibited witness" % name)
              if w["profile"]["E0"] == w["profile"]["E1"]:
                  sys.exit("%s witness is degenerate" % name)
          if not r["null"]["identified"]:
              sys.exit("IC-1 is not identified inside its declared law family")
          if not r["hostiles_all_detected"]:
              sys.exit("an inert hostile is a defect of this package")
          print("Z1 OK; raw pair", r["compression"]["raw_pair_IC_1"],
                "ladder", r["head_to_head"]["IC_1_on_ladder"])
          PY
