name: G2 OS-process restart

on:
  pull_request:
    paths:
      - 'research/g2-process-restart-v1/**'
      - '.github/workflows/g2-process-restart.yml'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/store/**'
  push:
    branches: [main]
    paths:
      - 'research/g2-process-restart-v1/**'
      - '.github/workflows/g2-process-restart.yml'

permissions:
  contents: read

jobs:
  process-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/g2-process-restart-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g2-process-restart-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/g2-process-restart-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/g2-process-restart-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: OS-process restart study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g2-process-restart-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/g2-process-restart-v1/experiment.py --out "$out/RESULT.json" | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "g2-process-restart-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          allowed = {
              "OS_PROCESS_RESTART_HELD_OUT_SOLVE_SUPPORTED",
              "NO_OS_PROCESS_RESTART",
              "IN_PROCESS_RECONSTRUCTION_ONLY",
              "HELD_OUT_SOLVE_FAILED",
          }
          if result["terminal"] not in allowed:
              sys.exit("unexpected terminal %s" % result["terminal"])
          if result["terminal"] == "CAUSAL_METHOD_REUSE_SUPPORTED":
              sys.exit("unscoped CAUSAL_METHOD_REUSE_SUPPORTED is not licensed")
          if result.get("g24_complete"):
              sys.exit("this capsule must not claim G2.4 complete")
          if result["os_process"]["pid"] == result["process"]["pid"]:
              sys.exit("child pid equals parent pid; not an OS process restart")
          if result["in_process_reconstruction"]["pid"] != result["process"]["pid"]:
              sys.exit("in-process reconstruction control must share the parent pid")
          PY
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-process-restart
          path: '${{ runner.temp }}/g2-process-restart-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
