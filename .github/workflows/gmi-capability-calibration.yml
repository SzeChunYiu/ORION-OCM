name: gmi-capability-calibration

on:
  pull_request:
    paths:
      - 'research/gmi-capability-calibration-v1/**'
      - '.github/workflows/gmi-capability-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-calibration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            python_cmd: python
          - mode: optimized
            python_cmd: python -O
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify freeze and sample custody
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=f46d2b3930b980f85d2d0143cba20b39f396b396
          POP=68d5101b26bb095546030e1e37a994f74e62fe15
          SAMPLE=f528ddcc183d28ae5cd91a98a9c1a860ddd3ba8d
          ROOT=research/gmi-capability-calibration-v1
          git merge-base --is-ancestor "$FREEZE" HEAD
          git merge-base --is-ancestor "$POP" HEAD
          git merge-base --is-ancestor "$SAMPLE" HEAD
          changed="$(git diff-tree --no-commit-id --name-only -r "$FREEZE" | sed '/^$/d')"
          test "$changed" = "$ROOT/FREEZE_V1.md"
          for path in \
            "$ROOT/POPULATION_MANIFEST_V1.json" \
            "$ROOT/SAMPLE_MANIFEST_V1.json" \
            "$ROOT/capability_calibration_v1.py" \
            "$ROOT/FORMALIZATION_V1.md" \
            "$ROOT/RESULT_V1.json"; do
            if git cat-file -e "$FREEZE:$path" 2>/dev/null; then
              echo "post-freeze artifact existed at freeze: $path" >&2
              exit 1
            fi
          done
          for path in \
            "$ROOT/capability_calibration_v1.py" \
            "$ROOT/FORMALIZATION_V1.md" \
            "$ROOT/RESULT_V1.json" \
            ".github/workflows/gmi-capability-calibration.yml"; do
            if git cat-file -e "$SAMPLE:$path" 2>/dev/null; then
              echo "scorer/result artifact existed at sample custody: $path" >&2
              exit 1
            fi
          done
          git cat-file -e "$SAMPLE:$ROOT/POPULATION_MANIFEST_V1.json"
          git cat-file -e "$SAMPLE:$ROOT/SAMPLE_MANIFEST_V1.json"
          test "$(git rev-parse HEAD:research/gmi-capability-predictor-dev-v1/dev_predictor_v1.py)" = "937b91f6a3787ff04c2b5209c81d249518406859"
      - name: Run exact and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} -m unittest discover \
            -s research/gmi-capability-calibration-v1 \
            -p 'test_*.py'
      - name: Reproduce committed full receipt
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} research/gmi-capability-calibration-v1/capability_calibration_v1.py > /tmp/RESULT_V1.json
          cmp /tmp/RESULT_V1.json research/gmi-capability-calibration-v1/RESULT_V1.json
