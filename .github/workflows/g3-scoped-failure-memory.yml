name: G3 scoped failure-point memory development
on:
  push:
    branches: [research/programme-execution-20260909]
    paths: ['.github/workflows/g3-scoped-failure-memory.yml']
permissions:
  contents: read
jobs:
  scoped-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Freeze source identities before authored controls or study
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/g3-evidence"
          git rev-parse HEAD > "${RUNNER_TEMP}/g3-evidence/COMMIT.txt"
          git ls-tree -r HEAD src research/g3-scoped-failure-memory-v1 research/programme-execution-20260909 .github/workflows/g3-scoped-failure-memory.yml .github/workflows/programme-execution-20260909.yml LICENSE > "${RUNNER_TEMP}/g3-evidence/GIT-TREE.txt"
          git archive --format=tar.gz HEAD src research/g3-scoped-failure-memory-v1 research/programme-execution-20260909 .github/workflows/g3-scoped-failure-memory.yml .github/workflows/programme-execution-20260909.yml LICENSE > "${RUNNER_TEMP}/g3-evidence/SOURCE.tar.gz"
          sha256sum research/g3-scoped-failure-memory-v1/* > "${RUNNER_TEMP}/g3-evidence/STUDY-SHA256.txt"
      - name: Authored controls normal and optimized, not the study population
        run: |
          set -euo pipefail
          python research/g3-scoped-failure-memory-v1/test_experiment.py 2>&1 | tee "${RUNNER_TEMP}/g3-evidence/normal.log"
          python -O research/g3-scoped-failure-memory-v1/test_experiment.py 2>&1 | tee "${RUNNER_TEMP}/g3-evidence/optimized.log"
          git diff --exit-code HEAD
      - name: One frozen development run; no replacement or retuning
        run: |
          set -euo pipefail
          python research/g3-scoped-failure-memory-v1/experiment.py --out "${RUNNER_TEMP}/g3-evidence/study" | tee "${RUNNER_TEMP}/g3-evidence/study.log"
          git diff --exit-code HEAD
          sha256sum -c "${RUNNER_TEMP}/g3-evidence/STUDY-SHA256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-failure-point-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/g3-evidence/
          retention-days: 30
          if-no-files-found: error
