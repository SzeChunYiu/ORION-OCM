name: gmi-1068-permission-barriers-v22
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-permission-barriers-v22.yml'
jobs:
  permission-enabling-and-blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=3d5d0e676a44902a64f73d687d92f8cff488a839
          P=research/gmi-1068-permission-barriers-v22
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V22.md"
          if /usr/bin/git cat-file -e "$F:$P/execution_v22.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V22.md"
          V=research/gmi-1068-recursive-audit-v21/SCOPE_SNAPSHOT_V21.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v21-predecessor.json
          cmp /tmp/gmi-v21-predecessor.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v22/SCOPE_SNAPSHOT_V22.json --predecessor "$V" --output /tmp/gmi-v22-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          set -eu
          P=research/gmi-1068-permission-barriers-v22
          python3 -I -B "$P/check_barriers_v22.py" > /tmp/barriers-v22.json
          python3 -I -O -B "$P/check_barriers_v22.py" > /tmp/barriers-v22-opt.json
          cmp /tmp/barriers-v22.json /tmp/barriers-v22-opt.json
      - name: All-round successor integrity
        run: |
          set -eu
          P=research/gmi-1068-recursive-audit-v22
          python3 -I -B "$P/check_snapshot_v22.py"
          python3 -I -O -B "$P/check_snapshot_v22.py"
          python3 -I -B "$P/test_snapshot_v22.py"
          python3 -I -O -B "$P/test_snapshot_v22.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V22.json" --baseline /tmp/gmi-v22-ci-base.json --changed-files /tmp/gmi-changed.txt
