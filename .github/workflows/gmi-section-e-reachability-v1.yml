name: GMI Section E reachability v1

on:
  pull_request:
    paths:
      - 'research/gmi-section-e-reachability-v1/**'
      - '.github/workflows/gmi-section-e-reachability-v1.yml'
  workflow_dispatch:

jobs:
  exact-reachability:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact receipt
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-e-reachability-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O section_e_reachability_witness.py --output /tmp/RESULT_E1.json
          else
            python section_e_reachability_witness.py --output /tmp/RESULT_E1.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          committed = json.loads(Path('RESULT_E1.json').read_text())
          reproduced = json.loads(Path('/tmp/RESULT_E1.json').read_text())
          if committed != reproduced:
              raise SystemExit('semantic receipt mismatch')
          PY
      - name: Run hostile and theorem checks
        shell: bash
        run: |
          set -euo pipefail
          cd research/gmi-section-e-reachability-v1
          if [ "${{ matrix.mode }}" = optimized ]; then
            python -O -m unittest -v test_section_e_reachability.py
          else
            python -m unittest -v test_section_e_reachability.py
          fi
      - name: Source custody
        run: git diff --exit-code
