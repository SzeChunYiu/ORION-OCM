name: cognitive-ladder

on:
  push:
    paths:
      - 'research/cognitive-ladder/**'
      - 'research/cognitive-theory/**'
      - 'docs/spec/COGNITIVE_LADDER_*.md'
      - '.github/workflows/cognitive-ladder.yml'
  pull_request:
    paths:
      - 'research/cognitive-ladder/**'
      - 'research/cognitive-theory/**'
      - 'docs/spec/COGNITIVE_LADDER_*.md'
      - '.github/workflows/cognitive-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/cognitive-ladder:${{ github.workspace }}/research/cognitive-theory'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5
      - name: Lane tests
        run: >-
          python -B -m pytest -q research/cognitive-ladder research/cognitive-theory
          --basetemp=${{ runner.temp }}/ladder
          --junitxml=${{ runner.temp }}/ladder.xml
      - name: Generated artifacts are current
        run: |
          python research/cognitive-ladder/atlas.py
          python research/cognitive-ladder/study_cards.py
          python research/cognitive-ladder/claim_ledger.py
          python research/cognitive-theory/registry.py
          cd research/cognitive-ladder && python incident_intake.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-ladder-junit
          path: ${{ runner.temp }}/ladder.xml
      - name: Source custody
        if: always()
        run: /usr/bin/git diff --exit-code
