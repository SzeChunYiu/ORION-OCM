name: gmi-1068-reference-envelope-v18
on:
  pull_request:
    paths:
      - 'research/gmi-1068*/**'
      - '.github/workflows/gmi-1068-reference-envelope-v18.yml'
jobs:
  reference-envelope-and-original-atoms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Freeze and baseline custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(/usr/bin/git rev-parse HEAD)" = "$HEAD_SHA"
          F=12d4aaa003f7706266467cb5352792ef6957eb7c
          P=research/gmi-1068-reference-envelope-v18
          /usr/bin/git merge-base --is-ancestor "$F" HEAD
          /usr/bin/git cat-file -e "$F:$P/FREEZE_V18.md"
          if /usr/bin/git cat-file -e "$F:$P/prefix_v18.py" 2>/dev/null; then exit 1; fi
          /usr/bin/git diff --exit-code "$F" HEAD -- "$P/FREEZE_V18.md"
          V=research/gmi-1068-recursive-audit-v17/SCOPE_SNAPSHOT_V17.json
          /usr/bin/git show "$BASE_SHA:$V" > /tmp/gmi-v17-predecessor.json
          cmp /tmp/gmi-v17-predecessor.json "$V"
          python3 -I -B research/gmi-1068-recursive-audit-v10/select_ci_baseline.py --base-sha "$BASE_SHA" --current research/gmi-1068-recursive-audit-v18/SCOPE_SNAPSHOT_V18.json --predecessor "$V" --output /tmp/gmi-v18-ci-base.json
          /usr/bin/git diff --name-only "$BASE_SHA" HEAD > /tmp/gmi-changed.txt
      - name: Pinned Lean 4.19.0
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact kernel and independent replay
        run: |
          set -eu
          P=research/gmi-1068-reference-envelope-v18
          python3 -I -B "$P/check_envelope_v18.py" > /tmp/envelope-v18.json
          python3 -I -O -B "$P/check_envelope_v18.py" > /tmp/envelope-v18-opt.json
          cmp /tmp/envelope-v18.json /tmp/envelope-v18-opt.json
      - name: All-round successor integrity
        run: |
          set -eu
          P=research/gmi-1068-recursive-audit-v18
          python3 -I -B "$P/check_snapshot_v18.py"
          python3 -I -O -B "$P/check_snapshot_v18.py"
          python3 -I -B "$P/test_snapshot_v18.py"
          python3 -I -O -B "$P/test_snapshot_v18.py"
          python3 -I -B research/gmi-1068-recursive-audit-v3/gate.py --snapshot "$P/SCOPE_SNAPSHOT_V18.json" --baseline /tmp/gmi-v18-ci-base.json --changed-files /tmp/gmi-changed.txt
