name: L1 continual-adaptation parent

on:
  pull_request:
    paths:
      - 'research/l1-continual-adapt-v1/**'
      - '.github/workflows/l1-continual-adapt.yml'
  push:
    branches: [main]
    paths:
      - 'research/l1-continual-adapt-v1/**'
      - '.github/workflows/l1-continual-adapt.yml'

permissions:
  contents: read

jobs:
  l1-continual-adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-adapt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 -B -m unittest discover -s research/l1-continual-adapt-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python3 -B -O -m unittest discover -s research/l1-continual-adapt-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: Microworld study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-adapt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B research/l1-continual-adapt-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "l1-adapt-%s-%s" % (os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          )
          result = json.loads((out / "RESULT.json").read_text())
          allowed = {
              "CONTINUAL_ADAPTATION_SUPPORTED_AT_SCOPE",
              "PARENT_SUFFICIENT",
              "RESET_PARENT_EQUIVALENT",
          }
          terminal = result["terminal"]
          if terminal not in allowed and not str(terminal).startswith("CANNOT_CHECK_"):
              sys.exit("unexpected terminal %s" % terminal)
          if result.get("l2_started") or result.get("l3_started"):
              sys.exit("L2/L3 must stay locked")
          if result.get("morphology_n2_started"):
              sys.exit("N2 morphology must not start")
          if result.get("corpus_n1_claimed"):
              sys.exit("corpus-scale N1 must not be claimed")
          if result.get("programme_tick"):
              sys.exit("programme_tick must be false")
          if any(box.get("programme_tick") for box in result.get("boxes", [])):
              sys.exit("every box programme_tick must be false")
          for key in ("v1_result_intact", "v2_result_intact", "v3_result_intact", "v4_result_intact"):
              if not result.get(key):
                  sys.exit("%s must remain intact" % key)
          print(terminal)
          PY
          cp research/l1-continual-adapt-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Frozen v1–v4 not overwritten
        run: |
          git diff --exit-code -- research/l1-linguistic-g2-v1/RESULT.json
          git diff --exit-code -- research/l1-linguistic-g2-v2/RESULT.json
          git diff --exit-code -- research/l1-linguistic-g2-v3/RESULT.json
          git diff --exit-code -- research/l1-linguistic-g2-v4/RESULT.json
      - name: Source custody
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-continual-adapt
          path: '${{ runner.temp }}/l1-adapt-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
