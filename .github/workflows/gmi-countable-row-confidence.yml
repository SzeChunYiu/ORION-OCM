name: GMI countable row confidence
on:
  push:
    branches: [main]
    paths:
      - 'research/gmi-countable-row-corrigendum-v1/**'
      - 'research/gmi-adaptive-creation-v1/**'
      - '.github/workflows/gmi-countable-row-confidence.yml'
  pull_request:
    paths:
      - 'research/gmi-countable-row-corrigendum-v1/**'
      - 'research/gmi-adaptive-creation-v1/**'
      - '.github/workflows/gmi-countable-row-confidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact and adversarial confidence controls
        shell: bash
        run: |
          flags=()
          if [ '${{ matrix.mode }}' = optimized ]; then flags=(-O); fi
          python -I -B "${flags[@]}" research/gmi-countable-row-corrigendum-v1/test_countable_rows_v1.py -v
          python -I -B "${flags[@]}" research/gmi-adaptive-creation-v1/test_adaptive_creation_v1.py -v
