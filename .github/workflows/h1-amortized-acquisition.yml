name: H1 amortized acquisition polynomial microscope

on:
  pull_request:
    paths:
      - 'research/h1-amortized-acquisition-v1/**'
      - '.github/workflows/h1-amortized-acquisition.yml'
      - 'src/ocm/learning/methods.py'
      - 'src/ocm/runtime/**'
      - 'src/ocm/kso/**'
      - 'src/ocm/store/**'
  push:
    branches: [main]
    paths:
      - 'research/h1-amortized-acquisition-v1/**'
      - '.github/workflows/h1-amortized-acquisition.yml'

permissions:
  contents: read

jobs:
  h1-amortized-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/h1-amortized-acquisition-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/h1-acq-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/h1-amortized-acquisition-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
          python -B -O -m unittest discover -s research/h1-amortized-acquisition-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests-optimized.txt"
      - name: H1 amortized-acquisition study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/h1-acq-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/h1-amortized-acquisition-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
          cp research/h1-amortized-acquisition-v1/RESULT.json "$out/capsule-RESULT.json"
      - name: Production src unchanged
        if: always()
        run: git diff --exit-code -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-amortized-acquisition
          path: '${{ runner.temp }}/h1-acq-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
