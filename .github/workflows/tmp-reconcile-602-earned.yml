name: Temporary reconcile four earned 602 rows

on:
  push:
    branches:
      - ops/reconcile-602-earned-20260915
    paths:
      - .github/workflows/tmp-reconcile-602-earned.yml

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Tick exactly four earned rows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/issues/602'
          headers={
            'Accept':'application/vnd.github+json',
            'Authorization':f'Bearer {token}',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'orion-602-reconciler',
          }
          def request(url, method='GET', data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=body)
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          issue=request(api); body=issue.get('body') or ''
          replacements={
"- [ ] Held-out ecology where neural morphology is predicted to win. — 🟡 **NOT CLAIMED.** The recoveries in MIM`GMI_CREDIT_ASSIGNMENT_DERIVATION_V1.md` are **retrospective** — the obligations were chosen knowing which side of the linear boundary they fall on. A held-out ecology needs the prediction registered before the outcome is seen.":
"- [x] Held-out ecology where neural morphology is predicted to win. — ✅ #676 clean V3: fresh 9-bit held-out shell frozen before exhaustive scoring; frozen cutoff residual 126 reproduced exactly and `weighted_local_composition` was the unique valid winner under the 32-cell cap. The failed V2 preregistration remains preserved separately; no universal neural-win claim.",
"- [ ] Predict failure modes before testing.":
"- [x] Predict failure modes before testing. — ✅ #682 froze held-family deficit predictions before outcomes (`communication`, `planning`, `routing`, `state`, `verification` failures plus allowed abstentions); #683 scored the immutable freeze with an independent oracle, 20/20 determinate cells correct.",
"- [ ] Demonstrate history improves unseen-task acquisition, not merely solution reuse.":
"- [x] Demonstrate history improves unseen-task acquisition, not merely solution reuse. — ✅ #356: every protected target was disjoint from developmental history; `LIBRARY_ONLY == RESET`, shuffled history was worse than reset, and inherited history reduced verified acquisition burden across fresh worlds/hosts.",
"- [ ] Construct negative-transfer worlds.":
"- [x] Construct negative-transfer worlds. — ✅ #237 HST negative-transfer hostile: exact two-ecology counterexample with disjoint admissible sets; ERM trained on one ecology has target-ecology risk 1 versus flat prior 1/2 (excess +1/2)."
          }
          for old,new in replacements.items():
              c=body.count(old)
              if c!=1:
                  raise SystemExit(f'FAIL_CLOSED expected exactly one old row, got {c}: {old[:90]}')
              body=body.replace(old,new,1)
          updated=request(api,'PATCH',{'body':body})
          check=updated.get('body') or ''
          for new in replacements.values():
              if check.count(new)!=1:
                  raise SystemExit('post-write verification failed')
          print('RECONCILED_602_ROWS=4')
          PY
