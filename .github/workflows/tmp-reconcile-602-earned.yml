name: Temporary reconcile four earned 602 rows

on:
  push:
    branches:
      - ops/reconcile-602-earned-20260915
    paths:
      - .github/workflows/tmp-reconcile-602-earned.yml

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Tick exactly four earned rows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/issues/602'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'orion-602-reconciler'}
          def request(method='GET', data=None):
              raw=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api,headers=headers,method=method,data=raw)
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          body=request().get('body') or ''
          targets=[
              ('Held-out ecology where neural morphology is predicted to win.', '- [x] Held-out ecology where neural morphology is predicted to win. — ✅ #676 clean V3: fresh 9-bit held-out shell frozen before exhaustive scoring; frozen cutoff residual 126 reproduced exactly and `weighted_local_composition` was the unique valid winner under the 32-cell cap. The failed V2 preregistration remains preserved separately; no universal neural-win claim.'),
              ('Predict failure modes before testing.', '- [x] Predict failure modes before testing. — ✅ #682 froze held-family deficit predictions before outcomes (`communication`, `planning`, `routing`, `state`, `verification` failures plus allowed abstentions); #683 scored the immutable freeze with an independent oracle, 20/20 determinate cells correct.'),
              ('Demonstrate history improves unseen-task acquisition, not merely solution reuse.', '- [x] Demonstrate history improves unseen-task acquisition, not merely solution reuse. — ✅ #356: every protected target was disjoint from developmental history; `LIBRARY_ONLY == RESET`, shuffled history was worse than reset, and inherited history reduced verified acquisition burden across fresh worlds/hosts.'),
              ('Construct negative-transfer worlds.', '- [x] Construct negative-transfer worlds. — ✅ #237 HST negative-transfer hostile: exact two-ecology counterexample with disjoint admissible sets; ERM trained on one ecology has target-ecology risk 1 versus flat prior 1/2 (excess +1/2).'),
          ]
          lines=body.splitlines()
          changed=0
          for label,newline in targets:
              hits=[i for i,line in enumerate(lines) if line.startswith('- [') and label in line]
              if len(hits)!=1:
                  raise SystemExit(f'FAIL_CLOSED {label!r} matches={len(hits)}')
              i=hits[0]
              if lines[i].startswith('- [x]'):
                  continue
              if not lines[i].startswith('- [ ]'):
                  raise SystemExit(f'FAIL_CLOSED unexpected state: {lines[i]}')
              lines[i]=newline; changed+=1
          if changed:
              newbody='\n'.join(lines)
              if body.endswith('\n'): newbody+='\n'
              updated=request('PATCH',{'body':newbody})
              check=updated.get('body') or ''
          else:
              check=body
          for label,_ in targets:
              hits=[line for line in check.splitlines() if line.startswith('- [x]') and label in line]
              if len(hits)!=1:
                  raise SystemExit(f'post-write verification failed for {label}')
          print(f'RECONCILED_602_ROWS_CHANGED={changed}')
          PY
