name: gmi-p0-zero-prior-closure-v1
on:
  push:
    paths: ["research/gmi-p0-zero-prior-closure-v1/**", ".github/workflows/gmi-p0-zero-prior-closure-v1.yml"]
  pull_request:
    paths: ["research/gmi-p0-zero-prior-closure-v1/**", ".github/workflows/gmi-p0-zero-prior-closure-v1.yml"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { mode: [normal, optimized] }
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: research/gmi-p0-zero-prior-closure-v1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tests
        run: |
          if [[ "${{ matrix.mode }}" == "optimized" ]]; then PY="python -O"; else PY="python"; fi
          $PY test_p0_zero_prior_closure_v1.py -v
          $PY p0_zero_prior_closure_v1.py >/tmp/out.json
          python -c 'import json; a=json.load(open("RECEIPT_V1.json")); b=json.load(open("/tmp/out.json")); assert a==b'
