name: L1 linguistic G2 causal reuse

on:
  pull_request:
    paths:
      - 'research/l1-linguistic-g2-v1/**'
      - '.github/workflows/l1-linguistic-g2.yml'
      - 'src/ocm/language/**'
  push:
    branches: [main]
    paths:
      - 'research/l1-linguistic-g2-v1/**'
      - '.github/workflows/l1-linguistic-g2.yml'

permissions:
  contents: read

jobs:
  linguistic-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/research/l1-linguistic-g2-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Protocol tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-g2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python -B -m unittest discover -s research/l1-linguistic-g2-v1 -p 'test_*.py' -v 2>&1 | tee "$out/tests.txt"
      - name: Microworld study
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l1-g2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B research/l1-linguistic-g2-v1/experiment.py "$out/RESULT.json" | tee "$out/console.txt"
      - name: Source custody
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-linguistic-g2
          path: '${{ runner.temp }}/l1-g2-${{ github.run_id }}-${{ github.run_attempt }}/*'
          if-no-files-found: error
